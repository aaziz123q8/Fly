<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إدارة المحتوى — لوحة الإدارة</title>
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/admin.css?v=2026070204">
</head>
<body>
<div class="admin-layout">
    <aside class="sidebar" id="adminSidebar"></aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h1>📝 إدارة المحتوى (CMS)</h1>
      <button class="btn btn-primary btn-sm" onclick="openAdd()">+ صفحة جديدة</button>
    </div>

    <div class="admin-content">
      <div class="table-card">
        <div id="tableLoading" class="loading-state" style="padding:48px">
          <div class="spinner"></div><p>جاري التحميل...</p>
        </div>
        <div id="tableWrapper" style="display:none;overflow-x:auto">
          <table>
            <thead>
              <tr>
                <th>العنوان (AR)</th>
                <th>العنوان (EN)</th>
                <th>Slug</th>
                <th>الحالة</th>
                <th>آخر تعديل</th>
                <th>الإجراءات</th>
              </tr>
            </thead>
            <tbody id="pagesTable"></tbody>
          </table>
        </div>
        <div id="emptyState" class="empty-state" style="display:none">
          <div class="empty-icon">📝</div>
          <h3>لا توجد صفحات</h3>
          <p>أنشئ صفحة جديدة لتبدأ</p>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Page Editor Modal -->
<div id="pageModal" class="modal-overlay" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal" style="max-width:700px;max-height:85vh;display:flex;flex-direction:column">
    <div class="modal-header">
      <h3 id="pageModalTitle">صفحة جديدة</h3>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" style="flex:1;overflow-y:auto">
      <input type="hidden" id="pageId">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
        <div class="form-group">
          <label class="form-label">العنوان (عربي)</label>
          <input type="text" class="form-control" id="pageTitleAr" dir="rtl">
        </div>
        <div class="form-group">
          <label class="form-label">العنوان (إنجليزي)</label>
          <input type="text" class="form-control" id="pageTitleEn" dir="ltr">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Slug (رابط الصفحة)</label>
        <input type="text" class="form-control" id="pageSlug" dir="ltr" placeholder="مثال: about-us, privacy-policy">
      </div>
      <div class="form-group">
        <label class="form-label">المحتوى (عربي)</label>
        <textarea class="form-control" id="pageContentAr" rows="6" dir="rtl" placeholder="محتوى الصفحة بالعربية..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">المحتوى (إنجليزي)</label>
        <textarea class="form-control" id="pageContentEn" rows="6" dir="ltr" placeholder="Page content in English..."></textarea>
      </div>
      <div class="form-group">
        <label class="form-label">الحالة</label>
        <select class="form-control" id="pageStatus">
          <option value="published">منشور</option>
          <option value="draft">مسودة</option>
        </select>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">إلغاء</button>
      <button class="btn btn-primary" onclick="savePage()">حفظ</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="../js/auth.js"></script>
<script src="../js/api.js"></script>
<script src="../js/admin.js?v=2026070204"></script>
<script src="../js/admin-sidebar.js?v=2026070204"></script>
<script>

function loadPages() {
  document.getElementById('tableLoading').style.display = 'block';
  document.getElementById('tableWrapper').style.display = 'none';
  document.getElementById('emptyState').style.display   = 'none';

  Api.get('/api/admin/cms/pages', true).then(function(res) {
    document.getElementById('tableLoading').style.display = 'none';
    var pages = res.data || res;
    if (!pages || pages.length === 0) { document.getElementById('emptyState').style.display = 'block'; return; }
    document.getElementById('tableWrapper').style.display = 'block';

    var html = '';
    pages.forEach(function(p) {
      var statusBadge = p.status === 'published'
        ? '<span class="badge badge-success">منشور</span>'
        : '<span class="badge badge-warning">مسودة</span>';
      html += '<tr>' +
        '<td><strong>' + (p.title_ar || p.title || '—') + '</strong></td>' +
        '<td>' + (p.title_en || '—') + '</td>' +
        '<td style="direction:ltr;text-align:right;font-family:monospace;font-size:.8rem">' + p.slug + '</td>' +
        '<td>' + statusBadge + '</td>' +
        '<td style="font-size:.8rem;color:var(--text-muted)">' + (p.updated_at ? new Date(p.updated_at).toLocaleDateString('ar-KW') : '—') + '</td>' +
        '<td style="display:flex;gap:6px">' +
          '<button class="btn btn-ghost btn-sm" onclick="openEdit(' + JSON.stringify(p).replace(/"/g,'&quot;') + ')">تعديل</button>' +
          '<button class="btn btn-ghost btn-sm" onclick="deletePage(' + p.id + ')" style="color:var(--danger)">حذف</button>' +
        '</td>' +
        '</tr>';
    });
    document.getElementById('pagesTable').innerHTML = html;
  }).catch(function() {
    document.getElementById('tableLoading').style.display = 'none';
    document.getElementById('emptyState').style.display = 'block';
  });
}

function openAdd() {
  document.getElementById('pageId').value        = '';
  document.getElementById('pageTitleAr').value   = '';
  document.getElementById('pageTitleEn').value   = '';
  document.getElementById('pageSlug').value      = '';
  document.getElementById('pageContentAr').value = '';
  document.getElementById('pageContentEn').value = '';
  document.getElementById('pageStatus').value    = 'published';
  document.getElementById('pageModalTitle').textContent = 'صفحة جديدة';
  document.getElementById('pageModal').style.display = 'flex';
}

function openEdit(p) {
  document.getElementById('pageId').value        = p.id;
  document.getElementById('pageTitleAr').value   = p.title_ar || p.title || '';
  document.getElementById('pageTitleEn').value   = p.title_en || '';
  document.getElementById('pageSlug').value      = p.slug || '';
  document.getElementById('pageContentAr').value = p.content_ar || p.content || '';
  document.getElementById('pageContentEn').value = p.content_en || '';
  document.getElementById('pageStatus').value    = p.status || 'draft';
  document.getElementById('pageModalTitle').textContent = 'تعديل الصفحة';
  document.getElementById('pageModal').style.display = 'flex';
}

function closeModal() { document.getElementById('pageModal').style.display = 'none'; }

function savePage() {
  var id = document.getElementById('pageId').value;
  var payload = {
    title_ar:   document.getElementById('pageTitleAr').value,
    title_en:   document.getElementById('pageTitleEn').value,
    title:      document.getElementById('pageTitleAr').value,
    slug:       document.getElementById('pageSlug').value,
    content_ar: document.getElementById('pageContentAr').value,
    content_en: document.getElementById('pageContentEn').value,
    content:    document.getElementById('pageContentAr').value,
    status:     document.getElementById('pageStatus').value,
  };
  var req = id ? Api.put('/api/admin/cms/pages/' + id, payload, true) : Api.post('/api/admin/cms/pages', payload, true);
  req.then(function() { closeModal(); loadPages(); });
}

function deletePage(id) {
  if (!confirm('هل تريد حذف هذه الصفحة؟')) return;
  Api.delete('/api/admin/cms/pages/' + id, true).then(function() { loadPages(); });
}

loadPages();
</script>
</body>
</html>
