<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المسافرون — لوحة الإدارة</title>
  <link rel="stylesheet" href="../css/app.css">
</head>
<body>
<div class="admin-layout">
    <aside class="sidebar" id="adminSidebar"></aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h1>👥 إدارة المسافرين</h1>
      <div style="display:flex;align-items:center;gap:10px">
        <span id="totalCount" style="font-size:.85rem;color:var(--text-muted)"></span>
      </div>
    </div>

    <div class="admin-content">
      <div class="table-card">
        <div class="card-header">
          <span style="font-weight:700">قائمة المسافرين</span>
          <div class="table-search">
            <input type="search" class="form-control" id="searchInput" placeholder="البحث بالاسم أو البريد..." oninput="debouncedSearch()" style="min-width:260px">
            <select class="form-control" id="statusFilter" onchange="loadTravelers()" style="width:auto">
              <option value="">كل الحالات</option>
              <option value="active">نشط</option>
              <option value="inactive">غير نشط</option>
            </select>
          </div>
        </div>

        <!-- Loading -->
        <div id="tableLoading" class="loading-state" style="padding:48px">
          <div class="spinner"></div>
          <p>جاري تحميل البيانات...</p>
        </div>

        <!-- Table -->
        <div id="tableWrapper" style="display:none;overflow-x:auto">
          <table>
            <thead>
              <tr>
                <th>#</th>
                <th>الاسم</th>
                <th>البريد الإلكتروني</th>
                <th>الهاتف</th>
                <th>تاريخ التسجيل</th>
                <th>الحجوزات</th>
                <th>الحالة</th>
                <th>الإجراءات</th>
              </tr>
            </thead>
            <tbody id="travelersTable"></tbody>
          </table>
        </div>

        <div id="emptyState" class="empty-state" style="display:none">
          <div class="empty-icon">👥</div>
          <h3>لا يوجد مسافرون</h3>
          <p>لم يتم العثور على نتائج مطابقة للبحث</p>
        </div>

        <div id="paginationContainer" class="pagination"></div>
      </div>
    </div>
  </main>
</div>

<!-- View User Modal -->
<div class="modal-overlay" id="userModal">
  <div class="modal">
    <div class="modal-header">
      <h2 class="modal-title">👤 تفاصيل المسافر</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div id="userModalContent"></div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="../js/auth.js"></script>
<script src="../js/api.js"></script>
<script src="../js/admin.js"></script>
<script src="../js/admin-sidebar.js"></script>
<script>
  const user = Auth.getUser();
  if (!Auth.isLoggedIn() || !user || (user.role !== 'admin' && user.role !== 'super_admin')) {
    window.location.href = 'login.html';
  }

  let currentPage = 1;
  let searchTimer;

  function debouncedSearch() {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => { currentPage = 1; loadTravelers(); }, 400);
  }

  async function loadTravelers() {
    const search = document.getElementById('searchInput').value;
    const status = document.getElementById('statusFilter').value;
    document.getElementById('tableLoading').style.display = 'block';
    document.getElementById('tableWrapper').style.display = 'none';
    document.getElementById('emptyState').style.display = 'none';

    try {
      const params = new URLSearchParams({ page: currentPage, limit: 20, search, status });
      const res = await Api.get(`/api/admin/travelers?${params}`, true);
      const list = res.data || res.users || (Array.isArray(res) ? res : []);
      const total = (res.meta && res.meta.total) || res.total || res.count || list.length;

      document.getElementById('totalCount').textContent = `${total} مسافر`;

      if (!list.length) {
        document.getElementById('emptyState').style.display = 'block';
      } else {
        document.getElementById('tableWrapper').style.display = 'block';
        document.getElementById('travelersTable').innerHTML = list.map((u, i) => `
        <tr>
          <td style="color:var(--text-muted)">${(currentPage-1)*20 + i + 1}</td>
          <td>
            <div style="display:flex;align-items:center;gap:8px">
              <div class="user-avatar" style="width:32px;height:32px;font-size:.75rem">${(u.first_name || u.email || '?')[0].toUpperCase()}</div>
              <div>
                <div style="font-weight:600;font-size:.9rem">${u.first_name || ''} ${u.last_name || ''}</div>
              </div>
            </div>
          </td>
          <td>${u.email || '—'}</td>
          <td>${u.phone_country_code && u.phone_number ? u.phone_country_code + ' ' + u.phone_number : (u.phone || '—')}</td>
          <td style="color:var(--text-muted);font-size:.85rem">${u.created_at ? new Date(u.created_at).toLocaleDateString('ar-SA') : '—'}</td>
          <td style="text-align:center">${u.bookings_count || u.bookings || '—'}</td>
          <td>${Admin.renderStatusBadge(u.is_active == 1 ? 'active' : 'inactive')}</td>
          <td>
            <div class="table-actions">
              <button class="btn btn-ghost btn-sm" onclick="viewUser('${u.id}')">عرض</button>
              <button class="btn btn-sm ${u.is_active == 1 ? 'btn-danger' : 'btn-success'}"
                onclick="toggleStatus('${u.id}', ${u.is_active == 1 ? 0 : 1}, this)">
                ${u.is_active == 1 ? 'إيقاف' : 'تفعيل'}
              </button>
            </div>
          </td>
        </tr>`).join('');

        // Pagination
        const pages = Math.ceil(total / 20);
        const pc = document.getElementById('paginationContainer');
        if (pages > 1) {
          let html = '<div class="pagination">';
          if (currentPage > 1) html += `<button class="btn btn-ghost btn-sm" onclick="goPage(${currentPage-1})">السابق</button>`;
          for (let i = Math.max(1,currentPage-2); i <= Math.min(pages,currentPage+2); i++) {
            html += `<button class="btn btn-sm ${i===currentPage?'btn-primary':'btn-ghost'}" onclick="goPage(${i})">${i}</button>`;
          }
          if (currentPage < pages) html += `<button class="btn btn-ghost btn-sm" onclick="goPage(${currentPage+1})">التالي</button>`;
          html += '</div>';
          pc.innerHTML = html;
        } else { pc.innerHTML = ''; }
      }
    } catch (err) {
      showToast(err.message || 'تعذر تحميل البيانات', 'error');
      document.getElementById('emptyState').style.display = 'block';
      document.getElementById('emptyState').innerHTML = '<div class="empty-icon">❌</div><h3>خطأ في تحميل البيانات</h3><p>' + (err.message || '') + '</p>';
    } finally {
      document.getElementById('tableLoading').style.display = 'none';
    }
  }

  function goPage(p) { currentPage = p; loadTravelers(); }

  async function toggleStatus(userId, newIsActive, btn) {
    btn.disabled = true;
    try {
      await Api.put(`/api/admin/travelers/${userId}`, { is_active: Number(newIsActive) }, true);
      showToast(`تم ${newIsActive == 1 ? 'تفعيل' : 'إيقاف'} المستخدم`, 'success');
      loadTravelers();
    } catch (err) {
      showToast(err.message || 'فشل تحديث الحالة', 'error');
      btn.disabled = false;
    }
  }

  async function viewUser(userId) {
    const el = document.getElementById('userModalContent');
    el.innerHTML = '<div class="loading-state" style="padding:32px"><div class="spinner"></div></div>';
    document.getElementById('userModal').classList.add('active');
    try {
      const res = await Api.get(`/api/admin/travelers/${userId}`, true);
      const u = res.data || res.user || res;
      const travelers = res.travelers || [];
      const travelerRows = travelers.length ? travelers.map(t => `
        <div style="background:var(--bg);border-radius:10px;padding:14px;margin-bottom:10px">
          <div style="font-weight:700;margin-bottom:8px;color:var(--primary)">${t.first_name||''} ${t.middle_name||''} ${t.last_name||''}</div>
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:.82rem">
            <div><span style="color:var(--text-muted)">الجنس:</span> ${t.gender==='male'?'ذكر':t.gender==='female'?'أنثى':'—'}</div>
            <div><span style="color:var(--text-muted)">الجنسية:</span> ${t.nationality||'—'}</div>
            <div><span style="color:var(--text-muted)">تاريخ الميلاد:</span> ${t.date_of_birth||'—'}</div>
            <div><span style="color:var(--text-muted)">الدولة:</span> ${t.country||'—'}</div>
            <div><span style="color:var(--text-muted)">كود الهاتف:</span> ${t.phone_country_code||'—'}</div>
            <div><span style="color:var(--text-muted)">رقم الهاتف:</span> ${t.phone_number||t.phone||'—'}</div>
            <div><span style="color:var(--text-muted)">البريد:</span> ${t.email||'—'}</div>
            <div><span style="color:var(--text-muted)">نوع الوثيقة:</span> ${t.document_type||'—'}</div>
            <div><span style="color:var(--text-muted)">رقم الوثيقة:</span> ${t.document_number||'—'}</div>
            <div><span style="color:var(--text-muted)">تاريخ الإصدار:</span> ${t.issue_date||t.document_issue||'—'}</div>
            <div><span style="color:var(--text-muted)">تاريخ الانتهاء:</span> ${t.expiry_date||t.document_expiry||'—'}</div>
          </div>
        </div>`).join('') : '<p style="color:var(--text-muted);font-size:.85rem">لا توجد بيانات مسافر مرتبطة</p>';
      el.innerHTML = `
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:20px">
          <div><div style="font-size:.75rem;color:var(--text-muted);margin-bottom:4px">الاسم الأول</div><div style="font-weight:600">${u.first_name || '—'}</div></div>
          <div><div style="font-size:.75rem;color:var(--text-muted);margin-bottom:4px">الاسم الأخير</div><div style="font-weight:600">${u.last_name || '—'}</div></div>
          <div><div style="font-size:.75rem;color:var(--text-muted);margin-bottom:4px">البريد الإلكتروني</div><div style="font-weight:600">${u.email || '—'}</div></div>
          <div><div style="font-size:.75rem;color:var(--text-muted);margin-bottom:4px">الهاتف</div><div style="font-weight:600">${(u.phone_country_code||'')+' '+(u.phone_number||u.phone||'—')}</div></div>
          <div><div style="font-size:.75rem;color:var(--text-muted);margin-bottom:4px">الحجوزات</div><div style="font-weight:600">${u.bookings_count || 0}</div></div>
          <div><div style="font-size:.75rem;color:var(--text-muted);margin-bottom:4px">إجمالي الإنفاق</div><div style="font-weight:700;color:var(--primary)">${u.total_spent ? Number(u.total_spent).toLocaleString('ar') + ' £' : '—'}</div></div>
          <div><div style="font-size:.75rem;color:var(--text-muted);margin-bottom:4px">الحالة</div><div>${Admin.renderStatusBadge(u.is_active ? 'active' : 'inactive')}</div></div>
          <div><div style="font-size:.75rem;color:var(--text-muted);margin-bottom:4px">تاريخ التسجيل</div><div style="font-weight:600">${u.created_at ? new Date(u.created_at).toLocaleDateString('ar-SA') : '—'}</div></div>
        </div>
        ${(res.flight_bookings||[]).length || (res.hotel_bookings||[]).length ? `
        <div style="border-top:1px solid #f0f2f5;padding-top:14px;margin-bottom:14px">
          <div style="font-weight:700;margin-bottom:10px;font-size:.9rem">آخر الحجوزات</div>
          ${[...(res.flight_bookings||[]).map(b=>`<div style="display:flex;justify-content:space-between;font-size:.82rem;padding:6px 0;border-bottom:1px solid #f5f5f5"><span>✈️ ${b.booking_reference||b.id} — ${b.origin_airport||''} → ${b.destination_airport||''}</span><span>${Admin.renderStatusBadge(b.status)}</span></div>`),
            ...(res.hotel_bookings||[]).map(b=>`<div style="display:flex;justify-content:space-between;font-size:.82rem;padding:6px 0;border-bottom:1px solid #f5f5f5"><span>🏨 ${b.booking_reference||b.id}</span><span>${Admin.renderStatusBadge(b.status)}</span></div>`)].join('')}
        </div>` : ''}
        <div style="border-top:1px solid #f0f2f5;padding-top:14px">
          <div style="font-weight:700;margin-bottom:10px;font-size:.9rem">بيانات المسافرين المرفقة</div>
          ${travelerRows}
        </div>`;
    } catch {
      el.innerHTML = '<div class="alert alert-error">تعذر تحميل بيانات المستخدم</div>';
    }
  }

  function closeModal() { document.getElementById('userModal').classList.remove('active'); }

  function showToast(msg, type='info') {
    let c = document.getElementById('toastContainer');
    const t = document.createElement('div');
    t.className = `toast toast-${type}`;
    t.innerHTML = `<span>${msg}</span>`;
    c.appendChild(t);
    requestAnimationFrame(() => t.classList.add('show'));
    setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3500);
  }

  loadTravelers();
</script>
</body>
</html>
