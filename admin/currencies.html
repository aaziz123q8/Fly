<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>العملات — لوحة الإدارة</title>
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/admin.css?v=2026070301">
</head>
<body>
<div class="admin-layout">
    <aside class="sidebar" id="adminSidebar"></aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h1><span data-ic="currencies" data-ic-size="22"></span> العملات</h1>
      <div class="topbar-actions">
        <button class="adm-btn ghost sm" onclick="refreshRates()"><span data-ic="refresh" data-ic-size="15"></span> تحديث الأسعار</button>
        <button class="adm-btn sm" onclick="openAdd()"><span data-ic="plus" data-ic-size="15"></span> إضافة عملة</button>
      </div>
    </div>

    <div class="admin-content">
      <div class="adm-note">
        <span data-ic="currencies"></span>
        <div>العملة الأساسية هي <strong>GBP (الجنيه الإسترليني)</strong>. جميع الأسعار تُخزّن بالجنيه الإسترليني وتُعرض بعملة المستخدم المختارة.</div>
      </div>

      <div class="table-card">
        <div id="tableLoading" class="loading-state" style="padding:48px">
          <div class="spinner"></div><p>جاري التحميل...</p>
        </div>
        <div id="tableWrapper" style="display:none;overflow-x:auto">
          <table>
            <thead>
              <tr>
                <th>الرمز</th>
                <th>الاسم</th>
                <th>رمز العملة</th>
                <th>سعر الصرف (مقابل GBP)</th>
                <th>آخر تحديث</th>
                <th>الحالة</th>
                <th>الإجراءات</th>
              </tr>
            </thead>
            <tbody id="currenciesTable"></tbody>
          </table>
        </div>
        <div id="emptyState" class="adm-empty" style="display:none">
          <span data-ic="currencies" data-ic-size="40"></span><h4>لا توجد عملات</h4><p>ابدأ بإضافة عملة جديدة</p>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Add/Edit Modal -->
<div id="curModal" class="adm-modal" onclick="if(event.target===this)closeModal()">
  <div class="adm-modal-card" style="max-width:440px">
    <div class="adm-modal-head">
      <h3 id="curModalTitle"><span data-ic="currencies" data-ic-size="18"></span> إضافة عملة</h3>
      <button class="adm-modal-x" onclick="closeModal()"><span data-ic="close" data-ic-size="16"></span></button>
    </div>
    <div class="adm-modal-body">
      <input type="hidden" id="curId">
      <div class="adm-field">
        <label>رمز العملة (ISO 4217)</label>
        <input type="text" class="adm-input" id="curCode" placeholder="مثال: USD, KWD, SAR" maxlength="3" style="text-transform:uppercase" dir="ltr">
      </div>
      <div class="adm-field">
        <label>الاسم</label>
        <input type="text" class="adm-input" id="curName" placeholder="مثال: دولار أمريكي">
      </div>
      <div class="adm-row2">
        <div class="adm-field">
          <label>رمز العرض</label>
          <input type="text" class="adm-input" id="curSymbol" placeholder="مثال: $, ك.د, ر.س">
        </div>
        <div class="adm-field">
          <label>سعر الصرف (1 GBP = ؟)</label>
          <input type="number" class="adm-input" id="curRate" step="0.0001" min="0.0001" placeholder="1.0000" dir="ltr">
        </div>
      </div>
      <div class="adm-field">
        <label>الحالة</label>
        <select class="adm-select" id="curStatus">
          <option value="1">نشط</option>
          <option value="0">غير نشط</option>
        </select>
      </div>
    </div>
    <div class="adm-modal-foot">
      <button class="adm-btn ghost" onclick="closeModal()">إلغاء</button>
      <button class="adm-btn" onclick="saveCurrency()">حفظ</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="../js/auth.js"></script>
<script src="../js/api.js"></script>
<script src="../js/admin.js?v=2026070301"></script>
<script src="../js/admin-icons.js?v=2026070301"></script>
<script src="../js/admin-sidebar.js?v=2026070301"></script>
<script>

function loadCurrencies() {
  document.getElementById('tableLoading').style.display = 'block';
  document.getElementById('tableWrapper').style.display = 'none';
  document.getElementById('emptyState').style.display   = 'none';

  Api.get('/api/admin/currencies', true).then(function(res) {
    document.getElementById('tableLoading').style.display = 'none';
    if (!res.data || res.data.length === 0) { document.getElementById('emptyState').style.display = 'block'; return; }
    document.getElementById('tableWrapper').style.display = 'block';

    var html = '';
    res.data.forEach(function(c) {
      var isBase = c.code === 'GBP';
      html += '<tr>' +
        '<td><strong style="font-family:monospace;font-size:1rem">' + c.code + '</strong></td>' +
        '<td>' + c.name + '</td>' +
        '<td style="font-size:1.1rem">' + (c.symbol || '—') + '</td>' +
        '<td>' + (isBase ? '<span class="badge badge-info">أساسي</span>' : parseFloat(c.rate_to_gbp).toFixed(4)) + '</td>' +
        '<td style="font-size:.8rem;color:var(--adm-muted)">' + (c.updated_at ? new Date(c.updated_at).toLocaleString('ar-KW') : '—') + '</td>' +
        '<td>' + (c.is_active == 1 ? '<span class="badge badge-success">نشط</span>' : '<span class="badge badge-danger">غير نشط</span>') + '</td>' +
        '<td>' +
          '<div class="table-actions">' +
          (isBase ? '<span style="color:var(--adm-muted);font-size:.8rem">لا يمكن تعديله</span>' :
            '<button class="adm-act" onclick="openEdit(' + JSON.stringify(c).replace(/"/g,'&quot;') + ')">' + Admin.icon('edit',15) + ' تعديل</button>' +
            '<button class="adm-act danger" onclick="deleteCurrency(' + c.id + ')">' + Admin.icon('trash',15) + ' حذف</button>'
          ) +
          '</div>' +
        '</td>' +
        '</tr>';
    });
    document.getElementById('currenciesTable').innerHTML = html;
  }).catch(function() {
    document.getElementById('tableLoading').style.display = 'none';
    document.getElementById('emptyState').style.display = 'block';
  });
}

function openAdd() {
  document.getElementById('curId').value = '';
  document.getElementById('curCode').value = '';
  document.getElementById('curName').value = '';
  document.getElementById('curSymbol').value = '';
  document.getElementById('curRate').value = '';
  document.getElementById('curStatus').value = '1';
  document.getElementById('curModalTitle').innerHTML = Admin.icon('currencies',18) + ' إضافة عملة';
  document.getElementById('curCode').disabled = false;
  document.getElementById('curModal').classList.add('open');
}

function openEdit(c) {
  document.getElementById('curId').value     = c.id;
  document.getElementById('curCode').value   = c.code;
  document.getElementById('curName').value   = c.name;
  document.getElementById('curSymbol').value = c.symbol || '';
  document.getElementById('curRate').value   = c.rate_to_gbp;
  document.getElementById('curStatus').value = c.is_active == 1 ? '1' : '0';
  document.getElementById('curModalTitle').innerHTML = Admin.icon('edit',18) + ' تعديل العملة';
  document.getElementById('curCode').disabled = true;
  document.getElementById('curModal').classList.add('open');
}

function closeModal() { document.getElementById('curModal').classList.remove('open'); }

function saveCurrency() {
  var id = document.getElementById('curId').value;
  var payload = {
    code:        document.getElementById('curCode').value.toUpperCase(),
    name:        document.getElementById('curName').value,
    symbol:      document.getElementById('curSymbol').value,
    rate_to_gbp: parseFloat(document.getElementById('curRate').value) || 1,
    is_active:   parseInt(document.getElementById('curStatus').value),
  };
  var req = id ? Api.put('/api/admin/currencies/' + id, payload, true) : Api.post('/api/admin/currencies', payload, true);
  req.then(function() { closeModal(); loadCurrencies(); });
}

function deleteCurrency(id) {
  if (!confirm('هل تريد حذف هذه العملة؟')) return;
  Api.delete('/api/admin/currencies/' + id, true).then(function() { loadCurrencies(); });
}

function refreshRates() {
  Api.post('/api/admin/currencies/refresh-rates', {}, true).then(function() {
    showToast('تم طلب تحديث الأسعار', 'success');
    loadCurrencies();
  }).catch(function(e) {
    showToast(e.message || 'تعذّر تحديث الأسعار', 'error');
  });
}

loadCurrencies();
</script>
</body>
</html>
