<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الحجوزات — لوحة الإدارة</title>
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/admin.css?v=2026070301">
  <style>
    /* ===== Print Styles ===== */
    @media print {
      .admin-layout > aside,
      .admin-topbar,
      .adm-toolbar,
      .table-card,
      #paginationContainer,
      .toast-container { display: none !important; }
      .adm-modal { position: static !important; background: none !important; backdrop-filter: none !important; padding: 0 !important; }
      .adm-modal-card { box-shadow: none !important; max-height: none !important; overflow: visible !important; border-radius: 0 !important; width: auto !important; max-width: none !important; }
      .adm-modal-x, .print-actions, .adm-modal-foot, .adm-modal-head, #statusModal, #bookingModalContent { display: none !important; }
      .admin-content, .admin-main, body, html { overflow: visible !important; }
      .print-receipt { display: block !important; font-family: Arial, sans-serif; direction: rtl; padding: 20px; }
    }

    /* ===== Details Modal Layout (bespoke) ===== */
    .booking-modal-body { padding: 20px 22px; max-height: 72vh; overflow-y: auto; }
    .detail-section {
      border: 1px solid var(--adm-line, #e5e7eb);
      border-radius: 12px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .detail-section-title {
      background: var(--adm-soft, #f8f9fa);
      padding: 10px 16px;
      font-size: .8rem;
      font-weight: 700;
      color: var(--adm-1, #7C3AED);
      letter-spacing: .3px;
      border-bottom: 1px solid var(--adm-line, #e5e7eb);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .detail-section-title .ai { color: inherit; }
    .detail-section-body { padding: 14px 16px; }
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 12px;
    }
    .detail-item label {
      display: block;
      font-size: .72rem;
      color: var(--adm-muted, #6b7280);
      margin-bottom: 3px;
    }
    .detail-item span { font-size: .9rem; font-weight: 600; }
    .passenger-table { width: 100%; border-collapse: collapse; }
    .passenger-table th, .passenger-table td {
      padding: 8px 12px;
      font-size: .82rem;
      border-bottom: 1px solid var(--adm-line, #e5e7eb);
      text-align: right;
    }
    .passenger-table th { font-weight: 700; color: var(--adm-muted, #6b7280); background: var(--adm-soft, #f8f9fa); }
    .booking-ref-badge {
      font-family: monospace;
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--adm-1, #7C3AED);
      letter-spacing: 1px;
    }
    .segment-card {
      background: linear-gradient(135deg, #eff6ff 0%, #f0fdf4 100%);
      border: 1px solid #bfdbfe;
      border-radius: 10px;
      padding: 14px 16px;
      margin-bottom: 10px;
    }
    .segment-route {
      display: flex;
      align-items: center;
      gap: 12px;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .segment-route .iata { font-size: 1.4rem; font-weight: 900; color: var(--adm-1, #7C3AED); }
    .segment-route .arrow { color: #9ca3af; font-size: 1.1rem; }
    .segment-meta { font-size: .78rem; color: var(--adm-muted, #6b7280); display: flex; gap: 14px; flex-wrap: wrap; align-items: center; }
    .segment-meta span { display: inline-flex; align-items: center; gap: 5px; }
    .pnr-box { background: #fff8e1; border-radius: 8px; padding: 10px 14px; margin-bottom: 12px; }
    .pnr-box .pnr-label { font-size: .72rem; color: #92400e; margin-bottom: 2px; }
    .pnr-box .pnr-value { font-family: monospace; font-size: 1.2rem; font-weight: 700; color: #78350f; letter-spacing: 2px; }

    /* Print receipt: visible only when printing */
    .print-receipt { display: none; }
  </style>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar" id="adminSidebar"></aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h1><span data-ic="bookings" data-ic-size="22"></span> الحجوزات</h1>
      <div class="topbar-actions">
        <span id="totalCount" style="font-size:.85rem;color:var(--adm-muted)"></span>
        <button class="adm-btn ghost sm" onclick="exportCSV()"><span data-ic="download" data-ic-size="15"></span> تصدير CSV</button>
      </div>
    </div>

    <div class="admin-content">
      <!-- Filters -->
      <div class="adm-toolbar">
        <div class="adm-search">
          <span data-ic="search"></span>
          <input type="search" id="searchInput" placeholder="البحث بالاسم أو رقم الحجز..." oninput="debouncedSearch()">
        </div>
        <select class="adm-select" id="typeFilter" onchange="loadBookings()" style="max-width:150px">
          <option value="">كل الأنواع</option>
          <option value="flight">رحلات جوية</option>
          <option value="hotel">فنادق</option>
        </select>
        <select class="adm-select" id="statusFilter" onchange="loadBookings()" style="max-width:150px">
          <option value="">كل الحالات</option>
          <option value="pending">معلق</option>
          <option value="confirmed">مؤكد</option>
          <option value="completed">مكتمل</option>
          <option value="cancelled">ملغي</option>
          <option value="refunded">مسترد</option>
        </select>
        <input type="date" class="adm-select" id="fromDate" onchange="loadBookings()" style="max-width:160px" title="من تاريخ">
        <input type="date" class="adm-select" id="toDate" onchange="loadBookings()" style="max-width:160px" title="إلى تاريخ">
        <button class="adm-btn ghost sm" onclick="clearFilters()">مسح الفلاتر</button>
      </div>

      <div class="table-card">
        <div id="tableLoading" class="loading-state" style="padding:48px">
          <div class="spinner"></div><p>جاري تحميل الحجوزات...</p>
        </div>

        <div id="tableWrapper" style="display:none;overflow-x:auto">
          <table>
            <thead>
              <tr>
                <th>رقم الحجز</th>
                <th>المسافر</th>
                <th>النوع</th>
                <th>التفاصيل</th>
                <th>تاريخ الحجز</th>
                <th>المبلغ</th>
                <th>الحالة</th>
                <th>الإجراءات</th>
              </tr>
            </thead>
            <tbody id="bookingsTable"></tbody>
          </table>
        </div>

        <div id="emptyState" class="adm-empty" style="display:none">
          <span data-ic="bookings" data-ic-size="40"></span>
          <h4>لا توجد حجوزات</h4>
          <p>لم يتم العثور على نتائج</p>
        </div>

        <div id="revenueSummary" style="display:none;padding:12px 20px;background:var(--adm-soft);border-top:1px solid var(--adm-line);font-weight:600;color:var(--adm-1);font-size:.9rem;text-align:left"></div>
        <div id="paginationContainer" style="padding:12px 18px"></div>
      </div>
    </div>
  </main>
</div>

<!-- ===== Booking Details Modal ===== -->
<div class="adm-modal" id="bookingModal">
  <div class="adm-modal-card lg" style="max-width:720px">
    <div class="adm-modal-head">
      <h3><span data-ic="bookings" data-ic-size="20"></span> تفاصيل الحجز</h3>
      <button class="adm-modal-x" onclick="closeBookingModal()"><span data-ic="close" data-ic-size="16"></span></button>
    </div>
    <!-- Screen content -->
    <div class="booking-modal-body" id="bookingModalContent"></div>
    <!-- Print-only receipt area -->
    <div class="print-receipt" id="printReceiptArea"></div>
    <!-- Action footer (hidden until loaded) -->
    <div class="adm-modal-foot print-actions" id="bookingModalFooter" style="display:none">
      <button class="adm-btn sm" onclick="printTicket()"><span data-ic="ticket" data-ic-size="15"></span> طباعة التذكرة</button>
      <button class="adm-btn neutral sm" onclick="printInvoice()"><span data-ic="download" data-ic-size="15"></span> طباعة الفاتورة</button>
      <button class="adm-btn ghost sm" onclick="printFromHere()"><span data-ic="download" data-ic-size="15"></span> طباعة من هنا</button>
      <button class="adm-btn ghost sm" onclick="openStatusFromDetails()"><span data-ic="edit" data-ic-size="15"></span> تغيير الحالة</button>
      <button class="adm-btn ghost sm" onclick="closeBookingModal()"><span data-ic="close" data-ic-size="15"></span> إغلاق</button>
    </div>
  </div>
</div>

<!-- ===== Update Status Modal ===== -->
<div class="adm-modal" id="statusModal">
  <div class="adm-modal-card" style="max-width:420px">
    <div class="adm-modal-head">
      <h3><span data-ic="edit" data-ic-size="20"></span> تحديث حالة الحجز</h3>
      <button class="adm-modal-x" onclick="closeStatusModal()"><span data-ic="close" data-ic-size="16"></span></button>
    </div>
    <div class="adm-modal-body">
      <input type="hidden" id="updateBookingId">
      <input type="hidden" id="updateBookingType">
      <div class="adm-field">
        <label>رقم الحجز</label>
        <div id="statusModalRef" style="font-family:monospace;font-weight:700;color:var(--adm-1);font-size:1rem;min-height:1.2em"></div>
      </div>
      <div class="adm-field">
        <label>الحالة الجديدة</label>
        <select class="adm-select" id="newStatus" onchange="onStatusChange()">
          <option value="pending">معلق</option>
          <option value="confirmed">مؤكد</option>
          <option value="completed">مكتمل</option>
          <option value="cancelled">ملغي</option>
          <option value="refunded">مسترد</option>
        </select>
      </div>
      <div class="adm-field">
        <label>سبب التغيير</label>
        <input class="adm-input" id="statusReason" placeholder="اختياري — يُسجّل مع التغيير">
      </div>
      <div class="adm-field" id="refundFieldWrap" style="display:none">
        <div style="display:flex;align-items:center;gap:11px">
          <label class="adm-switch"><input type="checkbox" id="statusRefund"><span></span></label>
          <span style="font-size:.9rem;font-weight:600;color:var(--adm-ink)">إرجاع المبلغ عبر Stripe</span>
        </div>
        <div class="adm-hint" id="refundHint">عند التفعيل، سيُسترد المبلغ المدفوع تلقائياً عبر Stripe.</div>
      </div>
      <div id="statusMsg" class="adm-msg"></div>
    </div>
    <div class="adm-modal-foot">
      <button class="adm-btn ghost" onclick="closeStatusModal()">إلغاء</button>
      <button class="adm-btn" onclick="confirmStatusUpdate()"><span data-ic="check" data-ic-size="15"></span> حفظ</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="../js/auth.js"></script>
<script src="../js/api.js"></script>
<script src="../js/admin.js?v=2026070301"></script>
<script src="../js/admin-icons.js?v=2026070301"></script>
<script src="../js/admin-sidebar.js?v=2026070301"></script>
<script>
  let currentPage = 1, searchTimer;
  let _currentBooking = null;
  let _lastBookingsList = [];

  function debouncedSearch() { clearTimeout(searchTimer); searchTimer = setTimeout(() => { currentPage=1; loadBookings(); }, 400); }

  function clearFilters() {
    ['searchInput','typeFilter','statusFilter','fromDate','toDate'].forEach(id => document.getElementById(id).value = '');
    loadBookings();
  }

  async function loadBookings() {
    document.getElementById('tableLoading').style.display = 'block';
    document.getElementById('tableWrapper').style.display = 'none';
    document.getElementById('emptyState').style.display = 'none';
    const params = new URLSearchParams({
      page: currentPage, per_page: 20,
      search: document.getElementById('searchInput').value,
      type: document.getElementById('typeFilter').value,
      status: document.getElementById('statusFilter').value,
      from_date: document.getElementById('fromDate').value,
      to_date: document.getElementById('toDate').value,
    });
    try {
      const res = await Api.get(`/api/admin/bookings?${params}`, true);
      const list = res.data || res.bookings || (Array.isArray(res) ? res : []);
      const total = (res.meta && res.meta.total) || res.total || list.length;
      document.getElementById('totalCount').textContent = `${total} حجز`;
      if (!list.length) {
        const emptyEl = document.getElementById('emptyState');
        emptyEl.style.display = 'block';
        Admin.hydrateIcons(emptyEl);
        return;
      }
      document.getElementById('tableWrapper').style.display = 'block';
      _lastBookingsList = list;
      const totalRev = list.reduce((s,b) => s + (parseFloat(b.total_price)||parseFloat(b.total_amount)||0), 0);
      const revEl = document.getElementById('revenueSummary');
      if (revEl) { revEl.style.display = 'block'; revEl.textContent = 'إجمالي الإيرادات المعروضة: ' + totalRev.toLocaleString('ar') + ' £'; }
      document.getElementById('bookingsTable').innerHTML = list.map(b => {
        const bType = b.type || b.booking_type;
        const bRef = b.booking_reference || b.booking_ref || ('#' + (b.id || '—'));
        const typeBadge = bType === 'flight'
          ? `<span class="badge badge-info">${Admin.icon('flight',13)} رحلة</span>`
          : `<span class="badge badge-neutral">${Admin.icon('hotel',13)} فندق</span>`;
        return `
        <tr>
          <td><span style="font-family:monospace;font-size:.82rem;color:var(--adm-1)">${bRef}</span></td>
          <td>
            <div style="font-weight:600;font-size:.88rem">${b.user_name || b.first_name || '—'} ${b.last_name || ''}</div>
            <div style="color:var(--adm-muted);font-size:.78rem">${b.email || b.user_email || ''}</div>
          </td>
          <td>${typeBadge}</td>
          <td style="font-size:.85rem;color:var(--adm-muted)">
            ${b.from || b.origin_airport || b.city || ''}
            ${(b.to || b.destination_airport) ? '→ ' + (b.to || b.destination_airport) : ''}
          </td>
          <td style="font-size:.82rem;color:var(--adm-muted)">${b.created_at ? new Date(b.created_at).toLocaleDateString('ar-SA') : '—'}</td>
          <td style="font-weight:700;color:var(--adm-1)">${(b.total_price || b.total_amount) ? Number(b.total_price || b.total_amount).toLocaleString('ar') + ' £' : '—'}</td>
          <td>${Admin.renderStatusBadge(b.status)}</td>
          <td>
            <div class="table-actions" style="gap:5px;flex-wrap:wrap">
              <button class="adm-act" title="عرض التفاصيل الكاملة" onclick="viewBooking('${bType}','${b.id}')">${Admin.icon('eye',15)} تفاصيل</button>
              <button class="adm-act" title="تغيير حالة الحجز" onclick="openStatusModal('${bType}','${b.id}','${b.status}','${bRef}')">${Admin.icon('edit',15)} الحالة</button>
              <button class="adm-act" title="طباعة التذكرة / الفاتورة" onclick="quickPrint('${b.id}','${bRef}','${bType}')">${Admin.icon('ticket',15)} تذكرة</button>
            </div>
          </td>
        </tr>`;
      }).join('');
      // Pagination
      const pages = Math.ceil(total / 20);
      const pc = document.getElementById('paginationContainer');
      if (pages > 1) {
        let html = '<div class="pagination">';
        if (currentPage > 1) html += `<button class="adm-btn ghost sm" onclick="goPage(${currentPage-1})">السابق</button>`;
        for (let i = Math.max(1,currentPage-2); i <= Math.min(pages,currentPage+2); i++)
          html += `<button class="adm-btn sm ${i===currentPage?'':'ghost'}" onclick="goPage(${i})">${i}</button>`;
        if (currentPage < pages) html += `<button class="adm-btn ghost sm" onclick="goPage(${currentPage+1})">التالي</button>`;
        html += '</div>';
        pc.innerHTML = html;
      } else pc.innerHTML = '';
    } catch (err) {
      showToast(err.message || 'تعذر تحميل الحجوزات', 'error');
      const emptyEl = document.getElementById('emptyState');
      emptyEl.style.display = 'block';
      Admin.hydrateIcons(emptyEl);
    } finally {
      document.getElementById('tableLoading').style.display = 'none';
    }
  }

  function goPage(p) { currentPage = p; loadBookings(); }

  function closeBookingModal() {
    document.getElementById('bookingModal').classList.remove('open');
    _currentBooking = null;
  }

  // Quick print from table row (opens confirmation page)
  function quickPrint(id, bRef, bType) {
    const isHotel = bType === 'hotel';
    const url = isHotel
      ? `../hotel-confirmation.html?ref=${bRef}`
      : `../confirmation.html?ref=${bRef}&bid=${id}`;
    window.open(url, '_blank');
  }

  // ===== Full Booking Details Modal =====
  async function viewBooking(type, id) {
    _currentBooking = null;
    const el = document.getElementById('bookingModalContent');
    const footer = document.getElementById('bookingModalFooter');
    footer.style.display = 'none';
    el.innerHTML = '<div class="loading-state" style="padding:40px"><div class="spinner"></div><p>جاري تحميل التفاصيل...</p></div>';
    document.getElementById('bookingModal').classList.add('open');
    try {
      // TYPE-AWARE endpoint avoids flight/hotel numeric-ID collision
      const res = await Api.get(`/api/admin/bookings/${type}/${id}`, true);
      const b = res.booking || res.data || res;
      _currentBooking = b;
      const isHotel = (b.booking_type || b.type || type) === 'hotel';
      const bRef = b.booking_reference || b.booking_ref || ('#' + b.id);

      let html = '';

      // Header
      html += `<div style="display:flex;align-items:center;gap:14px;margin-bottom:16px;flex-wrap:wrap">
        <div class="booking-ref-badge">${bRef}</div>
        <div>${Admin.renderStatusBadge(b.status)}</div>
        <div>${isHotel ? `<span class="badge badge-neutral">${Admin.icon('hotel',13)} فندق</span>` : `<span class="badge badge-info">${Admin.icon('flight',13)} رحلة</span>`}</div>
      </div>`;

      // PNR box
      if (!isHotel && b.duffel_booking_reference) {
        const _bref = typeof b.booking_references === 'string' ? JSON.parse(b.booking_references || '[]') : (b.booking_references || []);
        const extraRefs = _bref.filter(r => r.value && r.value !== b.duffel_booking_reference);
        html += `<div class="pnr-box">
          <div class="pnr-label">رقم حجز الناقل (PNR)</div>
          <div class="pnr-value">${b.duffel_booking_reference}</div>
          ${extraRefs.map(r => `<div style="font-size:.78rem;color:#92400e;margin-top:4px">${r.airline_iata_code || ''} • ${r.value}</div>`).join('')}
        </div>`;
      }

      // Electronic tickets
      const eDocs = (b.documents || []).filter(d => d.document_type === 'electronic_ticket');
      if (eDocs.length) {
        html += `<div class="detail-section"><div class="detail-section-title">${Admin.icon('ticket',15)} التذاكر الإلكترونية</div><div class="detail-section-body">
          ${eDocs.map(d => `<div style="font-family:monospace;font-size:.9rem;background:#f0f5fb;border-radius:6px;padding:7px 12px;margin-bottom:4px">${d.unique_identifier || d.passenger_name || '—'}</div>`).join('')}
        </div></div>`;
      }

      // Passenger ticket numbers
      const pasWithTickets = (b.passengers || []).filter(p => p.ticket_number);
      if (pasWithTickets.length && !eDocs.length) {
        html += `<div class="detail-section"><div class="detail-section-title">${Admin.icon('ticket',15)} أرقام التذاكر</div><div class="detail-section-body">
          ${pasWithTickets.map(p => `<div style="margin-bottom:4px;font-size:.85rem"><span style="color:var(--adm-muted)">${p.first_name} ${p.last_name}:</span> <span style="font-family:monospace;font-weight:700">${p.ticket_number}</span></div>`).join('')}
        </div></div>`;
      }

      // Flight segments or Hotel info
      if (!isHotel) {
        const segments = b.segments || (b.slices || []).flatMap(s => s.segments || []);
        if (segments.length) {
          html += `<div class="detail-section"><div class="detail-section-title">${Admin.icon('flight',15)} معلومات الرحلة</div><div class="detail-section-body">`;
          segments.forEach(seg => {
            const dep = seg.departure_at || seg.departing_at;
            const arr = seg.arrival_at || seg.arriving_at;
            const dur = seg.duration ? _formatDuration(seg.duration) : '';
            const originIata = seg.origin_airport || seg.origin_iata || (seg.origin && seg.origin.iata_code) || '';
            const destIata = seg.destination_airport || seg.destination_iata || (seg.destination && seg.destination.iata_code) || '';
            const airlineCode = seg.airline_code || seg.airline_iata || (seg.marketing_carrier && seg.marketing_carrier.iata_code) || '';
            const flightNum = seg.flight_number || seg.marketing_carrier_flight_number || '';
            html += `<div class="segment-card">
              <div class="segment-route">
                <span class="iata">${originIata}</span>
                <span class="arrow">←</span>
                <span class="iata">${destIata}</span>
              </div>
              <div class="segment-meta">
                ${dep ? `<span>${Admin.icon('flight',13)} ${new Date(dep).toLocaleString('ar-SA')}</span>` : ''}
                ${arr ? `<span>${Admin.icon('check',13)} ${new Date(arr).toLocaleString('ar-SA')}</span>` : ''}
                ${airlineCode ? `<span>${Admin.icon('ticket',13)} ${airlineCode} ${flightNum}</span>` : ''}
                ${dur ? `<span>${Admin.icon('clock',13)} ${dur}</span>` : ''}
                ${seg.aircraft_type ? `<span>${Admin.icon('flight',13)} ${seg.aircraft_type}</span>` : ''}
              </div>
            </div>`;
          });
          html += `</div></div>`;
        } else if (b.origin_airport || b.destination_airport) {
          html += `<div class="detail-section"><div class="detail-section-title">${Admin.icon('flight',15)} معلومات الرحلة</div><div class="detail-section-body">
            <div class="detail-grid">
              ${b.origin_airport ? `<div class="detail-item"><label>المطار الأصل</label><span>${b.origin_airport}</span></div>` : ''}
              ${b.destination_airport ? `<div class="detail-item"><label>المطار الوجهة</label><span>${b.destination_airport}</span></div>` : ''}
              ${b.departure_at ? `<div class="detail-item"><label>تاريخ المغادرة</label><span>${new Date(b.departure_at).toLocaleString('ar-SA')}</span></div>` : ''}
            </div>
          </div></div>`;
        }
      } else {
        // Hotel
        const nights = (b.check_in_date && b.check_out_date)
          ? Math.round((new Date(b.check_out_date) - new Date(b.check_in_date)) / 86400000) : null;
        html += `<div class="detail-section"><div class="detail-section-title">${Admin.icon('hotel',15)} معلومات الفندق</div><div class="detail-section-body">
          <div class="detail-grid">
            ${b.hotel_name ? `<div class="detail-item" style="grid-column:1/-1"><label>اسم الفندق</label><span style="font-size:1rem">${b.hotel_name}</span></div>` : ''}
            ${b.check_in_date ? `<div class="detail-item"><label>تاريخ الوصول</label><span>${new Date(b.check_in_date).toLocaleDateString('ar-SA')}</span></div>` : ''}
            ${b.check_out_date ? `<div class="detail-item"><label>تاريخ المغادرة</label><span>${new Date(b.check_out_date).toLocaleDateString('ar-SA')}</span></div>` : ''}
            ${nights !== null ? `<div class="detail-item"><label>عدد الليالي</label><span>${nights} ليلة</span></div>` : ''}
            ${b.hotel_city ? `<div class="detail-item"><label>المدينة</label><span>${b.hotel_city}</span></div>` : ''}
            ${b.hotel_country ? `<div class="detail-item"><label>الدولة</label><span>${b.hotel_country}</span></div>` : ''}
          </div>
        </div></div>`;
        // Rooms
        const rooms = b.rooms || [];
        if (rooms.length) {
          html += `<div class="detail-section"><div class="detail-section-title">${Admin.icon('hotel',15)} الغرف</div><div class="detail-section-body">
            <table class="passenger-table">
              <thead><tr><th>نوع الغرفة</th><th>السعر</th><th>الضيوف</th></tr></thead>
              <tbody>
                ${rooms.map(r => `<tr>
                  <td>${r.room_type || r.name || '—'}</td>
                  <td>${r.price ? Number(r.price).toLocaleString('ar') + ' ' + (b.currency || '') : '—'}</td>
                  <td>${(r.guests || []).map(g => `${g.first_name || ''} ${g.last_name || ''}`).join(', ') || '—'}</td>
                </tr>`).join('')}
              </tbody>
            </table>
          </div></div>`;
        }
      }

      // Passengers
      const passengers = b.passengers || [];
      if (passengers.length) {
        const hasGender = passengers[0].gender !== undefined;
        html += `<div class="detail-section"><div class="detail-section-title">${Admin.icon('users',15)} المسافرون</div><div class="detail-section-body">
          <table class="passenger-table">
            <thead><tr><th>الاسم</th><th>النوع</th><th>رقم الجواز</th><th>الجنسية</th>${hasGender ? '<th>الجنس</th>' : ''}</tr></thead>
            <tbody>
              ${passengers.map(p => {
                const idDoc = p.identity_document || {};
                return `<tr>
                  <td style="font-weight:600">${p.first_name || ''} ${p.last_name || ''}</td>
                  <td>${_passengerTypeLabel(p.type || p.passenger_type)}</td>
                  <td style="font-family:monospace">${p.passport_number || idDoc.number || '—'}</td>
                  <td>${p.nationality || idDoc.issuing_country_code || '—'}</td>
                  ${hasGender ? `<td>${(p.gender === 'm' || p.gender === 'male') ? 'ذكر' : 'أنثى'}</td>` : ''}
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div></div>`;
      }

      // Hotel guests (if no passengers)
      const hotelGuests = isHotel ? (b.guests || []) : [];
      if (hotelGuests.length && !passengers.length) {
        html += `<div class="detail-section"><div class="detail-section-title">${Admin.icon('users',15)} الضيوف</div><div class="detail-section-body">
          <table class="passenger-table">
            <thead><tr><th>الاسم</th><th>النوع</th></tr></thead>
            <tbody>
              ${hotelGuests.map(g => `<tr>
                <td style="font-weight:600">${g.first_name || ''} ${g.last_name || ''}</td>
                <td>${_passengerTypeLabel(g.type)}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div></div>`;
      }

      // Booking & user info
      html += `<div class="detail-section"><div class="detail-section-title">${Admin.icon('traveler',15)} بيانات المسافر (الحجز)</div><div class="detail-section-body">
        <div class="detail-grid">
          <div class="detail-item"><label>البريد الإلكتروني</label><span style="font-size:.85rem">${b.user_email || b.email || '—'}</span></div>
          ${(b.phone || b.user_phone) ? `<div class="detail-item"><label>الهاتف</label><span>${b.phone || b.user_phone}</span></div>` : ''}
          <div class="detail-item"><label>الاسم</label><span>${b.first_name || ''} ${b.last_name || ''}</span></div>
          <div class="detail-item"><label>تاريخ الحجز</label><span>${b.created_at ? new Date(b.created_at).toLocaleDateString('ar-SA') : '—'}</span></div>
          ${b.coupon_code ? `<div class="detail-item"><label>كود الخصم</label><span style="color:var(--success)">${b.coupon_code}</span></div>` : ''}
          ${b.provider_order_id ? `<div class="detail-item" style="grid-column:1/-1"><label>Duffel Order ID</label><span style="font-family:monospace;font-size:.78rem">${b.provider_order_id}</span></div>` : ''}
        </div>
      </div></div>`;

      // Payment details
      const pay = b.payment || {};
      const payAmount = pay.amount || b.total_amount;
      const payCurrency = pay.currency || b.currency;
      const payStatus = pay.status || b.payment_status;
      html += `<div class="detail-section"><div class="detail-section-title">${Admin.icon('payments',15)} تفاصيل الدفع</div><div class="detail-section-body">
        <div class="detail-grid">
          <div class="detail-item"><label>المبلغ المدفوع</label><span style="font-size:1.1rem;color:var(--adm-1)">${payAmount ? Number(payAmount).toLocaleString('ar') + ' ' + (payCurrency || '') : '—'}</span></div>
          ${payStatus ? `<div class="detail-item"><label>حالة الدفع</label><span class="badge ${payStatus === 'succeeded' ? 'badge-success' : payStatus === 'pending' ? 'badge-warning' : 'badge-danger'}">${payStatus}</span></div>` : ''}
          ${(pay.stripe_payment_intent_id || b.stripe_payment_intent_id) ? `<div class="detail-item" style="grid-column:1/-1"><label>Stripe Payment Intent</label><span style="font-family:monospace;font-size:.78rem">${pay.stripe_payment_intent_id || b.stripe_payment_intent_id}</span></div>` : ''}
        </div>
      </div></div>`;

      // Cancellation info
      if (b.pending_cancellation_id || b.cancelled_at || b.cancellation_confirmed_at) {
        html += `<div class="detail-section" style="border-color:#fca5a5">
          <div class="detail-section-title" style="color:#dc2626;background:#fef2f2;border-color:#fca5a5">${Admin.icon('cancel',15)} تفاصيل الإلغاء</div>
          <div class="detail-section-body"><div class="detail-grid">
            ${b.pending_cancellation_id ? `<div class="detail-item" style="grid-column:1/-1"><label>Duffel Cancellation ID</label><span style="font-family:monospace;font-size:.82rem">${b.pending_cancellation_id}</span></div>` : ''}
            ${b.cancellation_refund_amount ? `<div class="detail-item"><label>مبلغ الاسترداد</label><span style="color:var(--success)">${Number(b.cancellation_refund_amount).toLocaleString('ar')} ${b.cancellation_refund_currency || ''}</span></div>` : ''}
            ${b.cancellation_refund_to ? `<div class="detail-item"><label>طريقة الاسترداد</label><span>${b.cancellation_refund_to}</span></div>` : ''}
            ${b.cancellation_expires_at ? `<div class="detail-item"><label>انتهاء صلاحية العرض</label><span>${new Date(b.cancellation_expires_at).toLocaleString('ar-SA')}</span></div>` : ''}
            ${b.cancelled_at ? `<div class="detail-item"><label>تاريخ الإلغاء</label><span>${new Date(b.cancelled_at).toLocaleString('ar-SA')}</span></div>` : ''}
            ${b.cancellation_confirmed_at ? `<div class="detail-item"><label>تأكيد الإلغاء (Duffel)</label><span>${new Date(b.cancellation_confirmed_at).toLocaleString('ar-SA')}</span></div>` : ''}
          </div></div>
        </div>`;
      }

      el.innerHTML = html;
      _buildPrintReceipt(b);
      footer.style.display = 'flex';
    } catch (err) {
      el.innerHTML = `<div class="alert alert-error" style="margin:20px;display:flex;align-items:center;gap:8px">${Admin.icon('cancel',16)} تعذر تحميل تفاصيل الحجز: ${err.message || ''}</div>`;
    }
  }

  function _formatDuration(minutes) {
    if (!minutes) return '';
    return `${Math.floor(minutes / 60)}س ${minutes % 60}د`;
  }

  function _passengerTypeLabel(type) {
    const map = { adult: 'بالغ', child: 'طفل', infant: 'رضيع', infant_without_seat: 'رضيع (بدون مقعد)' };
    return map[type] || type || '—';
  }

  function _statusLabel(status) {
    const map = { pending: 'معلق', confirmed: 'مؤكد', completed: 'مكتمل', cancelled: 'ملغي', refunded: 'مسترد' };
    return map[status] || status || '—';
  }

  // Build the print-only receipt
  function _buildPrintReceipt(b) {
    const bRef = b.booking_reference || b.booking_ref || ('#' + b.id);
    const isHotel = (b.booking_type || b.type) === 'hotel';
    const segments = b.segments || (b.slices || []).flatMap(s => s.segments || []);
    const passengers = b.passengers || b.guests || [];

    let r = `<div style="max-width:700px;margin:0 auto">
      <div style="text-align:center;border-bottom:2px solid #1d4ed8;padding-bottom:16px;margin-bottom:20px">
        <div style="font-size:1.5rem;font-weight:900;color:#1d4ed8">FlyMasar — فلاي مسار</div>
        <div style="font-size:.85rem;color:#6b7280;margin-top:4px">نظام إدارة الحجوزات</div>
      </div>
      <div style="display:flex;gap:20px;flex-wrap:wrap;margin-bottom:20px">
        <div><div style="font-size:.72rem;color:#6b7280">رقم الحجز</div><div style="font-family:monospace;font-size:1.3rem;font-weight:800;color:#1d4ed8">${bRef}</div></div>
        <div><div style="font-size:.72rem;color:#6b7280">الحالة</div><div style="font-weight:700">${_statusLabel(b.status)}</div></div>
        <div><div style="font-size:.72rem;color:#6b7280">النوع</div><div style="font-weight:600">${isHotel ? 'فندق' : 'رحلة'}</div></div>
        <div><div style="font-size:.72rem;color:#6b7280">المبلغ المدفوع</div><div style="font-weight:700;color:#1d4ed8;font-size:1.1rem">${b.total_amount ? Number(b.total_amount).toLocaleString('ar') + ' ' + (b.currency || '') : '—'}</div></div>
        <div><div style="font-size:.72rem;color:#6b7280">الاسم</div><div style="font-weight:600">${b.first_name || ''} ${b.last_name || ''}</div></div>
        <div><div style="font-size:.72rem;color:#6b7280">البريد</div><div style="font-size:.85rem">${b.user_email || b.email || '—'}</div></div>
      </div>`;

    if (!isHotel && segments.length) {
      r += `<div style="margin-bottom:16px"><div style="font-weight:700;border-bottom:1px solid #e5e7eb;padding-bottom:6px;margin-bottom:10px">تفاصيل الرحلة</div>`;
      segments.forEach(seg => {
        const dep = seg.departure_at || seg.departing_at;
        const arr = seg.arrival_at || seg.arriving_at;
        const originIata = seg.origin_airport || seg.origin_iata || (seg.origin && seg.origin.iata_code) || '';
        const destIata = seg.destination_airport || seg.destination_iata || (seg.destination && seg.destination.iata_code) || '';
        const airlineCode = seg.airline_code || seg.airline_iata || (seg.marketing_carrier && seg.marketing_carrier.iata_code) || '';
        const flightNum = seg.flight_number || seg.marketing_carrier_flight_number || '';
        r += `<div style="background:#eff6ff;border-radius:8px;padding:12px;margin-bottom:8px">
          <div style="font-size:1.1rem;font-weight:900">${originIata} ← ${destIata}</div>
          <div style="font-size:.82rem;color:#4b5563;margin-top:4px">
            ${dep ? `المغادرة: ${new Date(dep).toLocaleString('ar-SA')}` : ''}
            ${arr ? ` | الوصول: ${new Date(arr).toLocaleString('ar-SA')}` : ''}
            ${airlineCode ? ` | ${airlineCode} ${flightNum}` : ''}
          </div>
        </div>`;
      });
      r += `</div>`;
    } else if (isHotel) {
      const nights = (b.check_in_date && b.check_out_date)
        ? Math.round((new Date(b.check_out_date) - new Date(b.check_in_date)) / 86400000) : null;
      r += `<div style="margin-bottom:16px"><div style="font-weight:700;border-bottom:1px solid #e5e7eb;padding-bottom:6px;margin-bottom:10px">تفاصيل الفندق</div>
        <div style="background:#f0fdf4;border-radius:8px;padding:12px">
          ${b.hotel_name ? `<div style="font-weight:700;font-size:1rem">${b.hotel_name}</div>` : ''}
          <div style="font-size:.82rem;color:#4b5563;margin-top:4px">
            ${b.check_in_date ? `الوصول: ${new Date(b.check_in_date).toLocaleDateString('ar-SA')}` : ''}
            ${b.check_out_date ? ` | المغادرة: ${new Date(b.check_out_date).toLocaleDateString('ar-SA')}` : ''}
            ${nights !== null ? ` | ${nights} ليلة` : ''}
          </div>
        </div>
      </div>`;
    }

    if (passengers.length) {
      r += `<div style="margin-bottom:16px"><div style="font-weight:700;border-bottom:1px solid #e5e7eb;padding-bottom:6px;margin-bottom:10px">المسافرون / الضيوف</div>
        <table style="width:100%;border-collapse:collapse;font-size:.85rem">
          <thead><tr style="background:#f3f4f6">
            <th style="padding:8px;text-align:right;border-bottom:1px solid #e5e7eb">الاسم</th>
            <th style="padding:8px;text-align:right;border-bottom:1px solid #e5e7eb">النوع</th>
            <th style="padding:8px;text-align:right;border-bottom:1px solid #e5e7eb">رقم الجواز</th>
            <th style="padding:8px;text-align:right;border-bottom:1px solid #e5e7eb">الجنسية</th>
          </tr></thead>
          <tbody>
            ${passengers.map(p => {
              const idDoc = p.identity_document || {};
              return `<tr>
                <td style="padding:8px;font-weight:600;border-bottom:1px solid #f3f4f6">${p.first_name || ''} ${p.last_name || ''}</td>
                <td style="padding:8px;border-bottom:1px solid #f3f4f6">${_passengerTypeLabel(p.type || p.passenger_type)}</td>
                <td style="padding:8px;font-family:monospace;border-bottom:1px solid #f3f4f6">${p.passport_number || idDoc.number || '—'}</td>
                <td style="padding:8px;border-bottom:1px solid #f3f4f6">${p.nationality || idDoc.issuing_country_code || '—'}</td>
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>`;
    }

    r += `<div style="margin-top:24px;border-top:2px solid #e5e7eb;padding-top:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px">
        <div style="font-size:.75rem;color:#9ca3af">طُبع من لوحة الإدارة - FlyMasar | ${new Date().toLocaleString('ar-SA')}</div>
        <div style="font-weight:700;color:#1d4ed8">${b.total_amount ? 'المبلغ: ' + Number(b.total_amount).toLocaleString('ar') + ' ' + (b.currency || '') : ''}</div>
      </div>
    </div>`;

    document.getElementById('printReceiptArea').innerHTML = r;
  }

  // ===== Print Actions =====
  function printTicket() {
    if (!_currentBooking) return;
    const b = _currentBooking;
    const bRef = b.booking_reference || b.booking_ref || b.id;
    const isHotel = (b.booking_type || b.type) === 'hotel';
    window.open(isHotel ? `../hotel-confirmation.html?ref=${bRef}` : `../confirmation.html?ref=${bRef}&bid=${b.id}`, '_blank');
  }

  function printInvoice() {
    if (!_currentBooking) return;
    const b = _currentBooking;
    const bRef = b.booking_reference || b.booking_ref || b.id;
    window.open(`../invoice.html?ref=${bRef}&bid=${b.id}`, '_blank');
  }

  function printFromHere() { window.print(); }

  // ===== Status Modal =====
  function onStatusChange() {
    const status = document.getElementById('newStatus').value;
    const wrap = document.getElementById('refundFieldWrap');
    const cb = document.getElementById('statusRefund');
    const hint = document.getElementById('refundHint');
    if (status === 'refunded') {
      wrap.style.display = 'block';
      cb.checked = true; cb.disabled = true;
      hint.textContent = 'حالة "مسترد" تعني استرداد المبلغ عبر Stripe تلقائياً.';
    } else if (status === 'cancelled') {
      wrap.style.display = 'block';
      cb.disabled = false;
      hint.textContent = 'فعّل الخيار لاسترداد المبلغ المدفوع عبر Stripe عند الإلغاء.';
    } else {
      wrap.style.display = 'none';
      cb.disabled = false; cb.checked = false;
    }
  }

  function closeStatusModal() { document.getElementById('statusModal').classList.remove('open'); }

  function openStatusModal(type, id, currentStatus, bRef) {
    document.getElementById('updateBookingId').value = id;
    document.getElementById('updateBookingType').value = type || 'flight';
    document.getElementById('newStatus').value = currentStatus || 'pending';
    document.getElementById('statusReason').value = '';
    document.getElementById('statusRefund').checked = false;
    document.getElementById('statusModalRef').textContent = bRef || '';
    const msg = document.getElementById('statusMsg'); msg.className = 'adm-msg'; msg.textContent = '';
    onStatusChange();
    document.getElementById('statusModal').classList.add('open');
  }

  function openStatusFromDetails() {
    if (!_currentBooking) return;
    const b = _currentBooking;
    openStatusModal(b.booking_type || b.type, b.id, b.status, b.booking_reference || b.booking_ref || ('#' + b.id));
  }

  async function confirmStatusUpdate() {
    const id = document.getElementById('updateBookingId').value;
    const type = document.getElementById('updateBookingType').value;
    const status = document.getElementById('newStatus').value;
    const reason = document.getElementById('statusReason').value.trim();
    let refund = document.getElementById('statusRefund').checked;
    if (status === 'refunded') refund = true; // refunded implies a refund
    const msg = document.getElementById('statusMsg');
    try {
      // TYPE-AWARE status update (PUT) — prevents flight/hotel ID collision
      const res = await Api.put(`/api/admin/bookings/${type}/${id}/status`, { status, reason, refund }, true);
      showToast(res.message || ('تم تغيير الحالة إلى: ' + _statusLabel(res.status || status)), 'success');
      // Report refund outcome if the API performed one
      const rf = res.refund;
      if (rf && typeof rf === 'object') {
        if (rf.status === 'refunded') showToast('تمت إعادة المبلغ عبر Stripe', 'success');
        else if (rf.status === 'failed') showToast('فشل الاسترداد: ' + (rf.error || rf.message || 'خطأ غير معروف'), 'error');
        else if (rf.status === 'no_payment') showToast('لا توجد دفعة قابلة للاسترداد', 'warning');
      }
      closeStatusModal();
      // Refresh details modal if viewing this booking
      if (_currentBooking && String(_currentBooking.id) === String(id)) {
        viewBooking(type, id);
      }
      loadBookings();
    } catch (err) {
      msg.className = 'adm-msg show err';
      msg.textContent = err.message || 'فشل تحديث الحالة';
      showToast(err.message || 'فشل التحديث', 'error');
    }
  }

  function showToast(msg, type='info') {
    let c = document.getElementById('toastContainer');
    const t = document.createElement('div'); t.className = `toast toast-${type}`;
    t.innerHTML = `<span>${msg}</span>`; c.appendChild(t);
    requestAnimationFrame(() => t.classList.add('show'));
    setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 300); }, 3500);
  }

  function exportCSV() {
    if (!_lastBookingsList.length) { showToast('لا توجد بيانات للتصدير', 'warning'); return; }
    const headers = ['رقم الحجز','المسافر','البريد','النوع','التاريخ','المبلغ','الحالة'];
    const rows = _lastBookingsList.map(b => [
      b.booking_reference || b.booking_ref || ('#' + (b.id||'')),
      (b.user_name || b.first_name || '') + ' ' + (b.last_name || ''),
      b.email || b.user_email || '',
      (b.type || b.booking_type) === 'flight' ? 'رحلة' : 'فندق',
      b.created_at ? new Date(b.created_at).toLocaleDateString('ar-SA') : '',
      b.total_price || b.total_amount || '',
      b.status || '',
    ]);
    const csv = [headers, ...rows].map(r => r.map(v => '"' + String(v).replace(/"/g,'""') + '"').join(',')).join('\n');
    const blob = new Blob(['﻿' + csv], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
    a.download = 'bookings-' + new Date().toISOString().slice(0,10) + '.csv';
    a.click();
  }

  loadBookings();
</script>
</body>
</html>
