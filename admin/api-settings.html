<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إعدادات API — لوحة الإدارة</title>
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/admin.css?v=2026070301">
</head>
<body>
<div class="admin-layout">
    <aside class="sidebar" id="adminSidebar"></aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h1><span data-ic="api" data-ic-size="22"></span> إعدادات API</h1>
    </div>

    <div class="admin-content">

      <div class="adm-note amber">
        <span data-ic="shield"></span>
        <div><strong>تنبيه أمني:</strong> مفاتيح API حساسة جداً. يُفضّل تخزينها في متغيرات البيئة في Hostinger hPanel بدلاً من قاعدة البيانات.</div>
      </div>

      <!-- Duffel -->
      <div class="card" style="margin-bottom:20px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap">
          <h3 style="margin:0;display:flex;align-items:center;gap:9px"><span data-ic="flight" data-ic-size="20" style="color:var(--adm-1)"></span> Duffel API (رحلات جوية)</h3>
          <div style="display:flex;gap:8px;align-items:center">
            <span id="duffelStatus" style="font-size:.8rem"></span>
            <button class="adm-btn ghost sm" onclick="testApi('duffel')"><span data-ic="refresh" data-ic-size="15"></span> اختبار الاتصال</button>
          </div>
        </div>
        <div id="duffelFields">
          <div class="loading-state" style="padding:20px"><div class="spinner"></div></div>
        </div>
      </div>

      <!-- RateHawk -->
      <div class="card" style="margin-bottom:20px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap">
          <h3 style="margin:0;display:flex;align-items:center;gap:9px"><span data-ic="hotel" data-ic-size="20" style="color:var(--adm-1)"></span> RateHawk API (فنادق)</h3>
          <div style="display:flex;gap:8px;align-items:center">
            <span id="ratehawkStatus" style="font-size:.8rem"></span>
            <button class="adm-btn ghost sm" onclick="testApi('ratehawk')"><span data-ic="refresh" data-ic-size="15"></span> اختبار الاتصال</button>
          </div>
        </div>
        <div id="ratehawkFields">
          <div class="loading-state" style="padding:20px"><div class="spinner"></div></div>
        </div>
      </div>

      <!-- Stripe -->
      <div class="card" style="margin-bottom:20px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap">
          <h3 style="margin:0;display:flex;align-items:center;gap:9px"><span data-ic="payments" data-ic-size="20" style="color:var(--adm-1)"></span> Stripe (مدفوعات)</h3>
          <div style="display:flex;gap:8px;align-items:center">
            <span id="stripeStatus" style="font-size:.8rem"></span>
            <button class="adm-btn ghost sm" onclick="testApi('stripe')"><span data-ic="refresh" data-ic-size="15"></span> اختبار الاتصال</button>
          </div>
        </div>
        <div id="stripeFields">
          <div class="loading-state" style="padding:20px"><div class="spinner"></div></div>
        </div>
      </div>

      <!-- WhatsApp -->
      <div class="card" style="margin-bottom:20px">
        <div style="margin-bottom:16px"><h3 style="margin:0;display:flex;align-items:center;gap:9px"><span data-ic="send" data-ic-size="20" style="color:var(--adm-1)"></span> WhatsApp API (إشعارات)</h3></div>
        <div id="whatsappFields">
          <div class="loading-state" style="padding:20px"><div class="spinner"></div></div>
        </div>
      </div>

      <!-- Email (SMTP) -->
      <div class="card">
        <div style="margin-bottom:16px"><h3 style="margin:0;display:flex;align-items:center;gap:9px"><span data-ic="notifications" data-ic-size="20" style="color:var(--adm-1)"></span> البريد الإلكتروني (SMTP)</h3></div>
        <div id="smtpFields">
          <div class="loading-state" style="padding:20px"><div class="spinner"></div></div>
        </div>
      </div>

    </div>
  </main>
</div>

<div class="toast-container" id="toastContainer"></div>
<script src="../js/auth.js"></script>
<script src="../js/api.js"></script>
<script src="../js/admin.js?v=2026070301"></script>
<script src="../js/admin-icons.js?v=2026070301"></script>
<script src="../js/admin-sidebar.js?v=2026070301"></script>
<script>

var allSettings = [];
var editingIds = {};

var providerGroups = {
  duffel:    ['api_key', 'environment'],
  ratehawk:  ['api_key', 'api_secret', 'endpoint'],
  stripe:    ['publishable_key', 'secret_key', 'webhook_secret'],
  whatsapp:  ['api_url', 'token', 'phone_number_id'],
  smtp:      ['host', 'port', 'username', 'password', 'from_email', 'from_name'],
};

var providerLabels = {
  duffel:   { api_key: 'API Key', environment: 'البيئة (sandbox/production)' },
  ratehawk: { api_key: 'API Key', api_secret: 'API Secret', endpoint: 'Endpoint URL' },
  stripe:   { publishable_key: 'Publishable Key', secret_key: 'Secret Key', webhook_secret: 'Webhook Secret' },
  whatsapp: { api_url: 'API URL', token: 'Token', phone_number_id: 'Phone Number ID' },
  smtp:     { host: 'SMTP Host', port: 'Port', username: 'Username', password: 'Password', from_email: 'من البريد', from_name: 'اسم المرسل' },
};

var secretKeys = ['api_key','api_secret','secret_key','webhook_secret','token','password'];

function loadSettings() {
  Api.get('/api/admin/settings', true).then(function(res) {
    allSettings = res.data || [];
    renderProviderFields('duffel',   'duffelFields');
    renderProviderFields('ratehawk', 'ratehawkFields');
    renderProviderFields('stripe',   'stripeFields');
    renderProviderFields('whatsapp', 'whatsappFields');
    renderProviderFields('smtp',     'smtpFields');
  }).catch(function() {
    ['duffelFields','ratehawkFields','stripeFields','whatsappFields','smtpFields'].forEach(function(id) {
      document.getElementById(id).innerHTML = '<p style="color:#dc2626;font-size:.86rem">خطأ في التحميل</p>';
    });
  });
}

function getSettingForProvider(provider, key) {
  return allSettings.find(function(s) { return s.provider === provider && s.setting_key === key; }) || null;
}

function renderProviderFields(provider, containerId) {
  var keys   = providerGroups[provider] || [];
  var labels = providerLabels[provider] || {};
  var html   = '';
  keys.forEach(function(key) {
    var s       = getSettingForProvider(provider, key);
    var isSecret = secretKeys.indexOf(key) !== -1;
    var val     = s ? s.setting_value : '';
    var rowId   = 'row_' + provider + '_' + key;
    html += '<div class="adm-field" style="display:flex;align-items:flex-end;gap:10px;margin-bottom:12px" id="' + rowId + '">' +
      '<div style="flex:1">' +
        '<label style="display:flex;align-items:center;gap:5px">' + (labels[key] || key) + (isSecret ? '<span style="color:var(--adm-faint)">' + Admin.icon('key',13) + '</span>' : '') + '</label>' +
        '<input type="' + (isSecret ? 'password' : 'text') + '" class="adm-input" id="input_' + provider + '_' + key + '" value="' + (val ? val : '') + '" placeholder="' + (val ? '' : 'لم يتم التعيين بعد') + '" style="direction:ltr">' +
      '</div>' +
      '<button class="adm-btn sm" onclick="saveSetting(\'' + provider + '\',\'' + key + '\',' + (s ? s.id : 'null') + ',' + (isSecret ? 'true' : 'false') + ')">' + Admin.icon('check',15) + ' حفظ</button>' +
    '</div>';
  });
  document.getElementById(containerId).innerHTML = html || '<p style="color:var(--adm-muted);font-size:.86rem">لا توجد إعدادات</p>';
}

function saveSetting(provider, key, id, isSecret) {
  var value = document.getElementById('input_' + provider + '_' + key).value;
  var payload = { provider: provider, setting_key: key, setting_value: value, is_secret: isSecret ? 1 : 0 };
  Api.post('/api/admin/settings/upsert', payload, true).then(function() {
    loadSettings();
  });
}

function testApi(provider) {
  var statusEl = document.getElementById(provider + 'Status');
  statusEl.innerHTML = '<span class="badge badge-neutral">جاري الاختبار...</span>';
  Api.post('/api/admin/settings/test/' + provider, {}, true).then(function(res) {
    if (res.success) {
      statusEl.innerHTML = '<span class="badge badge-success">' + Admin.icon('check',13) + ' متصل</span>';
    } else {
      statusEl.innerHTML = '<span class="badge badge-error">' + Admin.icon('close',13) + ' ' + (res.message || 'فشل الاتصال') + '</span>';
    }
  }).catch(function() {
    statusEl.innerHTML = '<span class="badge badge-error">' + Admin.icon('close',13) + ' خطأ في الاتصال</span>';
  });
}

loadSettings();
</script>
</body>
</html>
