<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>التحليلات والتقارير — لوحة الإدارة</title>
  <link rel="stylesheet" href="../css/app.css">
  <link rel="stylesheet" href="../css/admin.css?v=2026070301">
  <style>
    .chart-svg { width: 100%; overflow: visible; }
    .chart-body { padding: 6px 18px 18px; }
  </style>
</head>
<body>
<div class="admin-layout">
  <aside class="sidebar" id="adminSidebar"></aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h1><span data-ic="analytics" data-ic-size="22"></span> التحليلات والتقارير</h1>
      <div class="topbar-actions">
        <span style="font-size:.85rem;color:var(--adm-muted)">الفترة:</span>
        <select class="adm-select" style="max-width:160px" id="periodSelect" onchange="setPeriod(this.value)">
          <option value="7d">آخر 7 أيام</option>
          <option value="30d" selected>آخر 30 يوم</option>
          <option value="90d">آخر 90 يوم</option>
          <option value="1y">آخر سنة</option>
        </select>
      </div>
    </div>

    <div class="admin-content">
      <!-- KPI Cards -->
      <div class="stats-grid">
        <div class="stat-card"><div class="stat-icon violet"><span data-ic="search" data-ic-size="24"></span></div><div><div class="stat-value" id="kpiSearches">—</div><div class="stat-label">إجمالي البحث</div></div></div>
        <div class="stat-card"><div class="stat-icon gold"><span data-ic="bookings" data-ic-size="24"></span></div><div><div class="stat-value" id="kpiBookings">—</div><div class="stat-label">إجمالي الحجوزات</div></div></div>
        <div class="stat-card"><div class="stat-icon green"><span data-ic="analytics" data-ic-size="24"></span></div><div><div class="stat-value" id="kpiConversion">—</div><div class="stat-label">معدل التحويل</div></div></div>
        <div class="stat-card"><div class="stat-icon cyan"><span data-ic="revenue" data-ic-size="24"></span></div><div><div class="stat-value" id="kpiRevenue">—</div><div class="stat-label">إجمالي الإيرادات</div></div></div>
      </div>

      <div class="stats-grid" style="margin-top:0">
        <div class="stat-card"><div class="stat-icon gold"><span data-ic="wallet" data-ic-size="24"></span></div><div><div class="stat-value" id="kpiAvgValue">—</div><div class="stat-label">متوسط قيمة الحجز</div></div></div>
        <div class="stat-card"><div class="stat-icon violet"><span data-ic="users" data-ic-size="24"></span></div><div><div class="stat-value" id="kpiNewUsers">—</div><div class="stat-label">مستخدمون جدد</div></div></div>
        <div class="stat-card"><div class="stat-icon green"><span data-ic="activity" data-ic-size="24"></span></div><div><div class="stat-value" id="kpiActiveUsers">—</div><div class="stat-label">مستخدمون نشطون</div></div></div>
        <div class="stat-card"><div class="stat-icon red"><span data-ic="site" data-ic-size="24"></span></div><div><div class="stat-value" id="kpiTopDest">—</div><div class="stat-label">الوجهة الأكثر طلباً</div></div></div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px">
        <!-- Revenue Bar Chart -->
        <div class="table-card">
          <div class="card-header"><span style="display:flex;align-items:center;gap:8px"><span data-ic="revenue"></span> الإيرادات اليومية</span></div>
          <div class="chart-body" id="revenueChartWrap">
            <div class="loading-state" style="padding:32px"><div class="spinner"></div></div>
          </div>
        </div>

        <!-- Searches Line Chart -->
        <div class="table-card">
          <div class="card-header"><span style="display:flex;align-items:center;gap:8px"><span data-ic="search"></span> عمليات البحث اليومية</span></div>
          <div class="chart-body" id="searchesChartWrap">
            <div class="loading-state" style="padding:32px"><div class="spinner"></div></div>
          </div>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:20px">
        <!-- Top Destinations Table -->
        <div class="table-card">
          <div class="card-header"><span style="display:flex;align-items:center;gap:8px"><span data-ic="site"></span> أبرز الوجهات</span></div>
          <div id="destinationsTable">
            <div class="loading-state" style="padding:32px"><div class="spinner"></div></div>
          </div>
        </div>

        <!-- Top Routes Table -->
        <div class="table-card">
          <div class="card-header"><span style="display:flex;align-items:center;gap:8px"><span data-ic="flight"></span> أبرز المسارات</span></div>
          <div id="routesTable">
            <div class="loading-state" style="padding:32px"><div class="spinner"></div></div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="toast-container" id="toastContainer"></div>

<script src="../js/auth.js"></script>
<script src="../js/api.js"></script>
<script src="../js/admin.js?v=2026070301"></script>
<script src="../js/admin-icons.js?v=2026070301"></script>
<script src="../js/admin-sidebar.js?v=2026070301"></script>
<script>
  let currentPeriod = '30d';

  function setPeriod(p) {
    currentPeriod = p;
    document.getElementById('periodSelect').value = p;
    loadAnalytics();
  }

  // ── SVG Bar Chart ──────────────────────────────────────────────────────────
  // data: array of objects; labelKey/valueKey pick fields.
  function renderBarChart(container, data, labelKey, valueKey, color) {
    if (!data || !data.length) {
      container.innerHTML = '<p style="text-align:center;color:var(--adm-muted);padding:32px 0">لا توجد بيانات</p>';
      return;
    }
    const W = 400, H = 180, PAD = { top: 10, right: 10, bottom: 40, left: 50 };
    const innerW = W - PAD.left - PAD.right;
    const innerH = H - PAD.top - PAD.bottom;
    const values = data.map(d => Number(d[valueKey]) || 0);
    const maxV = Math.max(...values) || 1;
    const barW = innerW / data.length * 0.7;
    const gap  = innerW / data.length;

    const ticks = 4;
    let yLines = '', yLabels = '';
    for (let i = 0; i <= ticks; i++) {
      const y = PAD.top + innerH - (i / ticks) * innerH;
      const val = Math.round((i / ticks) * maxV);
      yLines += `<line x1="${PAD.left}" y1="${y}" x2="${PAD.left + innerW}" y2="${y}" stroke="#eee" stroke-width="1"/>`;
      yLabels += `<text x="${PAD.left - 6}" y="${y + 4}" text-anchor="end" font-size="9" fill="#999">${val.toLocaleString('ar')}</text>`;
    }

    let bars = '', xLabels = '';
    data.forEach((d, i) => {
      const x = PAD.left + i * gap + (gap - barW) / 2;
      const barH = (values[i] / maxV) * innerH;
      const y = PAD.top + innerH - barH;
      bars += `<rect x="${x}" y="${y}" width="${barW}" height="${barH}" fill="${color}" rx="3" opacity=".85">
        <title>${d[labelKey]}: ${values[i].toLocaleString('ar')}</title>
      </rect>`;
      const step = Math.ceil(data.length / 8);
      if (i % step === 0) {
        const label = String(d[labelKey] || '').slice(5);
        xLabels += `<text x="${x + barW/2}" y="${PAD.top + innerH + 16}" text-anchor="middle" font-size="8" fill="#999">${label}</text>`;
      }
    });

    container.innerHTML = `
      <svg viewBox="0 0 ${W} ${H}" class="chart-svg">
        ${yLines}${yLabels}${bars}${xLabels}
      </svg>`;
  }

  // ── SVG Multi-series Line Chart ─────────────────────────────────────────────
  // data: array of objects; labelKey picks x label; series: [{key,color,name}]
  function renderLineChart(container, data, labelKey, series) {
    if (!data || !data.length) {
      container.innerHTML = '<p style="text-align:center;color:var(--adm-muted);padding:32px 0">لا توجد بيانات</p>';
      return;
    }
    const W = 400, H = 180, PAD = { top: 10, right: 10, bottom: 40, left: 50 };
    const innerW = W - PAD.left - PAD.right;
    const innerH = H - PAD.top - PAD.bottom;
    let maxV = 1;
    series.forEach(s => data.forEach(d => { maxV = Math.max(maxV, Number(d[s.key]) || 0); }));

    const ticks = 4;
    let yLines = '', yLabels = '';
    for (let i = 0; i <= ticks; i++) {
      const y = PAD.top + innerH - (i / ticks) * innerH;
      const val = Math.round((i / ticks) * maxV);
      yLines += `<line x1="${PAD.left}" y1="${y}" x2="${PAD.left + innerW}" y2="${y}" stroke="#eee" stroke-width="1"/>`;
      yLabels += `<text x="${PAD.left - 6}" y="${y + 4}" text-anchor="end" font-size="9" fill="#999">${val}</text>`;
    }

    let lines = '';
    series.forEach(s => {
      const pts = data.map((d, i) => {
        const x = PAD.left + (i / Math.max(data.length - 1, 1)) * innerW;
        const y = PAD.top + innerH - ((Number(d[s.key]) || 0) / maxV) * innerH;
        return `${x},${y}`;
      }).join(' ');
      lines += `<polyline points="${pts}" fill="none" stroke="${s.color}" stroke-width="2" stroke-linejoin="round"/>`;
    });

    let xLabels = '';
    const step = Math.ceil(data.length / 8);
    data.forEach((d, i) => {
      if (i % step === 0) {
        const x = PAD.left + (i / Math.max(data.length - 1, 1)) * innerW;
        const label = String(d[labelKey] || '').slice(5);
        xLabels += `<text x="${x}" y="${PAD.top + innerH + 16}" text-anchor="middle" font-size="8" fill="#999">${label}</text>`;
      }
    });

    // Legend
    let legend = '';
    series.forEach((s, i) => {
      const lx = PAD.left + i * 90;
      legend += `<rect x="${lx}" y="2" width="10" height="10" rx="2" fill="${s.color}"/><text x="${lx + 14}" y="11" font-size="9" fill="#666">${s.name}</text>`;
    });

    container.innerHTML = `
      <svg viewBox="0 0 ${W} ${H + 6}" class="chart-svg">
        ${legend}
        <g transform="translate(0,6)">${yLines}${yLabels}${lines}${xLabels}</g>
      </svg>`;
  }

  // ── Load Analytics ─────────────────────────────────────────────────────────
  async function loadAnalytics() {
    ['revenueChartWrap','searchesChartWrap','destinationsTable','routesTable'].forEach(id => {
      document.getElementById(id).innerHTML = '<div class="loading-state" style="padding:32px"><div class="spinner"></div></div>';
    });
    ['kpiSearches','kpiBookings','kpiConversion','kpiRevenue','kpiAvgValue','kpiNewUsers','kpiActiveUsers','kpiTopDest'].forEach(id => {
      document.getElementById(id).textContent = '—';
    });

    try {
      const [overviewRes, revenueRes, searchesRes] = await Promise.all([
        Api.get(`/api/admin/analytics/overview?period=${currentPeriod}`, true),
        Api.get(`/api/admin/analytics/revenue?period=${currentPeriod}`, true),
        Api.get(`/api/admin/analytics/searches?period=${currentPeriod}`, true),
      ]);

      const d = overviewRes.data || overviewRes;
      const rev = revenueRes.data || revenueRes;
      const srch = searchesRes.data || searchesRes;

      const searches = d.searches || {};
      const bookings = d.bookings || {};
      const revenue = d.revenue || {};

      // KPI Cards
      document.getElementById('kpiSearches').textContent   = Number(searches.total || 0).toLocaleString('ar');
      document.getElementById('kpiBookings').textContent   = Number(bookings.total || 0).toLocaleString('ar');
      document.getElementById('kpiConversion').textContent = bookings.conversion_rate || '0%';
      document.getElementById('kpiRevenue').textContent    = Number(revenue.total || 0).toLocaleString('ar') + ' ' + (revenue.currency || '');
      document.getElementById('kpiAvgValue').textContent   = Number(revenue.avg_booking_value || 0).toLocaleString('ar') + (revenue.currency ? ' ' + revenue.currency : '');
      document.getElementById('kpiNewUsers').textContent   = Number(d.new_users || 0).toLocaleString('ar');
      document.getElementById('kpiActiveUsers').textContent = Number(d.active_users || 0).toLocaleString('ar');

      const topDestinations = d.top_destinations || [];
      const topDest = topDestinations[0];
      document.getElementById('kpiTopDest').textContent = topDest ? (topDest.destination || '—') : '—';

      // Revenue bar chart
      const revLabels = rev.labels || [];
      const revAmounts = rev.amounts || [];
      const revData = revLabels.map((l, i) => ({ date: l, amount: Number(revAmounts[i]) || 0 }));
      renderBarChart(document.getElementById('revenueChartWrap'), revData, 'date', 'amount', '#7C3AED');

      // Searches line chart (flights + hotels)
      const sLabels = srch.labels || [];
      const sFlights = srch.flights || [];
      const sHotels = srch.hotels || [];
      const searchData = sLabels.map((l, i) => ({ date: l, flights: Number(sFlights[i]) || 0, hotels: Number(sHotels[i]) || 0 }));
      renderLineChart(document.getElementById('searchesChartWrap'), searchData, 'date', [
        { key: 'flights', color: '#7C3AED', name: 'رحلات' },
        { key: 'hotels',  color: '#059669', name: 'فنادق' },
      ]);

      // Top Destinations Table
      renderDestinations(topDestinations);

      // Top Routes Table
      renderRoutes(d.top_routes || []);
    } catch (err) {
      ['revenueChartWrap','searchesChartWrap','destinationsTable','routesTable'].forEach(id => {
        document.getElementById(id).innerHTML = '<div class="alert alert-error" style="margin:16px">تعذر تحميل بيانات التحليلات</div>';
      });
      if (typeof showToast === 'function') showToast('تعذر تحميل بيانات التحليلات', 'error');
    }
  }

  function renderDestinations(dests) {
    const el = document.getElementById('destinationsTable');
    if (!dests.length) {
      el.innerHTML = '<div class="adm-empty"><span data-ic="site" data-ic-size="40"></span><h4>لا توجد بيانات</h4><p>لم تُسجّل أي وجهات بعد</p></div>';
      Admin.hydrateIcons(el);
      return;
    }
    const top = dests[0].count || 1;
    el.innerHTML = `
      <table>
        <thead><tr><th>#</th><th>الوجهة</th><th>عدد الحجوزات</th><th>الحصة</th></tr></thead>
        <tbody>
          ${dests.map((dest, i) => {
            const pct = top > 0 ? Math.round((dest.count / top) * 100) : 0;
            return `<tr>
              <td style="color:var(--adm-muted)">${i + 1}</td>
              <td><strong>${dest.destination || '—'}</strong></td>
              <td>${Number(dest.count || 0).toLocaleString('ar')}</td>
              <td style="min-width:120px">
                <div style="display:flex;align-items:center;gap:8px">
                  <div style="flex:1;background:var(--adm-soft);border-radius:100px;height:6px">
                    <div style="background:var(--adm-1);height:100%;border-radius:100px;width:${pct}%"></div>
                  </div>
                  <span style="font-size:.78rem;color:var(--adm-muted)">${pct}%</span>
                </div>
              </td>
            </tr>`;
          }).join('')}
        </tbody>
      </table>`;
  }

  function renderRoutes(routes) {
    const el = document.getElementById('routesTable');
    if (!routes.length) {
      el.innerHTML = '<div class="adm-empty"><span data-ic="flight" data-ic-size="40"></span><h4>لا توجد بيانات</h4><p>لم تُسجّل أي مسارات بعد</p></div>';
      Admin.hydrateIcons(el);
      return;
    }
    el.innerHTML = `
      <table>
        <thead><tr><th>#</th><th>المسار</th><th>عدد عمليات البحث</th></tr></thead>
        <tbody>
          ${routes.map((r, i) => `<tr>
            <td style="color:var(--adm-muted)">${i + 1}</td>
            <td style="direction:ltr;text-align:right"><strong>${r.origin}→${r.destination}</strong></td>
            <td>${Number(r.count || 0).toLocaleString('ar')}</td>
          </tr>`).join('')}
        </tbody>
      </table>`;
  }

  loadAnalytics();
</script>
</body>
</html>
