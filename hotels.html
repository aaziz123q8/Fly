<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الفنادق — فلاي مسار</title>
  <link rel="stylesheet" href="css/app.css">
  <script src="js/dark-mode.js"></script>
  <style>
    /* ── Violet palette (page-local) ── */
    :root{
      --v1:#7C3AED; --v2:#9333EA; --v3:#4C1D95; --vdeep:#2E1065;
      --vbg:#FAF8FF; --vink:#1B172B; --vmuted:#6B6880; --vline:#ECE8F4;
      --vgrad:linear-gradient(120deg,#7C3AED,#9333EA 55%,#C026D3);
    }
    .hotel-hero { background:linear-gradient(135deg,#3b0f6e,#6d28d9 55%,#7e22ce); padding:60px 0 100px; text-align:center; color:#fff; }
    .hotel-hero h1 { font-size:clamp(1.8rem,4vw,2.8rem); font-weight:800; margin:0 0 12px; }
    .hotel-hero p { color:#e7ddff; }
    .hotel-search-box { background:#fff; border-radius:22px; box-shadow:0 24px 60px -24px rgba(76,29,149,.5); border:1px solid var(--vline); padding:28px; margin-top:-60px; position:relative; z-index:10; }
    .field-group { display:flex; flex-direction:column; gap:6px; }
    .field-group label { font-size:0.8rem; font-weight:600; color:var(--vmuted); }
    .field-input { width:100%; padding:12px 16px; border:1.5px solid var(--vline); border-radius:14px; font-size:0.95rem; background:#faf8ff; cursor:pointer; transition:border-color .2s,box-shadow .2s,background .2s; box-sizing:border-box; text-align:right; font-family:inherit; color:var(--vink); }
    [dir=ltr] .field-input { text-align:left; }
    .field-input:hover { border-color:#c9b6f2; }
    .field-input:focus { outline:none; border-color:var(--v1); background:#fff; box-shadow:0 0 0 3px rgba(124,58,237,.12); }
    .field-input.filled { background:#fff; border-color:#c9b6f2; }
    .hsrow { display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:12px; }
    @media(max-width:768px) { .hsrow { grid-template-columns:1fr; } }
    .hotels-section { padding:40px 0; background:var(--vbg); min-height:50vh; }
    .hotels-section.hidden { display:none; }
    .hotels-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:22px; }
    /* ── Hotel result card (violet identity) ── */
    .hotel-card { background:#fff; border:1px solid var(--vline); border-radius:18px; box-shadow:0 8px 24px -14px rgba(76,29,149,.4); overflow:hidden; transition:transform .25s,box-shadow .25s,border-color .25s; display:flex; flex-direction:column; }
    .hotel-card:hover { transform:translateY(-5px); box-shadow:0 24px 50px -24px rgba(76,29,149,.5); border-color:#d6c6f7; }
    .hotel-img { height:210px; background:linear-gradient(135deg,#a78bfa,#7c3aed 55%,#c026d3); display:flex; align-items:center; justify-content:center; color:rgba(255,255,255,0.6); position:relative; overflow:hidden; }
    .hotel-img img { width:100%; height:100%; object-fit:cover; transition:transform .5s ease; }
    .hotel-card:hover .hotel-img img { transform:scale(1.06); }
    .hotel-img svg { width:46px; height:46px; }
    .hotel-stars-badge { position:absolute; top:12px; right:12px; background:rgba(46,16,101,0.72); color:#FDE68A; padding:4px 11px; border-radius:20px; font-size:0.8rem; letter-spacing:1px; backdrop-filter:blur(3px); }
    .hotel-body { padding:16px 18px; flex:1; }
    .hotel-name { font-size:1.08rem; font-weight:700; margin:0 0 7px; color:var(--vink); line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
    .hotel-city { font-size:0.82rem; color:var(--vmuted); margin-bottom:12px; display:flex; align-items:center; gap:4px; }
    .hotel-city svg { color:var(--v2); flex-shrink:0; width:15px; height:15px; }
    .hotel-rating { display:flex; align-items:center; gap:7px; margin-bottom:4px; }
    .rating-score { background:var(--success,#27AE60); color:#fff; padding:3px 9px; border-radius:7px; font-size:0.82rem; font-weight:700; }
    .hotel-footer { display:flex; align-items:flex-end; justify-content:space-between; padding:14px 18px; border-top:1px solid var(--vline); background:linear-gradient(180deg,#faf8ff,#f4eefe); }
    .hotel-price { font-size:1.35rem; font-weight:800; color:var(--v2); letter-spacing:-.5px; }
    .hotel-price-label { font-size:0.74rem; color:var(--vmuted); }
    .hotel-footer .btn { padding:9px 18px; font-weight:700; border-radius:11px; }
    .hotel-footer .btn-primary { background:var(--vgrad); border:none; color:#fff; box-shadow:0 10px 20px -12px rgba(124,58,237,.8); }
    .hotel-footer .btn-primary:hover { filter:brightness(1.05); transform:translateY(-1px); }
    .pax-popup { display:none; position:absolute; background:#fff; border-radius:16px; box-shadow:0 24px 60px -24px rgba(76,29,149,.5); border:1px solid var(--vline); padding:20px; z-index:500; min-width:260px; top:100%; right:0; margin-top:4px; }
    [dir=ltr] .pax-popup { right:auto; left:0; }
    .pax-popup.open { display:block; }
    .pax-row { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid var(--vline); }
    .pax-row:last-of-type { border-bottom:none; }
    .pax-info strong { display:block; font-size:0.92rem; }
    .pax-counter { display:flex; align-items:center; gap:10px; }
    .pax-btn { width:30px; height:30px; border-radius:50%; border:1.5px solid var(--vline); background:#fff; color:var(--v2); cursor:pointer; font-size:1rem; display:flex; align-items:center; justify-content:center; font-weight:700; font-family:inherit; transition:.2s; }
    .pax-btn:hover { background:var(--vgrad); color:#fff; border-color:transparent; }
    .pax-count { font-weight:700; min-width:20px; text-align:center; }
    .pax-done { width:100%; margin-top:12px; padding:9px; background:var(--vgrad); color:#fff; border:none; border-radius:12px; font-size:0.9rem; font-weight:700; cursor:pointer; font-family:inherit; }
    .dp-popup { display:none; position:fixed; background:#fff; border-radius:18px; box-shadow:0 24px 60px -24px rgba(76,29,149,.5); border:1px solid var(--vline); z-index:2000; padding:16px; user-select:none; }
    .dp-wrap { display:flex; gap:16px; flex-wrap:wrap; }
    .dp-month-block { min-width:260px; }
    .dp-month-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
    .dp-month-title { font-weight:700; font-size:0.95rem; }
    .dp-nav { background:none; border:1px solid var(--vline); border-radius:9px; width:30px; height:30px; cursor:pointer; font-size:1.1rem; display:flex; align-items:center; justify-content:center; font-family:inherit; transition:.2s; }
    .dp-nav:hover { background:var(--vgrad); color:#fff; border-color:transparent; }
    .dp-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
    .dp-day-name { text-align:center; font-size:0.72rem; font-weight:600; color:var(--vmuted); padding:4px 0; }
    .dp-day { text-align:center; padding:8px 4px; border-radius:9px; cursor:pointer; font-size:0.88rem; transition:all .15s; }
    .dp-day:hover:not(.dp-disabled) { background:#F4EEFE; }
    .dp-disabled { color:#d1cbe0; cursor:not-allowed; }
    .dp-today { font-weight:700; color:var(--v2); }
    .dp-selected { background:var(--v1)!important; color:#fff!important; font-weight:700; }
    .dp-in-range { background:#EDE4FC; border-radius:0; }
    .dp-start { border-radius:9px 0 0 9px; }
    .dp-end { border-radius:0 9px 9px 0; }
    .dp-nights { text-align:center; margin-top:10px; font-weight:700; color:var(--v2); }
  </style>
</head>
<body>

<!-- Global header injected by js/site-chrome.js -->

<section class="hotel-hero">
  <div class="container">
    <h1><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex-shrink:0"><path d="M3 21h18M5 21V5a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v16"/><path d="M9 8h.01M15 8h.01M9 12h.01M15 12h.01M10 21v-4h4v4"/></svg> ابحث عن فندقك المثالي</h1>
    <p>أفضل الأسعار في آلاف الفنادق حول العالم</p>
  </div>
</section>

<section style="background:var(--vbg);padding-bottom:0">
  <div class="container">
    <div class="hotel-search-box">
      <div class="hsrow">
        <div class="field-group">
          <label>الوجهة</label>
          <input type="text" class="field-input" id="hDest" placeholder="المدينة أو الفندق">
        </div>
        <div class="field-group">
          <label>تاريخ الوصول</label>
          <input type="text" class="field-input" id="hCheckin" readonly placeholder="اختر التاريخ">
        </div>
        <div class="field-group">
          <label>تاريخ المغادرة</label>
          <input type="text" class="field-input" id="hCheckout" readonly placeholder="اختر التاريخ">
        </div>
        <div class="field-group" style="position:relative">
          <label>الغرف والضيوف</label>
          <input type="text" class="field-input" id="hGuests" readonly value="١ غرفة، ٢ ضيوف" onclick="toggleGuestsPop()">
          <div class="pax-popup" id="guestsPop">
            <div class="pax-row">
              <div class="pax-info"><strong>الغرف</strong></div>
              <div class="pax-counter">
                <button class="pax-btn" onclick="chG('rooms',-1)">−</button>
                <span class="pax-count" id="gRooms">1</span>
                <button class="pax-btn" onclick="chG('rooms',1)">+</button>
              </div>
            </div>
            <div class="pax-row">
              <div class="pax-info"><strong>البالغون</strong></div>
              <div class="pax-counter">
                <button class="pax-btn" onclick="chG('adults',-1)">−</button>
                <span class="pax-count" id="gAdults">2</span>
                <button class="pax-btn" onclick="chG('adults',1)">+</button>
              </div>
            </div>
            <div class="pax-row">
              <div class="pax-info"><strong>الأطفال</strong><small style="color:var(--text-muted);font-size:0.78rem">أقل من ١٢ سنة</small></div>
              <div class="pax-counter">
                <button class="pax-btn" onclick="chG('children',-1)">−</button>
                <span class="pax-count" id="gChildren">0</span>
                <button class="pax-btn" onclick="chG('children',1)">+</button>
              </div>
            </div>
            <button class="pax-done" onclick="closeGuestsPop()">تم</button>
          </div>
        </div>
      </div>
      <div style="display:flex;justify-content:center;margin-top:16px">
        <button class="btn btn-primary btn-lg" onclick="doSearch()" style="min-width:220px;background:var(--vgrad);border:none;box-shadow:0 14px 28px -12px rgba(124,58,237,.85)">
          <span id="searchTxt"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex-shrink:0"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.3-4.3"/></svg> بحث عن فنادق</span>
          <div class="spinner spinner-sm hidden" id="searchSp" style="border-top-color:white"></div>
        </button>
      </div>
    </div>
  </div>
</section>

<section id="hotelsSection" class="hotels-section hidden">
  <div class="container">
    <!-- Sort & Filter Bar -->
    <div style="background:#fff;border-radius:16px;border:1px solid var(--vline);box-shadow:0 8px 24px -16px rgba(76,29,149,.4);padding:16px 20px;margin-bottom:20px;display:flex;flex-wrap:wrap;gap:12px;align-items:center">
      <div style="font-weight:700;font-size:0.95rem;margin-left:auto">
        <span id="hotelsCount" style="color:var(--text-muted);font-weight:400"></span>
      </div>
      <!-- Sort -->
      <div style="display:flex;align-items:center;gap:6px">
        <span style="font-size:0.82rem;color:var(--text-muted)">ترتيب:</span>
        <select id="hotelSort" onchange="applyFilters()" style="padding:6px 10px;border:1.5px solid var(--vline);border-radius:9px;font-size:0.85rem;font-family:inherit;background:#fff;cursor:pointer">
          <option value="price_asc">السعر: الأقل أولاً</option>
          <option value="price_desc">السعر: الأعلى أولاً</option>
          <option value="rating_desc">التقييم: الأعلى أولاً</option>
          <option value="stars_desc">النجوم: الأعلى أولاً</option>
        </select>
      </div>
      <!-- Stars Filter -->
      <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap">
        <span style="font-size:0.82rem;color:var(--text-muted)">النجوم:</span>
        <div id="starsFilter" style="display:flex;gap:4px">
          <button onclick="toggleStar(0)" id="star0" class="star-btn star-active" title="الكل">الكل</button>
          <button onclick="toggleStar(3)" id="star3" class="star-btn">3★</button>
          <button onclick="toggleStar(4)" id="star4" class="star-btn">4★</button>
          <button onclick="toggleStar(5)" id="star5" class="star-btn">5★</button>
        </div>
      </div>
      <!-- Max Price -->
      <div style="display:flex;align-items:center;gap:6px">
        <span style="font-size:0.82rem;color:var(--text-muted)">حتى:</span>
        <select id="priceFilter" onchange="applyFilters()" style="padding:6px 10px;border:1.5px solid var(--vline);border-radius:9px;font-size:0.85rem;font-family:inherit;background:#fff;cursor:pointer">
          <option value="0">أي سعر</option>
          <option value="100">£ 100</option>
          <option value="200">£ 200</option>
          <option value="300">£ 300</option>
          <option value="500">£ 500</option>
        </select>
      </div>
    </div>
    <style>
      .star-btn{padding:5px 10px;border:1.5px solid var(--vline);border-radius:9px;background:#fff;color:var(--vmuted);font-size:0.82rem;cursor:pointer;font-family:inherit;transition:.15s;font-weight:700}
      .star-btn:hover,.star-btn.star-active{background:var(--vgrad);color:#fff;border-color:transparent}
    </style>
    <div class="hotels-grid" id="hotelsGrid"></div>
  </div>
</section>

<section style="padding:60px 0;background:#fff" id="featSection">
  <div class="container">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:24px">
      <div style="text-align:center;padding:24px"><div style="font-size:2.5rem;margin-bottom:12px"><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex-shrink:0"><path d="M12 1v22"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg></div><h3 style="color:var(--primary);margin-bottom:8px">أفضل الأسعار</h3><p style="color:var(--text-muted);font-size:0.9rem">نضمن لك أفضل سعر أو نرد الفرق</p></div>
      <div style="text-align:center;padding:24px"><div style="font-size:2.5rem;margin-bottom:12px"><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex-shrink:0"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></div><h3 style="color:var(--primary);margin-bottom:8px">حجز آمن</h3><p style="color:var(--text-muted);font-size:0.9rem">معاملاتك محمية بتشفير SSL</p></div>
      <div style="text-align:center;padding:24px"><div style="font-size:2.5rem;margin-bottom:12px"><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex-shrink:0"><path d="M12 2l3 7h7l-5.5 4 2 7L12 17l-6.5 3 2-7L2 9h7z"/></svg></div><h3 style="color:var(--primary);margin-bottom:8px">فنادق مختارة</h3><p style="color:var(--text-muted);font-size:0.9rem">آلاف الفنادق المقيّمة من مسافرين حقيقيين</p></div>
    </div>
  </div>
</section>

<!-- Global footer injected by js/site-chrome.js -->


<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/i18n.js"></script>
<script src="js/currency.js"></script>
<script src="js/datepicker.js"></script>
<script>
  const guestState = { rooms:1, adults:2, children:0 };
  let checkinDate = null, checkoutDate = null;

  document.addEventListener('DOMContentLoaded', ()=>{
    initLang();
    initCurrency();

    // Auth nav is handled by the shared site chrome; keep this null-safe.
    const nav = document.getElementById('navAuth');
    if (nav) {
      if (Auth.isLoggedIn()) {
        const u = Auth.getUser();
        nav.innerHTML = `<a href="dashboard.html" class="btn btn-ghost btn-sm">${u?.first_name||'حجوزاتي'}</a><button onclick="Auth.logout()" class="btn btn-outline btn-sm">خروج</button>`;
      } else {
        nav.innerHTML = `<a href="login.html" class="btn btn-ghost btn-sm">دخول</a><a href="register.html" class="btn btn-primary btn-sm">تسجيل</a>`;
      }
    }

    // Date pickers (range)
    const ci = document.getElementById('hCheckin');
    const co = document.getElementById('hCheckout');
    const dp = new DatePicker(ci, {
      mode:'range', minDate:new Date(),
      onSelect:(s,e,inst)=>{
        checkinDate = s;
        ci.value = inst._fmt(s); ci.classList.add('filled');
        if(e){ checkoutDate = e; co.value = inst._fmt(e); co.classList.add('filled'); }
      }
    });
    co.addEventListener('click', ()=>dp.show());

    // Pre-fill from URL params
    const p = new URLSearchParams(window.location.search);
    if(p.get('dest')) document.getElementById('hDest').value = p.get('dest');
    if(p.get('rooms')) { guestState.rooms=parseInt(p.get('rooms')); updateGuestsLabel(); }
    if(p.get('guests')) { guestState.adults=parseInt(p.get('guests')); updateGuestsLabel(); }
    // Pre-fill dates passed from the homepage so the auto-search has valid dates.
    if(p.get('checkin') && p.get('checkout')) {
      checkinDate  = new Date(p.get('checkin')  + 'T00:00:00');
      checkoutDate = new Date(p.get('checkout') + 'T00:00:00');
      ci.value = dp._fmt(checkinDate);  ci.classList.add('filled');
      co.value = dp._fmt(checkoutDate); co.classList.add('filled');
    }
    if(p.get('dest')) doSearch();

    document.addEventListener('click', e=>{
      if(!e.target.closest('#guestsPop')&&!e.target.closest('#hGuests')) closeGuestsPop();
    });
  });

  function toggleGuestsPop() { document.getElementById('guestsPop').classList.toggle('open'); }
  function closeGuestsPop()  { document.getElementById('guestsPop').classList.remove('open'); }

  function chG(type, d) {
    const min = type==='adults'?1:0;
    guestState[type] = Math.max(min, Math.min(guestState[type]+d, type==='rooms'?8:12));
    document.getElementById('gRooms').textContent    = guestState.rooms;
    document.getElementById('gAdults').textContent   = guestState.adults;
    document.getElementById('gChildren').textContent = guestState.children;
    updateGuestsLabel();
  }

  function updateGuestsLabel() {
    let lbl = guestState.rooms + ' غرفة، ' + guestState.adults + ' بالغ';
    if(guestState.children) lbl += '، ' + guestState.children + ' طفل';
    document.getElementById('hGuests').value = lbl;
  }

  let allHotels = [];
  let selectedStars = 0;

  function toggleStar(stars) {
    selectedStars = stars;
    document.querySelectorAll('.star-btn').forEach(b => b.classList.remove('star-active'));
    document.getElementById('star' + stars).classList.add('star-active');
    applyFilters();
  }

  function applyFilters() {
    const sort    = document.getElementById('hotelSort').value;
    const maxPrice = parseFloat(document.getElementById('priceFilter').value) || 0;

    let filtered = allHotels.filter(h => {
      const price = parseFloat(h.min_price||h.price||h.total_amount||0);
      const stars = parseInt(h.stars||0);
      if (selectedStars > 0 && stars !== selectedStars) return false;
      if (maxPrice > 0 && price > maxPrice) return false;
      return true;
    });

    filtered.sort((a, b) => {
      const pa = parseFloat(a.min_price||a.price||a.total_amount||0);
      const pb = parseFloat(b.min_price||b.price||b.total_amount||0);
      const ra = parseFloat(a.rating||a.review_score||0);
      const rb = parseFloat(b.rating||b.review_score||0);
      const sa = parseInt(a.stars||0), sb = parseInt(b.stars||0);
      if (sort==='price_asc')   return pa - pb;
      if (sort==='price_desc')  return pb - pa;
      if (sort==='rating_desc') return rb - ra;
      if (sort==='stars_desc')  return sb - sa;
      return 0;
    });

    document.getElementById('hotelsCount').textContent = filtered.length + ' فندق متاح';
    renderHotels(filtered);
  }

  async function doSearch() {
    const dest = document.getElementById('hDest').value.trim();
    if(!dest) { showToast('يرجى إدخال الوجهة', 'error'); return; }
    const btn = document.querySelector('.hotel-search-box .btn-primary');
    const sp = document.getElementById('searchSp');
    const tx = document.getElementById('searchTxt');
    btn.disabled=true; sp.classList.remove('hidden'); tx.classList.add('hidden');
    document.getElementById('featSection').style.display='none';
    try {
      const params = {
        destination: dest,
        check_in: checkinDate ? checkinDate.toISOString().split('T')[0] : '',
        check_out: checkoutDate ? checkoutDate.toISOString().split('T')[0] : '',
        rooms: guestState.rooms,
        adults: guestState.adults,
        children: guestState.children,
      };
      const res = await Api.post('/api/hotels/search', params);
      allHotels = res.data || res.hotels || (Array.isArray(res)?res:[]);
      document.getElementById('hotelsSection').classList.remove('hidden');
      applyFilters();
    } catch(err) {
      document.getElementById('hotelsSection').classList.remove('hidden');
      document.getElementById('hotelsGrid').innerHTML = `<div class="alert alert-error" style="grid-column:1/-1">${err.message||'حدث خطأ في البحث'}</div>`;
    } finally {
      btn.disabled=false; sp.classList.add('hidden'); tx.classList.remove('hidden');
    }
  }

  function starsHtml(n) {
    const s = Math.min(parseInt(n)||0,5);
    return '★'.repeat(s) + '☆'.repeat(5-s);
  }

  function renderHotels(hotels) {
    const g = document.getElementById('hotelsGrid');
    if(!hotels.length) {
      g.innerHTML = `<div style="grid-column:1/-1;text-align:center;padding:60px 20px">
        <div style="font-size:3rem;margin-bottom:16px"><svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex-shrink:0"><path d="M3 21h18M5 21V5a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v16"/><path d="M9 8h.01M15 8h.01M9 12h.01M15 12h.01M10 21v-4h4v4"/></svg></div>
        <h3 style="color:var(--primary);margin-bottom:8px">لا توجد فنادق متاحة</h3>
        <p style="color:var(--text-muted)">جرب وجهة أخرى أو تواريخ مختلفة</p>
      </div>`;
      return;
    }
    g.innerHTML = hotels.map(h=>{
      const price = parseFloat(h.min_price||h.price||h.total_amount||0);
      const rating = parseFloat(h.rating||h.review_score||0).toFixed(1);
      return `<div class="hotel-card">
  <div class="hotel-img">
    ${h.image_url ? `<img src="${h.image_url}" alt="${h.name||''}" onerror="this.style.display='none'">` : `<svg class="ico" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex-shrink:0"><path d="M3 21h18M5 21V5a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1v16"/><path d="M9 8h.01M15 8h.01M9 12h.01M15 12h.01M10 21v-4h4v4"/></svg>`}
    ${h.stars ? `<div class="hotel-stars-badge">${'★'.repeat(Math.min(parseInt(h.stars)||0,5))}</div>` : ''}
  </div>
  <div class="hotel-body">
    <div class="hotel-name">${h.name||h.hotel_name||'فندق'}</div>
    <div class="hotel-city"><svg class="ico" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-3px;flex-shrink:0"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg> ${h.city||h.address||''}</div>
    ${rating>0 ? `<div class="hotel-rating"><span class="rating-score">${rating}</span><span style="font-size:0.82rem;color:var(--text-muted)">${h.review_count?`(${h.review_count} تقييم)`:''}</span></div>` : ''}
  </div>
  <div class="hotel-footer">
    <div>
      <div class="hotel-price" data-price-gbp="${price}">${price>0?formatPrice(price):'—'}</div>
      <div class="hotel-price-label">/ ليلة للغرفة</div>
    </div>
    <button class="btn btn-primary btn-sm" onclick="bookHotel('${h.id||''}')">احجز</button>
  </div>
</div>`}).join('');
  }

  function bookHotel(id) {
    // No forced login — guests choose to log in or continue without an account
    // on the booking page.
    // Route into the hotel flow (hotel-detail → hotel-booking), carrying the
    // search dates/occupancy so the detail page can prebook the right rate.
    const qs = new URLSearchParams({
      id,
      check_in:  checkinDate  ? checkinDate.toISOString().split('T')[0]  : '',
      check_out: checkoutDate ? checkoutDate.toISOString().split('T')[0] : '',
      adults:   guestState.adults,
      children: guestState.children,
      rooms:    guestState.rooms
    });
    window.location.href = 'hotel-detail.html?' + qs.toString();
  }

  // formatPrice is provided by currency.js (loaded above)
  if (typeof formatPrice === 'undefined') {
    window.formatPrice = function(a) { return '£ ' + parseFloat(a||0).toFixed(0); };
  }

  function showToast(msg,type='info') {
    const t=document.createElement('div'); t.className='toast toast-'+type; t.textContent=msg;
    document.body.appendChild(t); setTimeout(()=>t.remove(),3500);
  }
</script>
<script src="js/site-chrome.js?v=2026070103"></script>
</body>
