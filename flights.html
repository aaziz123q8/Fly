<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نتائج الرحلات — فلاي مسار</title>
  <link rel="stylesheet" href="css/app.css">
  <script src="js/dark-mode.js"></script>
  <style>
    body { background: var(--bg-secondary, #f5f7fa); }
    .page-header { background: linear-gradient(135deg, #1a2e5a 0%, #0056b3 100%); color: #fff; padding: 20px 0 0; }
    .search-bar-compact { background: rgba(255,255,255,.12); border-radius: 12px; padding: 14px 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .search-bar-compact .form-control { background: rgba(255,255,255,.9); color: #1a2e5a; border: none; font-size: .85rem; }
    .search-bar-compact .form-label { color: rgba(255,255,255,.8); font-size: .75rem; margin-bottom: 4px; }
    .results-layout { display: grid; grid-template-columns: 270px 1fr; gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto; }
    @media(max-width:900px) { .results-layout { grid-template-columns: 1fr; } .filters-panel { display: none; } .filters-panel.open { display: block; } }
    .filters-panel .card { padding: 16px; margin-bottom: 16px; }
    .filter-section { margin-bottom: 14px; border-bottom: 1px solid #f0f2f5; padding-bottom: 12px; }
    .filter-section:last-child { border-bottom: none; margin-bottom: 0; }
    .filter-section h4 { font-size: .85rem; font-weight: 700; margin: 0 0 10px; color: #1a2e5a; }
    .filter-checkbox { display: flex; align-items: center; gap: 6px; font-size: .82rem; margin-bottom: 6px; cursor: pointer; }
    .filter-checkbox input { width: 15px; height: 15px; accent-color: var(--primary); }
    .range-input { width: 100%; accent-color: var(--primary); }

    /* ── Flight Card ─────────────────────────────────────────── */
    .flight-card { background: #fff; border-radius: 14px; border: 1px solid #e8ecf0; margin-bottom: 12px; overflow: hidden; transition: box-shadow .2s, border-color .2s; }
    .flight-card:hover { box-shadow: 0 6px 24px rgba(0,0,60,.1); border-color: #c5d5e8; }

    .fc-main { display: grid; grid-template-columns: 160px 1fr auto; gap: 0; align-items: stretch; }
    @media(max-width:640px) { .fc-main { grid-template-columns: 1fr; } }

    /* Airline column */
    .fc-airline { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 18px 14px; border-left: 1px solid #f0f2f5; gap: 6px; }
    .fc-airline img { width: 44px; height: 44px; object-fit: contain; border-radius: 8px; background: #f5f7fa; }
    .fc-airline .al-logo-fallback { width: 44px; height: 44px; border-radius: 8px; background: #e8f0fe; display: flex; align-items: center; justify-content: center; font-size: .75rem; font-weight: 800; color: #1a2e5a; }
    .fc-airline .al-name { font-size: .78rem; font-weight: 600; color: #1a2e5a; text-align: center; line-height: 1.2; }
    .fc-airline .al-code { font-size: .7rem; color: #9ca3af; }

    /* Route section — supports stacked slices for round-trips */
    .fc-routes { flex: 1; display: flex; flex-direction: column; }
    .fc-route { padding: 14px 20px; display: flex; align-items: center; gap: 12px; }
    .fc-route + .fc-route { border-top: 1px dashed #e5e7eb; }
    .fc-point { text-align: center; min-width: 64px; }
    .fc-point .time { font-size: 1.35rem; font-weight: 800; color: #111827; line-height: 1; }
    .fc-point .iata { font-size: .8rem; font-weight: 700; color: var(--primary); margin-top: 2px; }
    .fc-point .apt-name { font-size: .68rem; color: #9ca3af; margin-top: 2px; max-width: 80px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .fc-point .date-lbl { font-size: .68rem; color: #6b7280; margin-top: 3px; }
    .fc-mid { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .fc-duration { font-size: .72rem; color: #6b7280; font-weight: 600; }
    .fc-line { width: 100%; display: flex; align-items: center; gap: 4px; }
    .fc-line-bar { flex: 1; height: 2px; background: #d1d5db; }
    .fc-plane { color: var(--primary); font-size: .9rem; }
    .fc-stops-lbl { font-size: .7rem; color: #6b7280; }
    .next-day-badge { background: #fef3c7; color: #92400e; border-radius: 4px; font-size: .65rem; font-weight: 700; padding: 1px 5px; }
    .fc-return-label { font-size: .68rem; color: #7c3aed; font-weight: 700; background: #ede9fe; border-radius: 4px; padding: 1px 5px; white-space: nowrap; }

    /* Price column */
    .fc-price { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 18px 20px; border-right: 1px solid #f0f2f5; gap: 6px; min-width: 140px; }
    .fc-price .amount { font-size: 1.5rem; font-weight: 800; color: var(--primary); white-space: nowrap; }
    .fc-price .per-pax { font-size: .7rem; color: #9ca3af; }
    .fc-price .select-btn { width: 100%; }

    /* Footer tags */
    .fc-footer { border-top: 1px solid #f0f2f5; padding: 8px 20px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; min-height: 38px; }
    .tag { border-radius: 20px; padding: 2px 10px; font-size: .72rem; font-weight: 600; }
    .tag-green  { background: #dcfce7; color: #166534; }
    .tag-blue   { background: #dbeafe; color: #1e40af; }
    .tag-orange { background: #fef3c7; color: #92400e; }
    .tag-gray   { background: #f3f4f6; color: #4b5563; }
    .tag-red    { background: #fee2e2; color: #991b1b; }

    /* Sort bar */
    .sort-bar { display: flex; gap: 8px; margin-bottom: 14px; align-items: center; flex-wrap: wrap; }
    .sort-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid #e5e7eb; background: #fff; font-size: .8rem; cursor: pointer; transition: all .15s; font-family: inherit; }
    .sort-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

    /* Currency bar */
    .currency-bar { display: flex; gap: 6px; align-items: center; padding: 8px 0 0; }
    .currency-btn { padding: 3px 10px; border-radius: 14px; border: 1px solid rgba(255,255,255,.4); background: transparent; color: rgba(255,255,255,.75); font-size: .75rem; cursor: pointer; transition: all .15s; font-family: inherit; }
    .currency-btn.active { background: #fff; color: var(--primary); border-color: #fff; font-weight: 700; }

    .mobile-filter-btn { display: none; }
    @media(max-width:900px) { .mobile-filter-btn { display: block; } }

    /* Loading skeleton */
    .skeleton-card { background: #fff; border-radius: 14px; border: 1px solid #e8ecf0; padding: 20px; margin-bottom: 12px; }
    .skeleton-line { height: 14px; background: linear-gradient(90deg,#f0f2f5 25%,#e8ecf0 50%,#f0f2f5 75%); background-size: 200% 100%; animation: shimmer 1.2s infinite; border-radius: 6px; margin-bottom: 10px; }
    @keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
  </style>
</head>
<body>

<!-- Header -->
<div class="page-header">
  <div style="max-width:1200px;margin:0 auto;padding:0 20px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <a href="index.html" style="color:#fff;font-size:1.2rem;font-weight:700;text-decoration:none">✈️ FlyMasar</a>
      <div style="display:flex;gap:8px;align-items:center">
        <div id="navAuth"></div>
      </div>
    </div>

    <!-- Compact Search -->
    <div class="search-bar-compact">
      <div style="flex:1;min-width:100px">
        <div class="form-label">من</div>
        <input type="text" class="form-control" id="sFrom" style="text-transform:uppercase">
      </div>
      <div style="flex:1;min-width:100px">
        <div class="form-label">إلى</div>
        <input type="text" class="form-control" id="sTo" style="text-transform:uppercase">
      </div>
      <div>
        <div class="form-label">ذهاب</div>
        <input type="text" class="form-control" id="sDepDate" style="min-width:110px;direction:ltr" readonly>
      </div>
      <div>
        <div class="form-label">عودة</div>
        <input type="text" class="form-control" id="sRetDate" style="min-width:110px;direction:ltr" readonly>
      </div>
      <div>
        <div class="form-label">المسافرون</div>
        <input type="text" class="form-control" id="sPaxDisplay" readonly style="min-width:100px;cursor:default">
        <input type="hidden" id="sPax">
      </div>
      <div>
        <div class="form-label">الدرجة</div>
        <select class="form-control" id="sCabin" style="min-width:100px">
          <option value="economy">اقتصادية</option>
          <option value="premium_economy">اقتصادية مميزة</option>
          <option value="business">رجال أعمال</option>
          <option value="first">أولى</option>
        </select>
      </div>
      <button class="btn btn-primary btn-sm" onclick="doSearch()">🔍 بحث</button>
    </div>

    <!-- Currency selector + search summary -->
    <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 0 12px;flex-wrap:wrap;gap:8px">
      <div style="font-size:.82rem;color:rgba(255,255,255,.7)" id="searchSummary"></div>
      <div class="currency-bar">
        <span style="font-size:.72rem;color:rgba(255,255,255,.5)">العملة:</span>
        <button class="currency-btn" data-currency="KWD" onclick="setCurrency('KWD')">KWD</button>
        <button class="currency-btn" data-currency="SAR" onclick="setCurrency('SAR')">SAR</button>
        <button class="currency-btn" data-currency="USD" onclick="setCurrency('USD')">USD</button>
        <button class="currency-btn" data-currency="GBP" onclick="setCurrency('GBP')">GBP</button>
      </div>
    </div>
  </div>
</div>

<div class="results-layout">
  <!-- Filters Sidebar -->
  <div class="filters-panel" id="filtersPanel">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
        <h3 style="margin:0;font-size:.95rem;color:#1a2e5a">الفلاتر</h3>
        <button class="btn btn-ghost btn-sm" onclick="clearFilters()" style="font-size:.75rem">مسح الكل</button>
      </div>

      <div class="filter-section">
        <h4>السعر</h4>
        <div style="display:flex;justify-content:space-between;font-size:.78rem;color:var(--text-muted);margin-bottom:6px">
          <span id="priceMin">0</span>
          <span id="priceMax">5,000</span>
        </div>
        <input type="range" class="range-input" id="priceRange" min="0" max="5000" value="5000" oninput="applyFilters()">
      </div>

      <div class="filter-section">
        <h4>التوقفات</h4>
        <label class="filter-checkbox"><input type="checkbox" id="stop0" onchange="applyFilters()"> مباشر</label>
        <label class="filter-checkbox"><input type="checkbox" id="stop1" onchange="applyFilters()"> توقف واحد</label>
        <label class="filter-checkbox"><input type="checkbox" id="stop2" onchange="applyFilters()"> توقفان فأكثر</label>
      </div>

      <div class="filter-section">
        <h4>وقت المغادرة</h4>
        <label class="filter-checkbox"><input type="checkbox" id="t0006" onchange="applyFilters()"> 00:00 – 06:00</label>
        <label class="filter-checkbox"><input type="checkbox" id="t0612" onchange="applyFilters()"> 06:00 – 12:00</label>
        <label class="filter-checkbox"><input type="checkbox" id="t1218" onchange="applyFilters()"> 12:00 – 18:00</label>
        <label class="filter-checkbox"><input type="checkbox" id="t1824" onchange="applyFilters()"> 18:00 – 00:00</label>
      </div>

      <div class="filter-section">
        <h4>شركة الطيران</h4>
        <div id="airlineFilters"><p style="font-size:.78rem;color:var(--text-muted)">جاري التحميل...</p></div>
      </div>

      <div class="filter-section">
        <h4>الأمتعة</h4>
        <label class="filter-checkbox"><input type="checkbox" id="baggageIncl" onchange="applyFilters()"> يشمل أمتعة مسجلة</label>
      </div>
    </div>
  </div>

  <!-- Results -->
  <div>
    <button class="btn btn-outline btn-sm mobile-filter-btn" onclick="toggleFilters()" style="margin-bottom:12px;width:100%">⚡ الفلاتر والترتيب</button>

    <div class="sort-bar">
      <span style="font-size:.8rem;color:var(--text-muted)">ترتيب حسب:</span>
      <button class="sort-btn active" id="sort-direct"    onclick="setSort('direct')">المباشر أولاً</button>
      <button class="sort-btn"        id="sort-duration"  onclick="setSort('duration')">الأسرع</button>
      <button class="sort-btn"        id="sort-price"     onclick="setSort('price')">الأرخص</button>
      <button class="sort-btn"        id="sort-departure" onclick="setSort('departure')">المغادرة</button>
      <span style="margin-right:auto;font-size:.82rem;color:var(--text-muted)" id="resultsCount"></span>
    </div>

    <div id="loadingState">
      <div class="skeleton-card"><div class="skeleton-line" style="width:40%"></div><div class="skeleton-line" style="width:80%"></div><div class="skeleton-line" style="width:60%"></div></div>
      <div class="skeleton-card"><div class="skeleton-line" style="width:35%"></div><div class="skeleton-line" style="width:75%"></div><div class="skeleton-line" style="width:55%"></div></div>
      <div class="skeleton-card"><div class="skeleton-line" style="width:45%"></div><div class="skeleton-line" style="width:70%"></div><div class="skeleton-line" style="width:65%"></div></div>
      <p style="text-align:center;color:var(--text-muted);margin-top:8px;font-size:.85rem">جاري البحث عن أفضل الرحلات...</p>
    </div>

    <div id="errorState" style="display:none;text-align:center;padding:60px 20px;background:#fff;border-radius:14px">
      <div style="font-size:3rem;margin-bottom:12px">✈️</div>
      <h3 id="errorTitle" style="color:#1a2e5a">لا توجد رحلات متاحة</h3>
      <p id="errorMsg" style="color:var(--text-muted)">جرب تعديل معايير البحث</p>
      <button class="btn btn-primary btn-sm" onclick="fetchFlights()" style="margin-top:12px">إعادة المحاولة</button>
    </div>

    <div id="resultsList"></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/currency.js"></script>
<script src="js/datepicker.js"></script>
<script>
var allOffers     = [];
var filteredOffers = [];
var currentSort   = 'direct';
var searchParams  = {};

// ─── Date helpers ───────────────────────────────────────────────
function toISODate(val) {
  if (!val) return '';
  if (/^\d{4}-\d{2}-\d{2}$/.test(val)) return val;
  var d = new Date(val);
  if (!isNaN(d.getTime())) return d.toISOString().substring(0,10);
  return val;
}

function fmtTime(dt) {
  if (!dt) return '—';
  // Extract time directly from ISO string to avoid timezone conversion
  var timePart = dt.substring(11, 16); // "HH:MM"
  if (!timePart || timePart.length < 5) return '—';
  var h = parseInt(timePart.substring(0,2));
  var m = timePart.substring(3,5);
  var suffix = h < 12 ? 'ص' : 'م';
  var h12 = h % 12 || 12;
  return h12 + ':' + m + ' ' + suffix;
}

function fmtDate(dt) {
  if (!dt) return '';
  try {
    return new Date(dt).toLocaleDateString('ar-KW',{day:'numeric',month:'short'});
  } catch(e) { return dt.substring(0,10); }
}

function isNextDay(depDt, arrDt) {
  if (!depDt || !arrDt) return false;
  var d1 = depDt.substring(0,10);
  var d2 = arrDt.substring(0,10);
  return d1 !== d2;
}

function parseDuration(iso) {
  if (!iso) return 0;
  var m = iso.match(/PT(?:(\d+)H)?(?:(\d+)M)?/);
  if (!m) return 0;
  return (parseInt(m[1]||0)*60) + parseInt(m[2]||0);
}

function fmtDuration(mins) {
  if (!mins) return '—';
  var h = Math.floor(mins/60), m = mins%60;
  return h+'س' + (m?' '+m+'د':'');
}

// ─── Data extractors ───────────────────────────────────────────
function getSlice(o,i){ return (o.slices||[])[i||0]||{}; }
function getSegs(o,i){ return getSlice(o,i).segments||[]; }
function getFirstSeg(o){ return getSegs(o)[0]||{}; }
function getLastSeg(o){ var s=getSegs(o); return s[s.length-1]||{}; }

function getStops(o) {
  var segs = getSegs(o);
  return Math.max(0, segs.length-1);
}

function getDepDt(o)  { return getFirstSeg(o).departing_at||''; }
function getArrDt(o)  { return getLastSeg(o).arriving_at||''; }
function getDepHour(o){ var d=getDepDt(o); return d?new Date(d).getHours():0; }
function getDuration(o){
  var mins = o.duration_minutes;
  if (mins) return mins;
  var sl = getSlice(o);
  if (sl.duration) return parseDuration(sl.duration);
  var dep=getDepDt(o), arr=getArrDt(o);
  if (dep&&arr) return Math.round((new Date(arr)-new Date(dep))/60000);
  return 0;
}

function getOriginCode(o){
  var sl=getSlice(o);
  return (sl.origin&&(sl.origin.iata_code||sl.origin))||getFirstSeg(o).departing_airport?.iata_code||'—';
}
function getDestCode(o){
  var sl=getSlice(o);
  return (sl.destination&&(sl.destination.iata_code||sl.destination))||getLastSeg(o).arriving_airport?.iata_code||'—';
}
var AIRPORT_AR = {
  KWI:'مطار الكويت الدولي',AUH:'مطار أبوظبي الدولي',DXB:'مطار دبي الدولي',DOH:'مطار حمد الدولي',
  RUH:'مطار الملك خالد',JED:'مطار الملك عبدالعزيز',DMM:'مطار الملك فهد',BAH:'مطار البحرين الدولي',
  MCT:'مطار مسقط الدولي',AMM:'مطار الملكة علياء',BEY:'مطار رفيق الحريري',CAI:'مطار القاهرة',
  LHR:'مطار لندن هيثرو',LGW:'مطار لندن غاتويك',CDG:'مطار شارل ديغول',FRA:'مطار فرانكفورت',
  IST:'مطار إسطنبول',MUC:'مطار ميونيخ',FCO:'مطار روما فيوميتشينو',MAD:'مطار مدريد',
  BKK:'مطار سوفارنابهومي بانكوك',SIN:'مطار شنغهاي',KUL:'مطار كوالالمبور',
  DEL:'مطار إنديرا غاندي',BOM:'مطار مومباي',HYD:'مطار حيدر آباد',CMB:'مطار كولومبو',
  NBO:'مطار نيروبي',ADD:'مطار أديس أبابا',JFK:'مطار جون كينيدي',LAX:'مطار لوس أنجلوس',
  ORD:'مطار أوهير شيكاغو',SYD:'مطار سيدني',TXL:'مطار برلين',VIE:'مطار فيينا',
  ZRH:'مطار زيورخ',AMS:'مطار أمستردام',MAN:'مطار مانشستر',DUB:'مطار دبلن',
  GVA:'مطار جنيف',BCN:'مطار برشلونة',ATH:'مطار أثينا',HKG:'مطار هونغ كونغ',
  NRT:'مطار نيريتا طوكيو',ICN:'مطار إنشيون سيول',PEK:'مطار بيجين',PVG:'مطار شنغهاي بودونغ',
  CGK:'مطار سوكارنو هاتا جاكرتا',MNL:'مطار مانيلا',TBS:'مطار تفليس',GYD:'مطار باكو',
  EVN:'مطار يريفان',TAS:'مطار طشقند',NJF:'مطار النجف الدولي',BGW:'مطار بغداد',
  KHI:'مطار كراتشي',LHE:'مطار لاهور',ISB:'مطار إسلام آباد',
};

function arAirportName(code) {
  return code ? (AIRPORT_AR[code] || '') : '';
}

function getOriginName(o){
  var sl=getSlice(o);
  var code = getOriginCode(o);
  return arAirportName(code) || (sl.origin&&sl.origin.name)||(getFirstSeg(o).departing_airport&&getFirstSeg(o).departing_airport.name)||'';
}
function getDestName(o){
  var sl=getSlice(o);
  var code = getDestCode(o);
  return arAirportName(code) || (sl.destination&&sl.destination.name)||(getLastSeg(o).arriving_airport&&getLastSeg(o).arriving_airport.name)||'';
}

function getAirline(o){
  var seg = getFirstSeg(o);
  var mc  = seg.marketing_carrier||seg.operating_carrier||{};
  var code = mc.iata_code || o.airline_code || '';
  // Logo chain: Duffel public CDN → API logo_symbol_url → airhex
  var duffelCdn = code ? 'https://assets.duffel.com/img/airlines/for-light-background/'+code+'.svg' : '';
  var apiLogo   = mc.logo_symbol_url || mc.logo_lockup_url || '';
  var airhex    = code ? 'https://content.airhex.com/content/logos/airlines_'+code+'_64_64_f.png' : '';
  return {
    name:     mc.name || o.airline || 'غير محدد',
    code:     code,
    logo:     duffelCdn || apiLogo,
    fallback1: apiLogo && apiLogo !== duffelCdn ? apiLogo : airhex,
    fallback2: airhex,
  };
}

/* ── Baggage: Duffel stores baggages on offer.passengers[].baggages ── */
function _offerBaggages(o) {
  // offer-level passengers array (from formatOffer)
  var paxArr = o.passengers || [];
  for (var i = 0; i < paxArr.length; i++) {
    var bags = paxArr[i].baggages || [];
    if (bags.length) return bags;
  }
  // fall back to segment-level passengers (legacy shape)
  var segs = getSegs(o);
  for (var si = 0; si < segs.length; si++) {
    var sp = segs[si].passengers || [];
    for (var pi = 0; pi < sp.length; pi++) {
      var sb = sp[pi].baggages || [];
      if (sb.length) return sb;
    }
  }
  return [];
}

function hasCheckedBaggage(o){
  if (o.baggage_included) return true;
  var bags = _offerBaggages(o);
  for (var i = 0; i < bags.length; i++) {
    if (bags[i].type === 'checked' && (bags[i].quantity || 0) > 0) return true;
  }
  // legacy segment passengers shape
  var segs = getSegs(o);
  for (var i = 0; i < segs.length; i++){
    var sp = segs[i].passengers || [];
    for (var j = 0; j < sp.length; j++){
      if ((sp[j].checked_bags||0)>0) return true;
    }
  }
  return false;
}

function hasBaggage(o){
  return hasCheckedBaggage(o);
}

function getBaggageText(o){
  // Only show checked baggage — carry-on is included in almost all fares and is not meaningful to highlight
  var bags = _offerBaggages(o);
  var checked = 0;
  for (var i = 0; i < bags.length; i++) {
    if (bags[i].type === 'checked') checked += (bags[i].quantity || 0);
  }
  if (checked > 0) return checked+'×أمتعة مسجلة';
  // legacy shape fallback (checked bags only)
  var segs = getSegs(o);
  for(var i=0;i<segs.length;i++){
    var pax = (segs[i].passengers||[]);
    for(var j=0;j<pax.length;j++){
      var cb = pax[j].checked_bags||0;
      if(cb>0) return cb+'×أمتعة مسجلة';
    }
  }
  return null;
}

function getAircraftType(o){
  var seg = getFirstSeg(o);
  return (seg.aircraft&&seg.aircraft.name)||'';
}

function isRefundable(o){
  var c = o.conditions||{};
  var rbf = c.refund_before_departure;
  return rbf && (rbf.allowed===true || rbf.allowed==='true');
}

function isChangeable(o){
  var c = o.conditions||{};
  var cbc = c.change_before_departure;
  return cbc && (cbc.allowed===true || cbc.allowed==='true');
}

function getRefundText(o){
  var c = o.conditions||{};
  var rbf = c.refund_before_departure;
  if (!rbf) return null;
  if (rbf.allowed===true || rbf.allowed==='true') {
    if (rbf.penalty_amount && parseFloat(rbf.penalty_amount)>0)
      return 'استرداد (غرامة '+formatPrice(parseFloat(rbf.penalty_amount))+')';
    return 'قابل للاسترداد';
  }
  return null;
}

function getChangeText(o){
  var c = o.conditions||{};
  var cbc = c.change_before_departure;
  if (!cbc) return null;
  if (cbc.allowed===true || cbc.allowed==='true') {
    if (cbc.penalty_amount && parseFloat(cbc.penalty_amount)>0)
      return 'تغيير (غرامة '+formatPrice(parseFloat(cbc.penalty_amount))+')';
    return 'قابل للتغيير';
  }
  return null;
}

// ─── Per-slice helpers ──────────────────────────────────────────
function getSliceStops(o, sliceIdx) {
  var segs = getSegs(o, sliceIdx);
  return Math.max(0, segs.length - 1);
}

function getSliceDepDt(o, sliceIdx) {
  var segs = getSegs(o, sliceIdx);
  return segs.length ? (segs[0].departing_at || '') : '';
}

function getSliceArrDt(o, sliceIdx) {
  var segs = getSegs(o, sliceIdx);
  return segs.length ? (segs[segs.length-1].arriving_at || '') : '';
}

function getSliceDuration(o, sliceIdx) {
  var sl = getSlice(o, sliceIdx);
  if (sl.duration) return parseDuration(sl.duration);
  var dep = getSliceDepDt(o, sliceIdx);
  var arr = getSliceArrDt(o, sliceIdx);
  if (dep && arr) return Math.round((new Date(arr)-new Date(dep))/60000);
  return 0;
}

function getSliceOriginCode(o, sliceIdx) {
  var sl = getSlice(o, sliceIdx);
  return (sl.origin && (sl.origin.iata_code || sl.origin)) ||
    (getSegs(o, sliceIdx)[0] || {}).departing_airport?.iata_code || '—';
}

function getSliceDestCode(o, sliceIdx) {
  var sl = getSlice(o, sliceIdx);
  var segs = getSegs(o, sliceIdx);
  return (sl.destination && (sl.destination.iata_code || sl.destination)) ||
    (segs[segs.length-1] || {}).arriving_airport?.iata_code || '—';
}

function getSliceOriginName(o, sliceIdx) {
  var code = getSliceOriginCode(o, sliceIdx);
  if (AIRPORT_AR[code]) return AIRPORT_AR[code];
  var sl = getSlice(o, sliceIdx);
  var segs = getSegs(o, sliceIdx);
  return (sl.origin && sl.origin.name) || ((segs[0] || {}).departing_airport && segs[0].departing_airport.name) || '';
}

function getSliceDestName(o, sliceIdx) {
  var code = getSliceDestCode(o, sliceIdx);
  if (AIRPORT_AR[code]) return AIRPORT_AR[code];
  var sl = getSlice(o, sliceIdx);
  var segs = getSegs(o, sliceIdx);
  var last = segs[segs.length-1] || {};
  return (sl.destination && sl.destination.name) || (last.arriving_airport && last.arriving_airport.name) || '';
}

/**
 * Returns HTML for one slice row (outbound or return).
 * @param {object} o        - full offer object
 * @param {number} sliceIdx - 0 for outbound, 1 for return
 * @param {boolean} isReturn - true → show ↩ عودة label
 */
function getSliceRow(o, sliceIdx, isReturn) {
  var depDt    = getSliceDepDt(o, sliceIdx);
  var arrDt    = getSliceArrDt(o, sliceIdx);
  var durMins  = getSliceDuration(o, sliceIdx);
  var origCode = getSliceOriginCode(o, sliceIdx);
  var destCode = getSliceDestCode(o, sliceIdx);
  var origName = getSliceOriginName(o, sliceIdx);
  var destName = getSliceDestName(o, sliceIdx);
  var stops    = getSliceStops(o, sliceIdx);
  var nextDay  = isNextDay(depDt, arrDt);

  // Transit airports for this slice
  var segs = getSegs(o, sliceIdx);
  var transitCodes = [];
  for (var i = 0; i < segs.length - 1; i++) {
    var ar = segs[i].arriving_airport;
    if (ar && ar.iata_code) transitCodes.push(ar.iata_code);
  }
  var transitHint = transitCodes.length ? ' عبر '+transitCodes.join('،') : '';

  var returnLabel = isReturn
    ? '<span class="fc-return-label">↩ عودة</span>'
    : '';

  return '<div class="fc-route">'
    + returnLabel
    + '<div class="fc-point">'
      + '<div class="time">'+fmtTime(depDt)+'</div>'
      + '<div class="iata">'+origCode+'</div>'
      + (origName ? '<div class="apt-name" title="'+origName+'">'+origName+'</div>' : '')
      + '<div class="date-lbl">'+fmtDate(depDt)+'</div>'
    + '</div>'
    + '<div class="fc-mid">'
      + '<div class="fc-duration">'+fmtDuration(durMins)+'</div>'
      + '<div class="fc-line"><div class="fc-line-bar"></div><span class="fc-plane">✈</span><div class="fc-line-bar"></div></div>'
      + '<div class="fc-stops-lbl">'+(stops===0?'مباشر':stops+' توقف'+transitHint)+'</div>'
    + '</div>'
    + '<div class="fc-point">'
      + '<div class="time">'+fmtTime(arrDt)+(nextDay?'<sup class="next-day-badge">+1</sup>':'')+'</div>'
      + '<div class="iata">'+destCode+'</div>'
      + (destName ? '<div class="apt-name" title="'+destName+'">'+destName+'</div>' : '')
      + '<div class="date-lbl">'+fmtDate(arrDt)+'</div>'
    + '</div>'
  + '</div>';
}

// ─── Init ───────────────────────────────────────────────────────
function initPage() {
  var p = new URLSearchParams(window.location.search);
  searchParams = {
    origin:      (p.get('from')||'').toUpperCase(),
    destination: (p.get('to')  ||'').toUpperCase(),
    departure:   toISODate(p.get('dep')||''),
    return:      toISODate(p.get('ret')||''),
    passengers:  parseInt(p.get('pax')||'1'),
    children:    parseInt(p.get('children')||'0'),
    infants:     parseInt(p.get('infants') ||'0'),
    cabin:       p.get('cabin')||'economy',
    trip_type:   p.get('type') ||'one_way',
  };

  document.getElementById('sFrom').value    = searchParams.origin;
  document.getElementById('sTo').value      = searchParams.destination;
  document.getElementById('sDepDate').value = searchParams.departure;
  document.getElementById('sRetDate').value = searchParams.return || '';
  document.getElementById('sPax').value     = searchParams.passengers;
  document.getElementById('sCabin').value   = searchParams.cabin;

  // Passenger display summary
  var paxParts = [searchParams.passengers + ' بالغ'];
  if (searchParams.children > 0) paxParts.push(searchParams.children + ' طفل');
  if (searchParams.infants  > 0) paxParts.push(searchParams.infants  + ' رضيع');
  document.getElementById('sPaxDisplay').value = paxParts.join('، ');

  if (searchParams.departure) {
    var paxSummary = searchParams.passengers + ' بالغ';
    if (searchParams.children > 0) paxSummary += '، ' + searchParams.children + ' طفل';
    if (searchParams.infants  > 0) paxSummary += '، ' + searchParams.infants  + ' رضيع';
    var tripType = searchParams.return ? 'ذهاب وعودة' : 'ذهاب فقط';
    document.getElementById('searchSummary').textContent =
      tripType + ' | ' +
      searchParams.origin + ' ← → ' + searchParams.destination + ' | ' +
      searchParams.departure + (searchParams.return ? ' – ' + searchParams.return : '') + ' | ' +
      paxSummary + ' | ' + cabinLabel(searchParams.cabin);
  }

  // Nav
  document.getElementById('navAuth').innerHTML = Auth.isLoggedIn()
    ? '<a href="dashboard.html" class="btn btn-ghost btn-sm" style="color:#fff;border-color:rgba(255,255,255,.3)">حسابي</a>'
    : '<a href="login.html" class="btn btn-ghost btn-sm" style="color:#fff;border-color:rgba(255,255,255,.3)">دخول</a>';

  // Currency buttons init — default to KWD if no stored preference
  if (!localStorage.getItem('flymasar_currency')) {
    localStorage.setItem('flymasar_currency', 'KWD');
  }
  initCurrency();

  if (searchParams.origin && searchParams.destination && searchParams.departure) {
    fetchFlights();
  } else {
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('errorState').style.display   = 'block';
  }
}

function cabinLabel(c) {
  return {economy:'اقتصادية',premium_economy:'اقتصادية مميزة',business:'رجال أعمال',first:'أولى'}[c]||c;
}

// ─── Fetch ──────────────────────────────────────────────────────
function fetchFlights() {
  document.getElementById('loadingState').style.display = 'block';
  document.getElementById('resultsList').innerHTML = '';
  document.getElementById('errorState').style.display = 'none';

  var payload = {
    origin:         searchParams.origin,
    destination:    searchParams.destination,
    departure_date: searchParams.departure,
    adults:         searchParams.passengers || 1,
    cabin_class:    searchParams.cabin || 'economy',
  };
  if (searchParams.return)   payload.return_date = searchParams.return;
  if (searchParams.children) payload.children    = searchParams.children;
  if (searchParams.infants)  payload.infants     = searchParams.infants;

  Api.post('/api/flights/search', payload, Auth.isLoggedIn()).then(function(res) {
    document.getElementById('loadingState').style.display = 'none';
    var offers = res.offers || res.data || [];
    if (!offers.length) {
      showError('لا توجد رحلات متاحة', 'جرب تعديل معايير البحث أو تواريخ السفر');
      return;
    }
    allOffers = offers;
    buildAirlineFilters(offers);
    updatePriceRange(offers);
    applyFilters();
  }).catch(function(err) {
    document.getElementById('loadingState').style.display = 'none';
    var msg = (err&&(err.message||err.error))||'خدمة البحث غير متاحة، الرجاء المحاولة لاحقاً';
    showError('تعذّر البحث', msg);
  });
}

function showError(title, msg) {
  document.getElementById('errorTitle').textContent = title;
  document.getElementById('errorMsg').textContent   = msg;
  document.getElementById('errorState').style.display = 'block';
}

// ─── Filters ────────────────────────────────────────────────────
function updatePriceRange(offers) {
  var minGBP = Infinity, maxGBP = 0;
  offers.forEach(function(o){
    var p = parseFloat(o.total_amount || 0);
    if (p < minGBP) minGBP = p;
    if (p > maxGBP) maxGBP = p;
  });
  if (!isFinite(minGBP)) minGBP = 0;
  maxGBP = Math.ceil(maxGBP / 100) * 100 || 5000;
  // Store GBP range on slider for filter logic (filter compares total_amount which is GBP)
  document.getElementById('priceRange').min   = 0;
  document.getElementById('priceRange').max   = maxGBP;
  document.getElementById('priceRange').value = maxGBP;
  document.getElementById('priceMin').textContent = formatPrice(minGBP);
  document.getElementById('priceMax').textContent = formatPrice(maxGBP);
}

function buildAirlineFilters(offers) {
  var airlines = {};
  offers.forEach(function(o){
    var al = getAirline(o);
    if (al.code) airlines[al.code] = al.name;
  });
  var html = '';
  Object.keys(airlines).sort().forEach(function(code){
    html += '<label class="filter-checkbox"><input type="checkbox" class="airline-cb" value="'+code+'" onchange="applyFilters()"> '+airlines[code]+'</label>';
  });
  document.getElementById('airlineFilters').innerHTML = html||'<p style="font-size:.78rem;color:var(--text-muted)">لا يوجد</p>';
}

function applyFilters() {
  var maxPrice   = parseFloat(document.getElementById('priceRange').value);
  var stop0      = document.getElementById('stop0').checked;
  var stop1      = document.getElementById('stop1').checked;
  var stop2      = document.getElementById('stop2').checked;
  var anyStop    = !stop0&&!stop1&&!stop2;
  var t0006      = document.getElementById('t0006').checked;
  var t0612      = document.getElementById('t0612').checked;
  var t1218      = document.getElementById('t1218').checked;
  var t1824      = document.getElementById('t1824').checked;
  var anyTime    = !t0006&&!t0612&&!t1218&&!t1824;
  var baggageIncl= document.getElementById('baggageIncl').checked;
  var selectedAL = [];
  document.querySelectorAll('.airline-cb:checked').forEach(function(cb){ selectedAL.push(cb.value); });

  document.getElementById('priceMin').textContent = formatPrice(0);
  document.getElementById('priceMax').textContent = formatPrice(maxPrice);

  filteredOffers = allOffers.filter(function(o){
    var price = parseFloat(o.total_amount||0);
    if (price > maxPrice) return false;

    var stops = getStops(o);
    if (!anyStop){
      if (stops===0 && !stop0) return false;
      if (stops===1 && !stop1) return false;
      if (stops>=2  && !stop2) return false;
    }

    if (!anyTime){
      var h = getDepHour(o);
      var ok = (t0006&&h<6)||(t0612&&h>=6&&h<12)||(t1218&&h>=12&&h<18)||(t1824&&h>=18);
      if (!ok) return false;
    }

    if (selectedAL.length>0){
      var code = getAirline(o).code||'XX';
      if (selectedAL.indexOf(code)===-1) return false;
    }

    if (baggageIncl && !hasBaggage(o)) return false;

    return true;
  });

  sortOffers();
  renderResults();
}

// ─── Sort ───────────────────────────────────────────────────────
function setSort(s) {
  currentSort = s;
  document.querySelectorAll('.sort-btn').forEach(function(b){ b.classList.remove('active'); });
  document.getElementById('sort-'+s).classList.add('active');
  sortOffers();
  renderResults();
}

function sortOffers() {
  filteredOffers.sort(function(a,b){
    if (currentSort==='direct') {
      // Direct first, then by duration within same stop count
      var sa=getStops(a), sb=getStops(b);
      if (sa!==sb) return sa-sb;
      return getDuration(a)-getDuration(b);
    }
    if (currentSort==='duration')  return getDuration(a)-getDuration(b);
    if (currentSort==='price')     return parseFloat(a.total_amount||0)-parseFloat(b.total_amount||0);
    if (currentSort==='departure') return getDepHour(a)-getDepHour(b);
    return 0;
  });
}

// ─── Render ─────────────────────────────────────────────────────
function renderResults() {
  document.getElementById('resultsCount').textContent = filteredOffers.length + ' رحلة';

  if (!filteredOffers.length) {
    document.getElementById('resultsList').innerHTML =
      '<div style="text-align:center;padding:40px;background:#fff;border-radius:14px"><div style="font-size:2.5rem;margin-bottom:8px">🔍</div><p style="color:var(--text-muted)">لا توجد رحلات تطابق الفلاتر المحددة</p><button class="btn btn-ghost btn-sm" onclick="clearFilters()" style="margin-top:8px">إزالة الفلاتر</button></div>';
    return;
  }

  var html = '';
  filteredOffers.forEach(function(o) {
    var al        = getAirline(o);
    var sliceCount = (o.slices || []).length;
    var isRoundTrip = sliceCount >= 2;

    // Outbound slice (slice 0) values used for filters / share text
    var stops    = getSliceStops(o, 0);
    var depDt    = getSliceDepDt(o, 0);
    var arrDt    = getSliceArrDt(o, 0);
    var durMins  = getSliceDuration(o, 0);
    var origCode = getSliceOriginCode(o, 0);
    var destCode = getSliceDestCode(o, 0);
    var aircraft  = getAircraftType(o);
    var bagText   = getBaggageText(o);
    var refundTxt = getRefundText(o);
    var changeTxt = getChangeText(o);
    var nextDay   = isNextDay(depDt, arrDt);
    var priceGBP  = parseFloat(o.total_amount || 0);
    var offerId   = o.offer_id || o.id || '';

    // Stops label (outbound)
    var stopsLabel = stops===0
      ? '<span class="tag tag-green">مباشر</span>'
      : stops===1
        ? '<span class="tag tag-gray">توقف واحد</span>'
        : '<span class="tag tag-orange">'+stops+' توقفات</span>';

    // For round-trips also show return-slice stops in footer
    var returnStopsLabel = '';
    if (isRoundTrip) {
      var rs = getSliceStops(o, 1);
      returnStopsLabel = rs===0
        ? '<span class="tag tag-green">عودة مباشر</span>'
        : '<span class="tag tag-gray">عودة: '+rs+' توقف</span>';
    }

    // WhatsApp share text
    var shareText = 'رحلة ✈ '+origCode+' → '+destCode
      + ' | '+fmtTime(depDt)+' – '+fmtTime(arrDt)+(nextDay?' (+1)':'')
      + ' | '+fmtDuration(durMins)
      + ' | '+(stops===0?'مباشر':stops+' توقف')
      + (isRoundTrip ? '\nعودة: '+getSliceOriginCode(o,1)+' → '+getSliceDestCode(o,1)+' | '+fmtTime(getSliceDepDt(o,1))+' – '+fmtTime(getSliceArrDt(o,1)) : '')
      + '\n'+al.name+'\nالسعر: '+formatPrice(priceGBP)+'\nللحجز: https://flymasar.com';
    var waLink = 'https://api.whatsapp.com/send?text='+encodeURIComponent(shareText);

    // Airline logo: Duffel public CDN → API logo URL → airhex → initials
    var fallbackInitials = al.code || al.name.substring(0,2).toUpperCase();
    var logoHtml;
    if (al.logo) {
      var fb1 = al.fallback1 || '';
      var fb2 = al.fallback2 || '';
      // Build a chain: img tries logo, on error tries fb1, on error tries fb2, on error shows initials div
      var onerrorJs;
      if (fb1 && fb2 && fb1 !== fb2) {
        onerrorJs = 'this.src=\''+fb1+'\';this.onerror=function(){'
          + 'this.src=\''+fb2+'\';this.onerror=function(){'
          + 'this.onerror=null;this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\''
          + '}}';
      } else if (fb1) {
        onerrorJs = 'this.src=\''+fb1+'\';this.onerror=function(){this.onerror=null;this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'}';
      } else {
        onerrorJs = 'this.onerror=null;this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'';
      }
      logoHtml = '<img src="'+al.logo+'" alt="'+al.name+'" onerror="'+onerrorJs+'">'
        + '<div class="al-logo-fallback" style="display:none">'+fallbackInitials+'</div>';
    } else {
      logoHtml = '<div class="al-logo-fallback">'+fallbackInitials+'</div>';
    }

    // Build slice rows
    var routeHtml = '<div class="fc-routes">'
      + getSliceRow(o, 0, false);
    if (isRoundTrip) {
      routeHtml += getSliceRow(o, 1, true);
    }
    routeHtml += '</div>';

    html += '<div class="flight-card">'
      + '<div class="fc-main">'

        // Airline column
        + '<div class="fc-airline">'
          + logoHtml
          + '<div class="al-name">'+al.name+'</div>'
          + (al.code ? '<div class="al-code">'+al.code+'</div>' : '')
          + (aircraft ? '<div class="al-code" style="margin-top:2px">✈ '+aircraft+'</div>' : '')
        + '</div>'

        // Route(s) column
        + routeHtml

        // Price column
        + '<div class="fc-price">'
          + '<div class="amount" data-price-gbp="'+priceGBP+'">'+formatPrice(priceGBP)+'</div>'
          + '<div class="per-pax">'+(isRoundTrip?'ذهاب وعودة':'لكل مسافر')+'</div>'
          + '<button class="btn btn-primary btn-sm select-btn" onclick="selectFlight(\''+offerId+'\')">اختيار</button>'
        + '</div>'

      + '</div>'

      // Footer tags
      + '<div class="fc-footer">'
        + stopsLabel
        + returnStopsLabel
        + (bagText ? '<span class="tag tag-blue">'+bagText+'</span>' : '<span class="tag tag-gray">بدون أمتعة مسجلة</span>')
        + (refundTxt ? '<span class="tag tag-green">'+refundTxt+'</span>' : '<span class="tag tag-red">غير مسترد</span>')
        + (changeTxt ? '<span class="tag tag-blue">'+changeTxt+'</span>' : '')
        + (nextDay ? '<span class="tag tag-orange">وصول اليوم التالي</span>' : '')
        + '<a href="'+waLink+'" target="_blank" rel="noopener" style="margin-right:auto;color:#25d366;text-decoration:none;font-size:.78rem;display:flex;align-items:center;gap:4px">📲 واتساب</a>'
      + '</div>'

    + '</div>';
  });

  document.getElementById('resultsList').innerHTML = html;
}

// ─── Navigation ──────────────────────────────────────────────────
function selectFlight(offerId) {
  if (!Auth.isLoggedIn()) {
    window.location.href = 'login.html?redirect='+encodeURIComponent('booking.html?offer_id='+offerId+'&'+new URLSearchParams(searchParams).toString());
    return;
  }
  // Store search context for booking page
  localStorage.setItem('bk_adults',   searchParams.passengers||1);
  localStorage.setItem('bk_children', searchParams.children||0);
  localStorage.setItem('bk_infants',  searchParams.infants||0);
  var p = new URLSearchParams();
  p.set('offer_id', offerId);
  p.set('adults',   searchParams.passengers||1);
  p.set('cabin',    searchParams.cabin||'economy');
  window.location.href = 'booking.html?'+p.toString();
}

function doSearch() {
  var from  = document.getElementById('sFrom').value.trim().toUpperCase();
  var to    = document.getElementById('sTo').value.trim().toUpperCase();
  var dep   = toISODate(document.getElementById('sDepDate').value);
  var ret   = toISODate(document.getElementById('sRetDate').value);
  var pax   = parseInt(document.getElementById('sPax').value) || searchParams.passengers || 1;
  var cabin = document.getElementById('sCabin').value;
  var children = searchParams.children || 0;
  var infants  = searchParams.infants  || 0;
  if (!from||!to||!dep) { alert('الرجاء تعبئة جميع الحقول المطلوبة'); return; }
  var params = new URLSearchParams({from:from,to:to,dep:dep,pax:pax,cabin:cabin,type:ret?'round_trip':'one_way'});
  if (ret)      params.set('ret',      ret);
  if (children) params.set('children', children);
  if (infants)  params.set('infants',  infants);
  window.location.href = 'flights.html?'+params.toString();
}

function clearFilters() {
  var max = document.getElementById('priceRange').max;
  document.getElementById('priceRange').value = max;
  document.getElementById('priceMax').textContent = formatPrice(parseFloat(max));
  ['stop0','stop1','stop2','t0006','t0612','t1218','t1824','baggageIncl'].forEach(function(id){
    document.getElementById(id).checked=false;
  });
  document.querySelectorAll('.airline-cb').forEach(function(cb){ cb.checked=false; });
  applyFilters();
}

function toggleFilters() {
  document.getElementById('filtersPanel').classList.toggle('open');
}

initPage();
</script>
</body>
