<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>نتائج الرحلات — فلاي مسار</title>
  <link rel="stylesheet" href="css/app.css">
  <style>
    body { background: var(--bg-secondary, #f5f7fa); }
    .page-header { background: linear-gradient(135deg, #1a2e5a 0%, #0056b3 100%); color: #fff; padding: 20px 0 0; }
    .search-bar-compact { background: rgba(255,255,255,.12); border-radius: 12px; padding: 14px 16px; display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
    .search-bar-compact .form-control { background: rgba(255,255,255,.9); color: #1a2e5a; border: none; font-size: .85rem; }
    .search-bar-compact .form-label { color: rgba(255,255,255,.8); font-size: .75rem; margin-bottom: 4px; }
    .results-layout { display: grid; grid-template-columns: 260px 1fr; gap: 20px; padding: 20px; max-width: 1200px; margin: 0 auto; }
    @media(max-width:768px) { .results-layout { grid-template-columns: 1fr; } .filters-panel { display: none; } .filters-panel.open { display: block; } }
    .filters-panel .card { padding: 16px; margin-bottom: 16px; }
    .filter-section { margin-bottom: 16px; border-bottom: 1px solid var(--border-color, #e0e0e0); padding-bottom: 12px; }
    .filter-section:last-child { border-bottom: none; margin-bottom: 0; }
    .filter-section h4 { font-size: .85rem; font-weight: 600; margin: 0 0 8px; }
    .filter-checkbox { display: flex; align-items: center; gap: 6px; font-size: .82rem; margin-bottom: 4px; cursor: pointer; }
    .filter-checkbox input { width: 15px; height: 15px; accent-color: var(--primary); }
    .flight-card { background: #fff; border-radius: 12px; border: 1px solid var(--border-color, #e0e0e0); margin-bottom: 12px; overflow: hidden; transition: box-shadow .2s; }
    .flight-card:hover { box-shadow: 0 4px 20px rgba(0,0,0,.1); }
    .flight-card-main { display: grid; grid-template-columns: 1fr auto 1fr auto; gap: 16px; align-items: center; padding: 18px 20px; }
    @media(max-width:600px) { .flight-card-main { grid-template-columns: 1fr 1fr; gap: 10px; } }
    .airline-info { display: flex; align-items: center; gap: 8px; }
    .airline-logo { width: 36px; height: 36px; border-radius: 6px; background: var(--bg-secondary, #f5f7fa); display: flex; align-items: center; justify-content: center; font-size: .7rem; font-weight: 700; color: var(--primary); flex-shrink: 0; }
    .flight-route { display: flex; align-items: center; gap: 8px; }
    .route-time { font-size: 1.4rem; font-weight: 700; line-height: 1; }
    .route-code { font-size: .75rem; color: var(--text-muted); }
    .route-line { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .route-line-bar { width: 100%; height: 2px; background: var(--border-color, #e0e0e0); position: relative; }
    .route-line-bar::after { content: '✈'; position: absolute; top: -9px; left: 50%; transform: translateX(-50%); font-size: .9rem; color: var(--primary); }
    .route-duration { font-size: .72rem; color: var(--text-muted); }
    .route-stops { font-size: .72rem; color: var(--text-muted); }
    .flight-price-col { text-align: center; padding-right: 4px; }
    .price-amount { font-size: 1.5rem; font-weight: 800; color: var(--primary); }
    .price-label { font-size: .72rem; color: var(--text-muted); }
    .flight-card-extra { border-top: 1px solid var(--border-color, #e0e0e0); padding: 10px 20px; display: flex; gap: 16px; font-size: .78rem; color: var(--text-muted); align-items: center; flex-wrap: wrap; }
    .badge-tag { background: var(--bg-secondary, #f0f4f8); border-radius: 20px; padding: 2px 8px; font-size: .72rem; }
    .badge-tag.green { background: #dcfce7; color: #166534; }
    .badge-tag.blue { background: #dbeafe; color: #1e40af; }
    .sort-bar { display: flex; gap: 8px; margin-bottom: 16px; align-items: center; flex-wrap: wrap; }
    .sort-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border-color, #e0e0e0); background: #fff; font-size: .8rem; cursor: pointer; transition: all .15s; }
    .sort-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    .mobile-filter-btn { display: none; }
    @media(max-width:768px) { .mobile-filter-btn { display: block; } }
    .range-input { width: 100%; accent-color: var(--primary); }
    .stops-filter label { display: block; margin-bottom: 4px; }
  </style>
</head>
<body>

<!-- Header / Search Bar -->
<div class="page-header">
  <div style="max-width:1200px;margin:0 auto;padding:0 20px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px">
      <a href="index.html" style="color:#fff;font-size:1.2rem;font-weight:700;text-decoration:none">✈️ FlyMasar</a>
      <div id="navAuth" style="display:flex;gap:8px"></div>
    </div>
    <div class="search-bar-compact" id="compactSearch">
      <div style="flex:1;min-width:120px">
        <div class="form-label">من</div>
        <input type="text" class="form-control" id="sFrom" style="text-transform:uppercase">
      </div>
      <div style="flex:1;min-width:120px">
        <div class="form-label">إلى</div>
        <input type="text" class="form-control" id="sTo" style="text-transform:uppercase">
      </div>
      <div>
        <div class="form-label">ذهاب</div>
        <input type="text" class="form-control" id="sDepDate" style="min-width:110px;direction:ltr" readonly>
      </div>
      <div>
        <div class="form-label">عودة</div>
        <input type="text" class="form-control" id="sRetDate" style="min-width:110px;direction:ltr" readonly>
      </div>
      <div>
        <div class="form-label">المسافرون</div>
        <input type="number" class="form-control" id="sPax" min="1" max="9" style="width:70px">
      </div>
      <div>
        <div class="form-label">الدرجة</div>
        <select class="form-control" id="sCabin" style="min-width:100px">
          <option value="economy">اقتصادية</option>
          <option value="premium_economy">اقتصادية مميزة</option>
          <option value="business">رجال أعمال</option>
          <option value="first">أولى</option>
        </select>
      </div>
      <button class="btn btn-primary btn-sm" onclick="doSearch()" style="white-space:nowrap">🔍 بحث</button>
    </div>
    <div style="padding:10px 0;font-size:.82rem;color:rgba(255,255,255,.7)" id="searchSummary"></div>
  </div>
</div>

<div class="results-layout">
  <!-- Filters Sidebar -->
  <div class="filters-panel" id="filtersPanel">
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <h3 style="margin:0;font-size:.95rem">الفلاتر</h3>
        <button class="btn btn-ghost btn-sm" onclick="clearFilters()" style="font-size:.75rem">مسح الكل</button>
      </div>

      <!-- Price -->
      <div class="filter-section">
        <h4>السعر</h4>
        <div style="display:flex;justify-content:space-between;font-size:.78rem;color:var(--text-muted);margin-bottom:6px">
          <span id="priceMin">0</span>
          <span id="priceMax">5000</span>
        </div>
        <input type="range" class="range-input" id="priceRange" min="0" max="5000" value="5000" oninput="applyFilters()">
      </div>

      <!-- Stops -->
      <div class="filter-section">
        <h4>التوقفات</h4>
        <div class="stops-filter">
          <label class="filter-checkbox"><input type="checkbox" id="stop0" onchange="applyFilters()"> مباشر</label>
          <label class="filter-checkbox"><input type="checkbox" id="stop1" onchange="applyFilters()"> توقف واحد</label>
          <label class="filter-checkbox"><input type="checkbox" id="stop2" onchange="applyFilters()"> توقفان فأكثر</label>
        </div>
      </div>

      <!-- Departure Time -->
      <div class="filter-section">
        <h4>وقت المغادرة</h4>
        <div class="stops-filter">
          <label class="filter-checkbox"><input type="checkbox" id="t0006" onchange="applyFilters()"> 00:00 – 06:00</label>
          <label class="filter-checkbox"><input type="checkbox" id="t0612" onchange="applyFilters()"> 06:00 – 12:00</label>
          <label class="filter-checkbox"><input type="checkbox" id="t1218" onchange="applyFilters()"> 12:00 – 18:00</label>
          <label class="filter-checkbox"><input type="checkbox" id="t1824" onchange="applyFilters()"> 18:00 – 00:00</label>
        </div>
      </div>

      <!-- Airlines -->
      <div class="filter-section">
        <h4>شركة الطيران</h4>
        <div id="airlineFilters"></div>
      </div>

      <!-- Baggage -->
      <div class="filter-section">
        <h4>الأمتعة</h4>
        <label class="filter-checkbox"><input type="checkbox" id="baggageIncl" onchange="applyFilters()"> يشمل أمتعة مسجلة</label>
      </div>
    </div>
  </div>

  <!-- Results -->
  <div>
    <!-- Mobile filter button -->
    <button class="btn btn-ghost btn-sm mobile-filter-btn" onclick="toggleFilters()" style="margin-bottom:12px;width:100%">⚡ الفلاتر</button>

    <!-- Sort bar -->
    <div class="sort-bar">
      <span style="font-size:.8rem;color:var(--text-muted)">ترتيب حسب:</span>
      <button class="sort-btn active" id="sort-price" onclick="setSort('price')">الأرخص</button>
      <button class="sort-btn" id="sort-duration" onclick="setSort('duration')">الأسرع</button>
      <button class="sort-btn" id="sort-departure" onclick="setSort('departure')">المغادرة</button>
      <span style="margin-right:auto;font-size:.8rem;color:var(--text-muted)" id="resultsCount"></span>
    </div>

    <!-- Loading -->
    <div id="loadingState" style="text-align:center;padding:60px 20px">
      <div class="spinner" style="margin:0 auto 16px"></div>
      <p style="color:var(--text-muted)">جاري البحث عن أفضل الرحلات...</p>
    </div>

    <!-- Error -->
    <div id="errorState" style="display:none;text-align:center;padding:60px 20px">
      <div style="font-size:3rem;margin-bottom:12px">✈️</div>
      <h3>لا توجد رحلات متاحة</h3>
      <p style="color:var(--text-muted)">جرب تعديل معايير البحث</p>
    </div>

    <!-- Results list -->
    <div id="resultsList"></div>
  </div>
</div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
var allOffers = [];
var filteredOffers = [];
var currentSort = 'price';
var searchParams = {};

function initPage() {
  // Parse URL params
  var p = new URLSearchParams(window.location.search);
  searchParams = {
    origin:      p.get('from') || '',
    destination: p.get('to')   || '',
    departure:   p.get('dep')  || '',
    return:      p.get('ret')  || '',
    passengers:  parseInt(p.get('pax') || '1'),
    cabin:       p.get('cabin') || 'economy',
    trip_type:   p.get('type') || 'one_way',
  };

  document.getElementById('sFrom').value   = searchParams.origin;
  document.getElementById('sTo').value     = searchParams.destination;
  document.getElementById('sDepDate').value = searchParams.departure;
  document.getElementById('sRetDate').value = searchParams.return;
  document.getElementById('sPax').value    = searchParams.passengers;
  document.getElementById('sCabin').value  = searchParams.cabin;

  if (searchParams.departure) {
    document.getElementById('searchSummary').textContent =
      searchParams.origin + ' ← → ' + searchParams.destination + ' | ' +
      searchParams.departure + (searchParams.return ? ' – ' + searchParams.return : '') + ' | ' +
      searchParams.passengers + ' مسافر | ' + cabinLabel(searchParams.cabin);
  }

  // Nav
  if (Auth.isLoggedIn()) {
    document.getElementById('navAuth').innerHTML =
      '<a href="dashboard.html" class="btn btn-ghost btn-sm" style="color:#fff;border-color:rgba(255,255,255,.3)">حسابي</a>';
  } else {
    document.getElementById('navAuth').innerHTML =
      '<a href="login.html" class="btn btn-ghost btn-sm" style="color:#fff;border-color:rgba(255,255,255,.3)">دخول</a>';
  }

  if (searchParams.origin && searchParams.destination && searchParams.departure) {
    fetchFlights();
  } else {
    document.getElementById('loadingState').style.display = 'none';
    document.getElementById('errorState').style.display   = 'block';
  }
}

function cabinLabel(c) {
  return { economy: 'اقتصادية', premium_economy: 'اقتصادية مميزة', business: 'رجال أعمال', first: 'أولى' }[c] || c;
}

function fetchFlights() {
  document.getElementById('loadingState').style.display = 'block';
  document.getElementById('resultsList').innerHTML = '';
  document.getElementById('errorState').style.display = 'none';

  var payload = {
    origin:           searchParams.origin,
    destination:      searchParams.destination,
    departure_date:   searchParams.departure,
    return_date:      searchParams.return || null,
    adults:           searchParams.passengers,
    cabin_class:      searchParams.cabin,
  };

  Api.post('/api/flights/search', payload, Auth.isLoggedIn()).then(function(res) {
    document.getElementById('loadingState').style.display = 'none';
    var offers = res.offers || res.data || [];
    if (offers.length === 0) {
      document.getElementById('errorState').style.display = 'block';
      return;
    }
    allOffers = offers;
    buildAirlineFilters(offers);
    applyFilters();
  }).catch(function(err) {
    document.getElementById('loadingState').style.display = 'none';
    var msg = (err && err.message) || 'خدمة البحث غير متاحة حالياً';
    document.getElementById('errorState').style.display = 'block';
    document.getElementById('errorState').querySelector('p').textContent = msg;
  });
}

function buildAirlineFilters(offers) {
  var airlines = {};
  offers.forEach(function(o) {
    var name = o.airline || (o.slices && o.slices[0] && o.slices[0].segments && o.slices[0].segments[0] && o.slices[0].segments[0].operating_carrier && o.slices[0].segments[0].operating_carrier.name) || 'غير محدد';
    var code = o.airline_code || 'XX';
    airlines[code] = name;
  });
  var html = '';
  Object.keys(airlines).forEach(function(code) {
    html += '<label class="filter-checkbox"><input type="checkbox" class="airline-cb" value="' + code + '" onchange="applyFilters()"> ' + airlines[code] + '</label>';
  });
  document.getElementById('airlineFilters').innerHTML = html || '<p style="font-size:.78rem;color:var(--text-muted)">جاري التحميل...</p>';
}

function applyFilters() {
  var maxPrice     = parseInt(document.getElementById('priceRange').value);
  var stop0        = document.getElementById('stop0').checked;
  var stop1        = document.getElementById('stop1').checked;
  var stop2        = document.getElementById('stop2').checked;
  var anyStop      = !stop0 && !stop1 && !stop2;
  var t0006        = document.getElementById('t0006').checked;
  var t0612        = document.getElementById('t0612').checked;
  var t1218        = document.getElementById('t1218').checked;
  var t1824        = document.getElementById('t1824').checked;
  var anyTime      = !t0006 && !t0612 && !t1218 && !t1824;
  var baggageIncl  = document.getElementById('baggageIncl').checked;
  var selectedAirlines = [];
  document.querySelectorAll('.airline-cb:checked').forEach(function(cb) { selectedAirlines.push(cb.value); });

  document.getElementById('priceMin').textContent = '0';
  document.getElementById('priceMax').textContent = maxPrice.toLocaleString();

  filteredOffers = allOffers.filter(function(o) {
    var price = parseFloat(o.total_amount || o.price || 0);
    if (price > maxPrice) return false;

    var stops = getStops(o);
    if (!anyStop) {
      if (stops === 0 && !stop0) return false;
      if (stops === 1 && !stop1) return false;
      if (stops >= 2 && !stop2) return false;
    }

    if (!anyTime) {
      var dep = getDepHour(o);
      var inTime = (t0006 && dep < 6) || (t0612 && dep >= 6 && dep < 12) || (t1218 && dep >= 12 && dep < 18) || (t1824 && dep >= 18);
      if (!inTime) return false;
    }

    if (selectedAirlines.length > 0) {
      var code = o.airline_code || 'XX';
      if (selectedAirlines.indexOf(code) === -1) return false;
    }

    if (baggageIncl && !hasBaggage(o)) return false;

    return true;
  });

  sortOffers();
  renderResults();
}

function getStops(o) {
  if (typeof o.stops !== 'undefined') return o.stops;
  if (o.slices && o.slices[0]) return (o.slices[0].segments || []).length - 1;
  return 0;
}

function getDepHour(o) {
  var dep = o.departure_at || o.departing_at || (o.slices && o.slices[0] && o.slices[0].segments && o.slices[0].segments[0] && o.slices[0].segments[0].departing_at) || '';
  if (!dep) return 0;
  return new Date(dep).getHours();
}

function hasBaggage(o) {
  return o.baggage_included || o.checked_bags || false;
}

function setSort(s) {
  currentSort = s;
  document.querySelectorAll('.sort-btn').forEach(function(b) { b.classList.remove('active'); });
  document.getElementById('sort-' + s).classList.add('active');
  sortOffers();
  renderResults();
}

function sortOffers() {
  filteredOffers.sort(function(a, b) {
    if (currentSort === 'price') {
      return parseFloat(a.total_amount || a.price || 0) - parseFloat(b.total_amount || b.price || 0);
    }
    if (currentSort === 'duration') {
      return getDuration(a) - getDuration(b);
    }
    if (currentSort === 'departure') {
      return getDepHour(a) - getDepHour(b);
    }
    return 0;
  });
}

function getDuration(o) {
  if (o.duration_minutes) return o.duration_minutes;
  if (o.slices && o.slices[0] && o.slices[0].duration) {
    var d = o.slices[0].duration;
    var m = d.match(/PT(\d+H)?(\d+M)?/);
    if (m) return (parseInt(m[1]||'0')*60) + parseInt(m[2]||'0');
  }
  return 0;
}

function formatDuration(o) {
  var mins = getDuration(o);
  if (!mins) return '—';
  var h = Math.floor(mins / 60);
  var m = mins % 60;
  return h + 'س ' + (m ? m + 'د' : '');
}

function formatTime(dt) {
  if (!dt) return '—';
  try { return new Date(dt).toLocaleTimeString('ar', { hour: '2-digit', minute: '2-digit', hour12: false }); } catch(e) { return dt.substring(11,16); }
}

function renderResults() {
  document.getElementById('resultsCount').textContent = filteredOffers.length + ' رحلة';

  if (filteredOffers.length === 0) {
    document.getElementById('resultsList').innerHTML =
      '<div style="text-align:center;padding:40px;background:#fff;border-radius:12px"><div style="font-size:2rem;margin-bottom:8px">🔍</div><p>لا توجد رحلات تطابق الفلاتر المحددة</p></div>';
    return;
  }

  var html = '';
  filteredOffers.forEach(function(o) {
    var price    = parseFloat(o.total_amount || o.price || 0);
    var currency = o.total_currency || o.currency || 'GBP';
    var stops    = getStops(o);
    var stopsLabel = stops === 0 ? '<span class="badge-tag green">مباشر</span>' : stops === 1 ? '<span class="badge-tag">توقف واحد</span>' : '<span class="badge-tag">توقفان+</span>';
    var refund   = o.conditions && o.conditions.refund_before_departure ? '<span class="badge-tag blue">قابل للاسترداد</span>' : '';
    var baggage  = hasBaggage(o) ? '<span class="badge-tag green">أمتعة مجانية ✓</span>' : '';

    // Departure/arrival
    var depAt  = o.departure_at || (o.slices && o.slices[0] && o.slices[0].segments && o.slices[0].segments[0] && o.slices[0].segments[0].departing_at) || '';
    var arrAt  = o.arrival_at   || (o.slices && o.slices[0] && o.slices[0].segments && o.slices[0].segments[o.slices[0].segments.length-1] && o.slices[0].segments[o.slices[0].segments.length-1].arriving_at) || '';
    var depCode = o.origin || (o.slices && o.slices[0] && o.slices[0].origin && (o.slices[0].origin.iata_code||o.slices[0].origin)) || '—';
    var arrCode = o.destination || (o.slices && o.slices[0] && o.slices[0].destination && (o.slices[0].destination.iata_code||o.slices[0].destination)) || '—';

    var airline   = o.airline || (o.slices && o.slices[0] && o.slices[0].segments && o.slices[0].segments[0] && o.slices[0].segments[0].operating_carrier && o.slices[0].segments[0].operating_carrier.name) || 'غير محدد';
    var airlineCode = o.airline_code || '✈';

    // WhatsApp share
    var shareText = 'رحلة ' + depCode + ' – ' + arrCode + ' | ' + formatTime(depAt) + ' – ' + formatTime(arrAt) + ' | ' + currency + ' ' + price.toFixed(2) + ' | ' + stopsLabel.replace(/<[^>]+>/g,'');
    var waLink = 'https://api.whatsapp.com/send?text=' + encodeURIComponent(shareText + '\nاحجز الآن: ' + window.location.href);

    html += '<div class="flight-card">' +
      '<div class="flight-card-main">' +
        '<div class="airline-info">' +
          '<div class="airline-logo">' + airlineCode.substring(0,2) + '</div>' +
          '<div><div style="font-size:.85rem;font-weight:600">' + airline + '</div><div style="font-size:.72rem;color:var(--text-muted)">' + (o.offer_id || '#' + Math.random().toString(36).substring(2,6).toUpperCase()) + '</div></div>' +
        '</div>' +
        '<div class="flight-route">' +
          '<div style="text-align:center">' +
            '<div class="route-time">' + formatTime(depAt) + '</div>' +
            '<div class="route-code">' + depCode + '</div>' +
          '</div>' +
          '<div class="route-line">' +
            '<div class="route-duration">' + formatDuration(o) + '</div>' +
            '<div class="route-line-bar"></div>' +
            '<div class="route-stops">' + (stops === 0 ? 'مباشر' : stops + ' توقف') + '</div>' +
          '</div>' +
          '<div style="text-align:center">' +
            '<div class="route-time">' + formatTime(arrAt) + '</div>' +
            '<div class="route-code">' + arrCode + '</div>' +
          '</div>' +
        '</div>' +
        '<div class="flight-price-col">' +
          '<div class="price-amount">' + currency + ' ' + price.toFixed(0) + '</div>' +
          '<div class="price-label">لكل مسافر</div>' +
          '<button class="btn btn-primary btn-sm" style="margin-top:8px;width:100%" onclick="selectFlight(\'' + (o.id || o.offer_id || '') + '\')">اختيار</button>' +
        '</div>' +
      '</div>' +
      '<div class="flight-card-extra">' +
        stopsLabel + refund + baggage +
        '<a href="' + waLink + '" target="_blank" rel="noopener" style="margin-right:auto;color:var(--text-muted);text-decoration:none;font-size:.78rem">📲 واتساب</a>' +
      '</div>' +
    '</div>';
  });

  document.getElementById('resultsList').innerHTML = html;
}

function selectFlight(offerId) {
  var p = new URLSearchParams(searchParams);
  p.set('offer_id', offerId);
  window.location.href = 'booking.html?' + p.toString();
}

function doSearch() {
  var from    = document.getElementById('sFrom').value.trim().toUpperCase();
  var to      = document.getElementById('sTo').value.trim().toUpperCase();
  var dep     = document.getElementById('sDepDate').value;
  var ret     = document.getElementById('sRetDate').value;
  var pax     = document.getElementById('sPax').value;
  var cabin   = document.getElementById('sCabin').value;
  if (!from || !to || !dep) { alert('الرجاء تعبئة جميع الحقول المطلوبة'); return; }
  var params = new URLSearchParams({ from: from, to: to, dep: dep, ret: ret, pax: pax, cabin: cabin, type: ret ? 'round_trip' : 'one_way' });
  window.location.href = 'flights.html?' + params.toString();
}

function clearFilters() {
  document.getElementById('priceRange').value = 5000;
  ['stop0','stop1','stop2','t0006','t0612','t1218','t1824','baggageIncl'].forEach(function(id) {
    document.getElementById(id).checked = false;
  });
  document.querySelectorAll('.airline-cb').forEach(function(cb) { cb.checked = false; });
  applyFilters();
}

function toggleFilters() {
  document.getElementById('filtersPanel').classList.toggle('open');
}

initPage();
</script>
</body>
</html>
