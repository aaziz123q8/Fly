<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>اتصل بنا — فلاي مسار</title>
  <link rel="stylesheet" href="css/app.css">
  <style>
    .page-hero { background:linear-gradient(120deg,#7C3AED,#9333EA 55%,#C026D3); padding:60px 0; text-align:center; color:#fff; }
    .page-hero h1 { font-size:2.2rem; font-weight:800; margin:0 0 12px; }
    .page-hero p { color:rgba(255,255,255,0.8); }
    .contact-section { padding:60px 0; background:var(--bg); }
    .contact-grid { display:grid; grid-template-columns:1fr 2fr; gap:40px; }
    @media(max-width:768px) { .contact-grid { grid-template-columns:1fr; } }
    .contact-info { display:flex; flex-direction:column; gap:20px; }
    .info-card { background:#fff; border-radius:16px; padding:24px; box-shadow:var(--shadow); display:flex; gap:16px; align-items:flex-start; }
    .info-icon { font-size:1.8rem; flex-shrink:0; }
    .info-card h4 { margin:0 0 6px; color:var(--primary); }
    .info-card p { margin:0; color:var(--text-muted); font-size:0.9rem; }
    .contact-form { background:#fff; border-radius:20px; padding:32px; box-shadow:var(--shadow); }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    @media(max-width:600px) { .form-row { grid-template-columns:1fr; } }
  </style>
</head>
<body>
<!-- Unified header/drawer injected by js/site-chrome.js -->

<section class="page-hero">
  <div class="container">
    <h1>اتصل بنا</h1>
    <p>فريقنا دائماً هنا لمساعدتك — تواصل معنا في أي وقت</p>
  </div>
</section>

<section class="contact-section">
  <div class="container">
    <div class="contact-grid">
      <div class="contact-info">
        <div class="info-card">
          <div class="info-icon">📧</div>
          <div>
            <h4>البريد الإلكتروني</h4>
            <p>support@flymasar.com</p>
          </div>
        </div>
        <div class="info-card">
          <div class="info-icon">💬</div>
          <div>
            <h4>واتساب</h4>
            <p>+44 20 0000 0000</p>
          </div>
        </div>
        <div class="info-card">
          <div class="info-icon">🕐</div>
          <div>
            <h4>ساعات العمل</h4>
            <p>٢٤ ساعة — ٧ أيام في الأسبوع</p>
          </div>
        </div>
      </div>

      <div class="contact-form">
        <h2 style="color:var(--primary);margin:0 0 24px;font-size:1.4rem">أرسل رسالة</h2>
        <form id="contactForm" onsubmit="sendMsg(event)">
          <div class="form-row">
            <div class="form-group">
              <label class="form-label">الاسم الكامل</label>
              <input type="text" class="form-control" id="cName" required placeholder="اسمك">
            </div>
            <div class="form-group">
              <label class="form-label">البريد الإلكتروني</label>
              <input type="email" class="form-control" id="cEmail" required placeholder="email@example.com">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">الموضوع</label>
            <select class="form-control" id="cSubject">
              <option value="booking">استفسار عن حجز</option>
              <option value="payment">مشكلة في الدفع</option>
              <option value="cancel">إلغاء أو تعديل</option>
              <option value="other">أخرى</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">الرسالة</label>
            <textarea class="form-control" id="cMsg" rows="5" required placeholder="اكتب رسالتك هنا..."></textarea>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;padding:14px;font-size:1rem" id="cBtn">إرسال الرسالة</button>
        </form>
      </div>
    </div>
  </div>
</section>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script>
async function sendMsg(e) {
  e.preventDefault();
  const btn = document.getElementById('cBtn');
  btn.disabled = true; btn.textContent = 'جاري الإرسال...';
  try {
    await Api.post('/api/contact', {
      name: document.getElementById('cName').value,
      email: document.getElementById('cEmail').value,
      subject: document.getElementById('cSubject').value,
      message: document.getElementById('cMsg').value,
    });
    document.getElementById('contactForm').innerHTML = '<div style="text-align:center;padding:40px"><div style="font-size:3rem;margin-bottom:16px">✅</div><h3 style="color:var(--primary)">تم إرسال رسالتك بنجاح!</h3><p style="color:var(--text-muted)">سنرد عليك خلال ٢٤ ساعة</p></div>';
  } catch(err) {
    btn.disabled = false; btn.textContent = 'إرسال الرسالة';
    alert(err.message || 'حدث خطأ، يرجى المحاولة مجدداً');
  }
}
</script>
<script src="js/currency.js?v=2026070106"></script>
<script src="js/i18n.js?v=2026070106"></script>
<script src="js/site-chrome.js?v=2026070110"></script>
</body>
</html>
