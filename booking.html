<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إتمام الحجز — فلاي مسار</title>
  <link rel="stylesheet" href="css/app.css">
  <style>
    .booking-page { background:var(--bg); min-height:100vh; padding:32px 0 80px; }
    .booking-grid { display:grid; grid-template-columns:1fr 380px; gap:24px; }
    @media(max-width:900px) { .booking-grid { grid-template-columns:1fr; } }
    .booking-card { background:#fff; border-radius:16px; box-shadow:var(--shadow); padding:28px; margin-bottom:20px; }
    .booking-card h2 { font-size:1.1rem; font-weight:700; color:var(--primary); margin:0 0 20px; display:flex; align-items:center; gap:8px; }
    .section-num { width:28px; height:28px; background:var(--primary); color:#fff; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:0.85rem; font-weight:700; flex-shrink:0; }
    .pax-tabs { display:flex; gap:8px; margin-bottom:20px; flex-wrap:wrap; }
    .pax-tab { padding:6px 16px; border-radius:50px; border:2px solid #e5e7eb; background:none; cursor:pointer; font-size:0.85rem; font-weight:600; color:var(--text-muted); transition:all .2s; font-family:inherit; }
    .pax-tab.active { background:var(--primary); color:#fff; border-color:var(--primary); }
    .pax-form { display:none; }
    .pax-form.active { display:block; }
    .form-row2 { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    .form-row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:16px; }
    @media(max-width:600px) { .form-row2,.form-row3 { grid-template-columns:1fr; } }
    .price-summary { position:sticky; top:20px; }
    .price-row { display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid #f0f2f5; font-size:0.92rem; }
    .price-row:last-child { border-bottom:none; }
    .price-total { display:flex; justify-content:space-between; padding:16px 0 0; font-size:1.1rem; font-weight:800; color:var(--primary); border-top:2px solid var(--primary); margin-top:8px; }
    .coupon-row { display:flex; gap:8px; margin-top:12px; }
    .coupon-row input { flex:1; }
    .saved-travelers { margin-bottom:16px; }
    .saved-traveler-item { display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border:2px solid #e5e7eb; border-radius:12px; margin-bottom:8px; cursor:pointer; transition:all .2s; }
    .saved-traveler-item:hover, .saved-traveler-item.selected { border-color:var(--primary); background:#f0f5ff; }
    .bottom-nav { display:none; position:fixed; bottom:0; left:0; right:0; background:#fff; border-top:1px solid #e5e7eb; z-index:1000; padding:8px 0 env(safe-area-inset-bottom,8px); justify-content:space-around; }
    @media(max-width:768px) { .bottom-nav { display:flex; } body { padding-bottom:70px; } }
    .bnav-item { display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 16px; text-decoration:none; color:var(--text-muted); font-size:0.7rem; }
    .bnav-icon { font-size:1.4rem; }
  </style>
</head>
<body>
<nav class="navbar">
  <div class="container" style="display:flex;align-items:center;justify-content:space-between">
    <a href="index.html" class="navbar-brand">✈️ <span style="color:var(--secondary)">فلاي</span> مسار</a>
    <div style="display:flex;gap:8px">
      <a href="dashboard.html" class="btn btn-ghost btn-sm">حجوزاتي</a>
      <button onclick="Auth.logout()" class="btn btn-outline btn-sm">خروج</button>
    </div>
  </div>
</nav>

<!-- Steps indicator -->
<div style="background:#fff;border-bottom:1px solid #e5e7eb;padding:16px 0">
  <div class="container">
    <div style="display:flex;align-items:center;gap:6px;justify-content:center;flex-wrap:wrap">
      <div style="display:flex;align-items:center;gap:5px">
        <div style="width:28px;height:28px;background:var(--primary);color:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.8rem;font-weight:700">١</div>
        <span style="font-size:0.82rem;font-weight:600;color:var(--primary)">المسافرون</span>
      </div>
      <div style="width:28px;height:2px;background:#e5e7eb"></div>
      <div style="display:flex;align-items:center;gap:5px">
        <div style="width:28px;height:28px;background:#e5e7eb;color:#9ca3af;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.8rem;font-weight:700">٢</div>
        <span style="font-size:0.82rem;color:var(--text-muted)">الخدمات</span>
      </div>
      <div style="width:28px;height:2px;background:#e5e7eb"></div>
      <div style="display:flex;align-items:center;gap:5px">
        <div style="width:28px;height:28px;background:#e5e7eb;color:#9ca3af;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.8rem;font-weight:700">٣</div>
        <span style="font-size:0.82rem;color:var(--text-muted)">الدفع</span>
      </div>
      <div style="width:28px;height:2px;background:#e5e7eb"></div>
      <div style="display:flex;align-items:center;gap:5px">
        <div style="width:28px;height:28px;background:#e5e7eb;color:#9ca3af;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.8rem;font-weight:700">٤</div>
        <span style="font-size:0.82rem;color:var(--text-muted)">التأكيد</span>
      </div>
    </div>
  </div>
</div>

<div class="booking-page">
  <div class="container">
    <div class="booking-grid">

      <!-- Left: Passenger Forms -->
      <div>
        <!-- Flight Info (loaded dynamically) -->
        <div class="booking-card" id="flightInfoCard">
          <h2><span class="section-num">✈</span> تفاصيل الرحلة</h2>
          <div id="flightInfoContent" style="color:var(--text-muted);text-align:center;padding:20px">
            <div class="spinner"></div>
          </div>
        </div>

        <!-- Passenger Forms -->
        <div class="booking-card">
          <h2><span class="section-num">١</span> بيانات المسافرين</h2>

          <!-- Passenger tabs -->
          <div class="pax-tabs" id="paxTabs"></div>

          <!-- Saved travelers -->
          <div class="saved-travelers" id="savedTravelersSection" style="display:none">
            <div style="font-size:0.85rem;color:var(--text-muted);margin-bottom:8px;font-weight:600">المسافرون المحفوظون:</div>
            <div id="savedTravelersList"></div>
          </div>

          <!-- Forms container -->
          <div id="paxForms"></div>
        </div>

        <!-- Contact Info -->
        <div class="booking-card">
          <h2><span class="section-num">٢</span> معلومات التواصل</h2>
          <div class="form-row2">
            <div class="form-group">
              <label class="form-label">البريد الإلكتروني</label>
              <input type="email" class="form-control" id="contactEmail" placeholder="email@example.com" required>
            </div>
            <div class="form-group">
              <label class="form-label">رقم الهاتف</label>
              <input type="tel" class="form-control" id="contactPhone" placeholder="+965 XXXX XXXX" required>
            </div>
          </div>
          <div class="form-group">
            <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
              <input type="checkbox" id="agreeTerms" required>
              <span style="font-size:0.9rem">أوافق على <a href="terms.html" target="_blank" style="color:var(--primary)">الشروط والأحكام</a> و<a href="privacy.html" target="_blank" style="color:var(--primary)">سياسة الخصوصية</a></span>
            </label>
          </div>
          <button class="btn btn-primary btn-lg btn-block" onclick="submitBooking()" id="bookBtn" style="margin-top:8px">
            <span id="bookBtnTxt">المتابعة للدفع ←</span>
            <div class="spinner spinner-sm hidden" id="bookSpinner" style="border-top-color:white"></div>
          </button>
        </div>
      </div>

      <!-- Right: Price Summary -->
      <div class="price-summary">
        <div class="booking-card">
          <h2>ملخص السعر</h2>
          <div id="priceSummary">
            <div class="price-row"><span>سعر الرحلة</span><span id="priceBase">—</span></div>
            <div class="price-row"><span>الضرائب والرسوم</span><span id="priceTax">—</span></div>
            <div class="price-row" id="discountRow" style="display:none;color:#16a34a"><span>الخصم</span><span id="priceDiscount">—</span></div>
            <div class="price-total"><span>الإجمالي</span><span id="priceTotal">—</span></div>
          </div>
          <div class="coupon-row">
            <input type="text" class="form-control" id="couponInput" placeholder="كود الخصم">
            <button class="btn btn-outline btn-sm" onclick="applyCoupon()">تطبيق</button>
          </div>
          <div id="couponMsg" style="font-size:0.82rem;margin-top:6px"></div>
        </div>

        <div class="booking-card" style="background:#f0f5ff;border:2px solid #c5d5e8">
          <div style="display:flex;gap:12px;align-items:flex-start">
            <span style="font-size:1.5rem">🔒</span>
            <div>
              <div style="font-weight:700;color:var(--primary);margin-bottom:4px">حجز آمن ومضمون</div>
              <div style="font-size:0.82rem;color:var(--text-muted)">بياناتك محمية بتشفير SSL. لا نخزن بيانات بطاقتك.</div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<nav class="bottom-nav">
  <a href="index.html" class="bnav-item"><span class="bnav-icon">🏠</span><span>الرئيسية</span></a>
  <a href="index.html" class="bnav-item"><span class="bnav-icon">✈️</span><span>رحلات</span></a>
  <a href="hotels.html" class="bnav-item"><span class="bnav-icon">🏨</span><span>فنادق</span></a>
  <a href="dashboard.html" class="bnav-item"><span class="bnav-icon">👤</span><span>حسابي</span></a>
</nav>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/currency.js"></script>
<script>
  if (!Auth.isLoggedIn()) window.location.href = 'login.html?redirect=booking.html' + window.location.search;

  const params = new URLSearchParams(window.location.search);
  const flightId = params.get('offer_id') || params.get('flight') || localStorage.getItem('booking_flight_id');
  let flightData = null;
  let sessionKey = null;
  let savedTravelers = [];
  let priceGBP = 0;
  let taxGBP = 0;
  let discountGBP = 0;

  // Passenger counts from search
  const paxCounts = {
    adult: parseInt(localStorage.getItem('bk_adults') || '1'),
    child: parseInt(localStorage.getItem('bk_children') || '0'),
    infant: parseInt(localStorage.getItem('bk_infants') || '0'),
  };

  const paxTypes = [];
  for (let i=0;i<paxCounts.adult;i++) paxTypes.push({type:'adult',label:'بالغ '+(i+1)});
  for (let i=0;i<paxCounts.child;i++) paxTypes.push({type:'child',label:'طفل '+(i+1)});
  for (let i=0;i<paxCounts.infant;i++) paxTypes.push({type:'infant',label:'رضيع '+(i+1)});

  let activePax = 0;

  function buildTabs() {
    const tabs = document.getElementById('paxTabs');
    const forms = document.getElementById('paxForms');
    tabs.innerHTML = paxTypes.map((p,i)=>`<button class="pax-tab ${i===0?'active':''}" onclick="switchPax(${i},this)">${p.label}</button>`).join('');
    // Values are ISO 3166-1 alpha-3 codes — required by Duffel API
    const nationalities = [
      ['','اختر الجنسية'],
      ['DZA','جزائري'],['BHR','بحريني'],['EGY','مصري'],['ARE','إماراتي'],
      ['JOR','أردني'],['KWT','كويتي'],['LBN','لبناني'],['LBY','ليبي'],
      ['MRT','موريتاني'],['MAR','مغربي'],['OMN','عماني'],['PSE','فلسطيني'],
      ['QAT','قطري'],['SAU','سعودي'],['SDN','سوداني'],['SYR','سوري'],
      ['TUN','تونسي'],['YEM','يمني'],['USA','أمريكي'],['GBR','بريطاني'],
      ['FRA','فرنسي'],['DEU','ألماني'],['IND','هندي'],['PAK','باكستاني'],
      ['PHL','فلبيني'],['TUR','تركي'],['IRN','إيراني'],['IDN','إندونيسي'],
      ['MYS','ماليزي'],['BGD','بنغلاديشي'],['ETH','إثيوبي'],['KEN','كيني'],
      ['NGA','نيجيري'],['ZAF','جنوب أفريقي'],['CAN','كندي'],['AUS','أسترالي'],
      ['CHN','صيني'],['JPN','ياباني'],['KOR','كوري'],['RUS','روسي'],
      ['ESP','إسباني'],['ITA','إيطالي'],['NLD','هولندي'],['SWE','سويدي'],
      ['OTH','أخرى'],
    ];
    const natOptions = nationalities.map(([v,l])=>`<option value="${v}">${l}</option>`).join('');

    const thisYear = new Date().getFullYear();
    const months = ['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];

    function dobFields(i, type) {
      const now = thisYear;
      let minYear, maxYear, hint;
      if (type === 'infant') {
        // Must be under 2 on date of travel
        minYear = now - 2; maxYear = now;
        hint = 'أقل من سنتين في تاريخ السفر';
      } else if (type === 'child') {
        // Must be 2–11 on date of travel
        minYear = now - 12; maxYear = now - 2;
        hint = 'من ٢ إلى ١١ سنة في تاريخ السفر';
      } else {
        // Adult: 12+
        minYear = now - 100; maxYear = now - 12;
        hint = '١٢ سنة فأكثر';
      }
      const dayOpts = ['<option value="">يوم</option>',...Array.from({length:31},(_,k)=>`<option value="${String(k+1).padStart(2,'0')}">${k+1}</option>`)].join('');
      const monOpts = ['<option value="">شهر</option>',...months.map((m,k)=>`<option value="${String(k+1).padStart(2,'0')}">${m}</option>`)].join('');
      let yearOpts = '<option value="">سنة</option>';
      for (let y=maxYear; y>=minYear; y--) yearOpts += `<option value="${y}">${y}</option>`;
      return `<div class="form-group" style="grid-column:1/-1">
        <label class="form-label">تاريخ الميلاد <span style="color:red">*</span> <small style="color:var(--text-muted)">(${hint})</small></label>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
          <select class="form-control" id="p${i}_dob_d" onchange="updateDob(${i})" required><option value="">يوم</option>${dayOpts}</select>
          <select class="form-control" id="p${i}_dob_m" onchange="updateDob(${i})" required>${monOpts}</select>
          <select class="form-control" id="p${i}_dob_y" onchange="updateDob(${i})" required>${yearOpts}</select>
        </div>
        <input type="hidden" id="p${i}_dob">
      </div>`;
    }

    forms.innerHTML = paxTypes.map((p,i)=>`
      <div class="pax-form ${i===0?'active':''}" id="paxForm${i}">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <div style="font-size:0.85rem;color:var(--text-muted);font-weight:600">${p.label} — ${p.type==='adult'?'بالغ (١٢+ سنة)':p.type==='child'?'طفل (٢–١١ سنة)':'رضيع (أقل من سنتين)'}</div>
          <button type="button" class="btn btn-ghost btn-sm" onclick="loadSavedTraveler(${i})" style="font-size:0.8rem">📋 اختر من المحفوظين</button>
        </div>
        <div class="form-row3">
          <div class="form-group">
            <label class="form-label">الاسم الأول <span style="color:red">*</span></label>
            <input type="text" class="form-control" id="p${i}_first" placeholder="بالإنجليزي (كما في جواز السفر)" required autocomplete="off">
          </div>
          <div class="form-group">
            <label class="form-label">الاسم الأوسط</label>
            <input type="text" class="form-control" id="p${i}_middle" placeholder="اختياري">
          </div>
          <div class="form-group">
            <label class="form-label">الاسم الأخير <span style="color:red">*</span></label>
            <input type="text" class="form-control" id="p${i}_last" placeholder="بالإنجليزي (كما في جواز السفر)" required autocomplete="off">
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px">
          <div class="form-group">
            <label class="form-label">الجنس <span style="color:red">*</span></label>
            <select class="form-control" id="p${i}_gender" required>
              <option value="">اختر الجنس</option>
              <option value="male">ذكر</option>
              <option value="female">أنثى</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">الجنسية <span style="color:red">*</span></label>
            <select class="form-control" id="p${i}_nationality" required>${natOptions}</select>
          </div>
        </div>
        <div style="display:grid;grid-template-columns:1fr;gap:16px;margin-bottom:16px">
          ${dobFields(i, p.type)}
        </div>
        <div style="border-top:1px solid #f0f2f5;margin:16px 0;padding-top:16px">
          <div style="font-size:0.85rem;font-weight:600;color:var(--text-muted);margin-bottom:12px">وثيقة السفر</div>
          <div class="form-row2" style="margin-bottom:12px">
            <div class="form-group">
              <label class="form-label">نوع الوثيقة <span style="color:red">*</span></label>
              <select class="form-control" id="p${i}_doc_type" required>
                <option value="passport">جواز سفر</option>
                <option value="id_card">بطاقة مدنية</option>
                <option value="national_id">هوية وطنية</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">رقم الوثيقة <span style="color:red">*</span></label>
              <input type="text" class="form-control" id="p${i}_doc_num" placeholder="رقم الوثيقة" required autocomplete="off">
            </div>
          </div>
          <div class="form-group" style="margin-bottom:12px">
            <label class="form-label">تاريخ الإصدار <small style="color:var(--text-muted)">(اختياري)</small></label>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
              ${(()=>{ const dy=['<option value="">يوم</option>',...Array.from({length:31},(_,k)=>`<option value="${String(k+1).padStart(2,'0')}">${k+1}</option>`)].join(''); const dm=['<option value="">شهر</option>','يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'].map((m,k)=>k===0?m:`<option value="${String(k).padStart(2,'0')}">${m}</option>`).join(''); let dyrs='<option value="">سنة</option>'; for(let y=thisYear;y>=thisYear-30;y--) dyrs+=`<option value="${y}">${y}</option>`; return `<select class="form-control" id="p${i}_issue_d" onchange="updateDocDate(${i},'issue')">${dy}</select><select class="form-control" id="p${i}_issue_m" onchange="updateDocDate(${i},'issue')">${dm}</select><select class="form-control" id="p${i}_issue_y" onchange="updateDocDate(${i},'issue')">${dyrs}</select>`; })()}
            </div>
            <input type="hidden" id="p${i}_doc_issue">
          </div>
          <div class="form-group">
            <label class="form-label">تاريخ الانتهاء <span style="color:red">*</span> <small style="color:var(--text-muted)">(يجب أن يكون سارياً بعد تاريخ السفر)</small></label>
            <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px">
              ${(()=>{ const dy=['<option value="">يوم</option>',...Array.from({length:31},(_,k)=>`<option value="${String(k+1).padStart(2,'0')}">${k+1}</option>`)].join(''); const dm=['<option value="">شهر</option>','يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'].map((m,k)=>k===0?m:`<option value="${String(k).padStart(2,'0')}">${m}</option>`).join(''); let dyrs='<option value="">سنة</option>'; for(let y=thisYear;y<=thisYear+15;y++) dyrs+=`<option value="${y}">${y}</option>`; return `<select class="form-control" id="p${i}_exp_d" onchange="updateDocDate(${i},'exp')" required>${dy}</select><select class="form-control" id="p${i}_exp_m" onchange="updateDocDate(${i},'exp')" required>${dm}</select><select class="form-control" id="p${i}_exp_y" onchange="updateDocDate(${i},'exp')" required>${dyrs}</select>`; })()}
            </div>
            <input type="hidden" id="p${i}_doc_exp">
            <div id="p${i}_expError" style="color:var(--error,#ef4444);font-size:0.78rem;display:none;margin-top:4px"></div>
          </div>
        </div>
        <div id="p${i}_ageError" style="color:var(--error,#ef4444);font-size:0.82rem;display:none;padding:6px 0"></div>
      </div>`).join('');
  }

  function switchPax(idx, btn) {
    activePax = idx;
    document.querySelectorAll('.pax-tab').forEach((t,i)=>t.classList.toggle('active',i===idx));
    document.querySelectorAll('.pax-form').forEach((f,i)=>f.classList.toggle('active',i===idx));
  }

  function updateDocDate(i, field) {
    const prefix = field === 'issue' ? `p${i}_issue` : `p${i}_exp`;
    const hiddenId = field === 'issue' ? `p${i}_doc_issue` : `p${i}_doc_exp`;
    const d = document.getElementById(`${prefix}_d`)?.value;
    const m = document.getElementById(`${prefix}_m`)?.value;
    const y = document.getElementById(`${prefix}_y`)?.value;
    const hidden = document.getElementById(hiddenId);
    if (!hidden) return;
    if (d && m && y) {
      hidden.value = `${y}-${m}-${d}`;
      if (field === 'exp') validateDocExpiry(i);
    } else {
      hidden.value = '';
    }
  }

  function validateDocExpiry(i) {
    const expVal = document.getElementById(`p${i}_doc_exp`)?.value;
    const errEl  = document.getElementById(`p${i}_expError`);
    if (!expVal || !errEl) return true;
    const travelDate = flightData?.slices?.[0]?.segments?.[0]?.departing_at
      ? new Date(flightData.slices[0].segments[0].departing_at)
      : new Date(Date.now() + 86400000);
    const expDate = new Date(expVal);
    // Must be valid at least 6 months after travel date (international standard)
    const minExpiry = new Date(travelDate);
    minExpiry.setMonth(minExpiry.getMonth() + 6);
    if (expDate < minExpiry) {
      errEl.textContent = `⚠️ يجب أن يكون الجواز سارياً لمدة 6 أشهر على الأقل بعد تاريخ السفر (${minExpiry.toISOString().substring(0,10)})`;
      errEl.style.display = 'block';
      return false;
    }
    errEl.style.display = 'none';
    return true;
  }

  function updateDob(i) {
    const d = document.getElementById(`p${i}_dob_d`)?.value;
    const m = document.getElementById(`p${i}_dob_m`)?.value;
    const y = document.getElementById(`p${i}_dob_y`)?.value;
    const hidden = document.getElementById(`p${i}_dob`);
    if (d && m && y) {
      hidden.value = `${y}-${m}-${d}`;
      validatePaxAge(i);
    } else {
      hidden.value = '';
    }
  }

  function validatePaxAge(i) {
    const p = paxTypes[i];
    const dob = document.getElementById(`p${i}_dob`)?.value;
    const errEl = document.getElementById(`p${i}_ageError`);
    if (!dob || !errEl) return true;

    // Use travel date from flight data or fallback to today+1
    const travelDate = flightData?.slices?.[0]?.segments?.[0]?.departing_at
      ? new Date(flightData.slices[0].segments[0].departing_at)
      : new Date(Date.now() + 86400000);

    const dobDate = new Date(dob);
    const ageMs = travelDate - dobDate;
    const ageYears = ageMs / (365.25 * 24 * 3600 * 1000);

    let error = '';
    if (p.type === 'adult' && ageYears < 12) {
      error = `⚠️ يجب أن يكون عمر البالغ 12 سنة أو أكثر في تاريخ السفر (العمر المحسوب: ${Math.floor(ageYears)} سنة)`;
    } else if (p.type === 'child' && (ageYears < 2 || ageYears >= 12)) {
      error = `⚠️ يجب أن يكون عمر الطفل بين سنتين و١١ سنة في تاريخ السفر (العمر المحسوب: ${Math.floor(ageYears)} سنة)`;
    } else if (p.type === 'infant' && ageYears >= 2) {
      error = `⚠️ يجب أن يكون عمر الرضيع أقل من سنتين في تاريخ السفر (العمر المحسوب: ${Math.floor(ageYears)} سنة)`;
    }

    errEl.textContent = error;
    errEl.style.display = error ? 'block' : 'none';
    return !error;
  }

  function checkDuplicateNames(passengers) {
    const seen = new Set();
    for (let i = 0; i < passengers.length; i++) {
      const key = (passengers[i].first_name + '|' + passengers[i].last_name).toUpperCase().trim();
      if (!key || key === '|') continue;
      if (seen.has(key)) {
        return paxTypes[i].label + ': الاسم مكرر في نفس الحجز — يجب أن يكون اسم كل مسافر فريداً';
      }
      seen.add(key);
    }
    return null;
  }

  async function loadFlightInfo() {
    const el = document.getElementById('flightInfoContent');
    if (!flightId) { el.innerHTML = '<p style="color:var(--error)">لم يتم تحديد رحلة</p>'; return; }
    try {
      // Start checkout session — this prices the offer and returns a session key
      const res = await Api.post('/api/flights/checkout/start', { offer_id: flightId }, true);
      sessionKey = res.session_key;
      flightData = res.offer || res;

      // Price from checkout response
      const offerObj   = res.offer || {};
      const totalAmount = parseFloat(offerObj.total_amount || res.total_amount || 0);
      const baseAmount  = parseFloat(offerObj.base_amount  || totalAmount * 0.90);
      const taxAmount   = parseFloat(offerObj.tax_amount   || totalAmount * 0.10);
      priceGBP = baseAmount;
      taxGBP   = taxAmount;

      // Build display from ALL slices (outbound + return)
      const slices = flightData.slices || [];

      function airportLabel(ap) {
        if (!ap) return '---';
        const code = ap.iata_code || ap;
        const name = ap.name || ap.city_name || '';
        return name ? `${code} — ${name}` : code;
      }
      function fmtDt(dt) {
        if (!dt) return '';
        try {
          return new Date(dt).toLocaleString('ar-KW', {day:'numeric',month:'short',hour:'2-digit',minute:'2-digit',hour12:false});
        } catch(e) { return dt.substring(0,16).replace('T',' '); }
      }

      let sliceHtml = '';
      slices.forEach((sl, idx) => {
        const segs   = sl.segments || [];
        const first  = segs[0] || {};
        const last   = segs[segs.length-1] || {};
        const orig   = airportLabel(first.departing_airport  || sl.origin);
        const dest   = airportLabel(last.arriving_airport    || sl.destination);
        const dep    = fmtDt(first.departing_at);
        const arr    = fmtDt(last.arriving_at);
        const al     = first.marketing_carrier?.name || first.operating_carrier?.name || '';
        const stops  = Math.max(0, segs.length - 1);
        const label  = idx === 0 ? '✈ ذهاب' : '↩ عودة';
        const labelColor = idx === 0 ? '#1B4F8E' : '#7c3aed';
        sliceHtml += `
          <div style="border:1.5px solid #e5e7eb;border-radius:12px;padding:12px 14px;margin-bottom:10px">
            <div style="font-size:.72rem;font-weight:700;color:${labelColor};margin-bottom:6px">${label}</div>
            <div style="font-size:.95rem;font-weight:700;margin-bottom:4px">${orig} → ${dest}</div>
            <div style="font-size:.8rem;color:#6b7280">${al}${stops ? ' · ' + stops + ' توقف' : ' · مباشر'}</div>
            <div style="font-size:.8rem;color:#6b7280;margin-top:2px">${dep}${arr ? ' – ' + arr : ''}</div>
          </div>`;
      });

      el.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px">
          <div style="font-size:.85rem;color:#6b7280">${slices.length > 1 ? 'ذهاب وعودة' : 'ذهاب فقط'}</div>
          <div style="font-size:1.4rem;font-weight:800;color:var(--primary)">${formatPrice(totalAmount)}</div>
        </div>
        ${sliceHtml}`;
      document.getElementById('priceBase').textContent = formatPrice(priceGBP);
      document.getElementById('priceTax').textContent  = formatPrice(taxGBP);
      updateTotal();
    } catch(err) {
      if (err.status === 401) {
        Auth.clear();
        window.location.href = 'login.html?redirect=' + encodeURIComponent(window.location.href);
        return;
      }
      el.innerHTML = '<p style="color:var(--error);text-align:center">' + (err.message || 'تعذر تحميل تفاصيل الرحلة') + '</p>';
      document.getElementById('priceBase').textContent = '—';
      document.getElementById('priceTax').textContent  = '—';
      document.getElementById('priceTotal').textContent = '—';
    }
  }

  async function loadSavedTravelers() {
    try {
      const res = await Api.get('/api/travelers', true);
      savedTravelers = res.data || res.travelers || (Array.isArray(res) ? res : []);
    } catch { savedTravelers = []; }
  }

  function loadSavedTraveler(idx) {
    if (!savedTravelers.length) { alert('لا يوجد مسافرون محفوظون. يمكنك إضافتهم من صفحة حجوزاتي.'); return; }
    const popup = document.createElement('div');
    popup.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:3000;display:flex;align-items:center;justify-content:center;padding:20px';
    popup.innerHTML = `<div style="background:#fff;border-radius:16px;padding:24px;width:100%;max-width:460px;max-height:80vh;overflow-y:auto">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
        <h3 style="margin:0;color:var(--primary)">اختر مسافراً</h3>
        <button onclick="this.closest('div[style]').remove()" style="background:none;border:none;font-size:1.5rem;cursor:pointer">✕</button>
      </div>
      ${savedTravelers.map((t,ti)=>`
        <div style="padding:12px;border:2px solid #e5e7eb;border-radius:12px;margin-bottom:8px;cursor:pointer" onclick="fillTraveler(${idx},${ti});this.closest('div[style]').remove()">
          <div style="font-weight:600">${t.first_name||''} ${t.last_name||''}</div>
          <div style="font-size:0.82rem;color:var(--text-muted)">${t.nationality||''} · ${t.document_number||''}</div>
        </div>`).join('')}
    </div>`;
    document.body.appendChild(popup);
  }

  function fillTraveler(formIdx, travelerIdx) {
    const t = savedTravelers[travelerIdx];
    if (!t) return;
    const set = (id, val) => { const el = document.getElementById(id); if(el) el.value = val||''; };
    set(`p${formIdx}_first`, t.first_name);
    set(`p${formIdx}_middle`, t.middle_name);
    set(`p${formIdx}_last`, t.last_name);
    set(`p${formIdx}_gender`, t.gender);
    set(`p${formIdx}_nationality`, t.nationality);
    set(`p${formIdx}_doc_type`, t.document_type || 'passport');
    set(`p${formIdx}_doc_num`, t.document_number);
    set(`p${formIdx}_doc_exp`, t.document_expiry);
    set(`p${formIdx}_doc_issue`, t.document_issue);
    // Fill DOB dropdowns
    if (t.date_of_birth) {
      const parts = t.date_of_birth.split('-');
      if (parts.length === 3) {
        set(`p${formIdx}_dob_y`, parts[0]);
        set(`p${formIdx}_dob_m`, parts[1]);
        set(`p${formIdx}_dob_d`, parts[2]);
        set(`p${formIdx}_dob`, t.date_of_birth);
      }
    }
    // Fill doc expiry dropdowns
    const fillDateSelects = (isoDate, prefix, hidden) => {
      if (!isoDate) return;
      const parts = isoDate.split('-');
      if (parts.length === 3) {
        set(`${prefix}_y`, parts[0]);
        set(`${prefix}_m`, parts[1]);
        set(`${prefix}_d`, parts[2]);
        set(hidden, isoDate);
      }
    };
    fillDateSelects(t.document_expiry,  `p${formIdx}_exp`,   `p${formIdx}_doc_exp`);
    fillDateSelects(t.document_issue,   `p${formIdx}_issue`, `p${formIdx}_doc_issue`);
  }

  function updateTotal() {
    const total = priceGBP + taxGBP - discountGBP;
    document.getElementById('priceTotal').textContent = formatPrice(Math.max(0, total));
  }

  async function applyCoupon() {
    const code = document.getElementById('couponInput').value.trim();
    if (!code) return;
    const msg = document.getElementById('couponMsg');
    try {
      // Preview only — actual discount calculated server-side in createPaymentIntent
      const res = await Api.post('/api/coupons/validate', { code, amount: priceGBP + taxGBP });
      discountGBP = parseFloat(res.discount_amount || res.discount || 0);
      msg.style.color = '#16a34a';
      msg.textContent = '✅ سيُطبَّق الخصم عند الدفع — ' + formatPrice(discountGBP);
      document.getElementById('discountRow').style.display = 'flex';
      document.getElementById('priceDiscount').textContent = '−' + formatPrice(discountGBP);
      updateTotal();
    } catch(err) {
      msg.style.color = 'var(--error)';
      msg.textContent = '⚠️ ' + (err.message || 'كوبون غير صالح');
      discountGBP = 0;
      document.getElementById('discountRow').style.display = 'none';
      updateTotal();
    }
  }

  function collectPassengers() {
    return paxTypes.map((p,i)=>({
      type: p.type,
      first_name: document.getElementById(`p${i}_first`)?.value?.trim(),
      middle_name: document.getElementById(`p${i}_middle`)?.value?.trim(),
      last_name: document.getElementById(`p${i}_last`)?.value?.trim(),
      gender: document.getElementById(`p${i}_gender`)?.value,
      nationality: document.getElementById(`p${i}_nationality`)?.value?.trim(),
      date_of_birth: document.getElementById(`p${i}_dob`)?.value?.trim(),
      document_type: document.getElementById(`p${i}_doc_type`)?.value,
      document_number: document.getElementById(`p${i}_doc_num`)?.value?.trim(),
      document_expiry: document.getElementById(`p${i}_doc_exp`)?.value?.trim(),
      document_issue: document.getElementById(`p${i}_doc_issue`)?.value?.trim(),
    }));
  }

  async function submitBooking() {
    if (!document.getElementById('agreeTerms').checked) {
      alert('يرجى الموافقة على الشروط والأحكام'); return;
    }
    if (!sessionKey) {
      alert('جاري تحميل تفاصيل الرحلة، يرجى الانتظار'); return;
    }
    const passengers = collectPassengers();
    for (let i=0;i<passengers.length;i++) {
      const p = passengers[i];
      if (!p.first_name || !p.last_name || !p.gender || !p.nationality || !p.date_of_birth || !p.document_number || !p.document_expiry) {
        switchPax(i, document.querySelectorAll('.pax-tab')[i]);
        alert('يرجى إكمال بيانات ' + paxTypes[i].label); return;
      }
      if (!/^[a-zA-Z\s\-]+$/.test(p.first_name) || !/^[a-zA-Z\s\-]+$/.test(p.last_name)) {
        switchPax(i, document.querySelectorAll('.pax-tab')[i]);
        alert('يجب إدخال الاسم بالحروف الإنجليزية فقط كما في جواز السفر — ' + paxTypes[i].label); return;
      }
      if (!validatePaxAge(i)) {
        switchPax(i, document.querySelectorAll('.pax-tab')[i]);
        const errMsg = document.getElementById(`p${i}_ageError`)?.textContent;
        alert(errMsg || 'يرجى التحقق من تاريخ ميلاد ' + paxTypes[i].label); return;
      }
      if (!validateDocExpiry(i)) {
        switchPax(i, document.querySelectorAll('.pax-tab')[i]);
        const errMsg = document.getElementById(`p${i}_expError`)?.textContent;
        alert(errMsg || 'يرجى التحقق من تاريخ انتهاء وثيقة ' + paxTypes[i].label); return;
      }
    }
    const dupErr = checkDuplicateNames(passengers);
    if (dupErr) { alert('⚠️ ' + dupErr); return; }
    const btn = document.getElementById('bookBtn');
    const sp  = document.getElementById('bookSpinner');
    const tx  = document.getElementById('bookBtnTxt');
    btn.disabled=true; sp.classList.remove('hidden'); tx.classList.add('hidden');
    try {
      // Step 1: save passengers
      await Api.post('/api/flights/checkout/passengers', {
        session_key: sessionKey,
        passengers,
      }, true);

      // Step 2: redirect to services/ancillaries selection
      localStorage.removeItem('booking_flight_id');
      const coupon = document.getElementById('couponInput').value.trim();
      window.location.href = 'services.html?session=' + encodeURIComponent(sessionKey)
        + '&offer_id=' + encodeURIComponent(flightId || '')
        + (coupon ? '&coupon=' + encodeURIComponent(coupon) : '');
    } catch(err) {
      btn.disabled=false; sp.classList.add('hidden'); tx.classList.remove('hidden');
      alert('⚠️ ' + (err.message || 'حدث خطأ أثناء الحجز، يرجى المحاولة مجدداً'));
    }
  }

  // formatPrice / initCurrency are provided by currency.js — guard against load failure
  if (typeof formatPrice === 'undefined') {
    window.formatPrice = function(amount) {
      return '£ ' + parseFloat(amount||0).toFixed(2);
    };
  }
  if (typeof initCurrency === 'undefined') {
    window.initCurrency = function(){};
  }

  // Init
  initCurrency();
  const user = Auth.getUser();
  if (user) {
    document.getElementById('contactEmail').value = user.email || '';
    document.getElementById('contactPhone').value = user.phone || '';
  }
  buildTabs();
  loadFlightInfo();
  loadSavedTravelers();
</script>
</body>
</html>
