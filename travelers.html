<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المسافرون — فلاي مسار</title>
  <link rel="stylesheet" href="css/app.css">
  <style>
    /* ── Page Layout ── */
    .page-bg { background:var(--bg,#FAF8FF); min-height:100vh; padding:32px 0 100px; }

    /* ── Hero Header ── */
    .travelers-hero {
      background:linear-gradient(120deg,#7C3AED,#9333EA 55%,#C026D3);
      border-radius:20px; padding:32px 28px; margin-bottom:28px;
      color:#fff; display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap;
    }
    .travelers-hero h1 { margin:0 0 6px; font-size:1.6rem; font-weight:800; }
    .travelers-hero p  { margin:0; font-size:0.9rem; opacity:.85; }
    .hero-icon { font-size:3.5rem; opacity:.35; }

    /* ── Stats Bar ── */
    .stats-bar {
      display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:24px;
    }
    .stat-card {
      background:#fff; border-radius:14px; padding:16px 18px;
      box-shadow:0 2px 12px rgba(76,29,149,.07); text-align:center;
    }
    .stat-card .stat-num { font-size:1.8rem; font-weight:800; color:var(--primary,#7C3AED); line-height:1; }
    .stat-card .stat-lbl { font-size:0.75rem; color:var(--text-muted,#6b7280); margin-top:4px; }

    /* ── Traveler Cards ── */
    .travelers-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px; }
    .traveler-card {
      background:#fff; border-radius:18px;
      box-shadow:0 2px 16px rgba(76,29,149,.08);
      padding:0; overflow:hidden; transition:transform .2s,box-shadow .2s;
    }
    .traveler-card:hover { transform:translateY(-3px); box-shadow:0 8px 28px rgba(76,29,149,.14); }
    .traveler-card-header {
      background:linear-gradient(120deg,#7C3AED,#9333EA 55%,#C026D3);
      padding:18px 20px 14px; display:flex; align-items:center; gap:14px;
    }
    .traveler-avatar {
      width:52px; height:52px; background:rgba(255,255,255,.2);
      border:2.5px solid rgba(255,255,255,.5);
      color:#fff; border-radius:50%; display:flex; align-items:center;
      justify-content:center; font-size:1.4rem; font-weight:800; flex-shrink:0;
    }
    .traveler-header-info { flex:1; min-width:0; }
    .traveler-name { font-size:1rem; font-weight:700; color:#fff; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .traveler-type-badge { display:inline-block; background:rgba(255,255,255,.2); color:#fff; font-size:0.7rem; border-radius:20px; padding:2px 10px; margin-top:4px; }
    .traveler-card-body { padding:16px 20px; }
    .traveler-detail { display:flex; align-items:center; gap:8px; font-size:0.82rem; color:var(--text-muted,#6b7280); margin-bottom:8px; }
    .traveler-detail:last-of-type { margin-bottom:0; }
    .traveler-detail .detail-icon { width:20px; text-align:center; flex-shrink:0; }
    .traveler-detail .detail-val { font-weight:600; color:var(--text,#1a202c); }
    .traveler-card-footer { padding:12px 20px; border-top:1px solid #f0f2f5; display:flex; gap:8px; justify-content:flex-end; }

    /* ── Empty State ── */
    .empty-state {
      text-align:center; padding:60px 20px; background:#fff;
      border-radius:20px; box-shadow:0 2px 16px rgba(76,29,149,.07);
    }
    .empty-state .empty-icon { font-size:4rem; margin-bottom:16px; opacity:.6; }
    .empty-state h3 { color:var(--primary,#7C3AED); margin-bottom:8px; }
    .empty-state p  { color:var(--text-muted,#6b7280); margin-bottom:24px; font-size:0.9rem; }

    /* ── Modal ── */
    .modal-overlay { display:none; position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:1000; align-items:flex-start; justify-content:center; padding:20px; overflow-y:auto; }
    .modal-overlay.active { display:flex; }
    .modal {
      background:#fff; border-radius:20px; width:100%; max-width:620px;
      margin:auto; animation:slideUp .25s ease; box-shadow:0 20px 60px rgba(0,0,0,.2);
    }
    @keyframes slideUp { from{opacity:0;transform:translateY(24px)} to{opacity:1;transform:translateY(0)} }
    .modal-header {
      background:linear-gradient(120deg,#7C3AED,#9333EA 55%,#C026D3);
      padding:24px 24px 20px; border-radius:20px 20px 0 0;
      display:flex; justify-content:space-between; align-items:center;
    }
    .modal-header h2 { margin:0; color:#fff; font-size:1.15rem; font-weight:700; }
    .modal-close { background:rgba(255,255,255,.15); border:none; color:#fff; width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:1.1rem; display:flex; align-items:center; justify-content:center; transition:background .15s; }
    .modal-close:hover { background:rgba(255,255,255,.3); }
    .modal-body { padding:24px; }

    /* ── Form Sections ── */
    .form-section { margin-bottom:4px; }
    .form-section-title {
      font-size:0.78rem; font-weight:700; color:var(--text-muted,#6b7280);
      text-transform:uppercase; letter-spacing:.04em;
      margin:20px 0 12px; padding-bottom:6px;
      border-bottom:1.5px solid #f0f2f5; display:flex; align-items:center; gap:6px;
    }
    .form-row2 { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    @media(max-width:560px) { .form-row2 { grid-template-columns:1fr; } }

    /* ── Bottom Nav ── */

    /* ── Scan Result Badge ── */
    .scan-badge { display:inline-flex; align-items:center; gap:6px; background:#dcfce7; color:#15803d; border-radius:20px; font-size:0.78rem; font-weight:600; padding:4px 12px; margin-top:10px; }
    .scan-badge.error { background:#fee2e2; color:#b91c1c; }
  </style>
</head>
<body>
<!-- Own navbar removed — shared violet header injected by js/site-chrome.js -->

<div class="page-bg">
  <div class="container">

    <!-- Hero -->
    <div class="travelers-hero">
      <div>
        <h1>👥 المسافرون</h1>
        <p>أضف وأدر بيانات مسافريك — وفّر الوقت في كل حجز</p>
      </div>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:10px">
        <button class="btn" style="background:#fff;color:#7C3AED;font-weight:700;border-radius:12px;padding:10px 20px" onclick="openModal()">+ إضافة مسافر</button>
      </div>
    </div>

    <!-- Stats -->
    <div class="stats-bar" id="statsBar" style="display:none">
      <div class="stat-card"><div class="stat-num" id="statTotal">0</div><div class="stat-lbl">مسافرون</div></div>
      <div class="stat-card"><div class="stat-num" id="statValid">0</div><div class="stat-lbl">وثائق سارية</div></div>
      <div class="stat-card"><div class="stat-num" id="statExpiring">0</div><div class="stat-lbl">تنتهي قريباً</div></div>
    </div>

    <!-- List -->
    <div id="travelersList">
      <div style="text-align:center;padding:60px"><div class="spinner"></div></div>
    </div>

  </div>
</div>

<!-- ════════ Traveler Modal ════════ -->
<div class="modal-overlay" id="travelerModal">
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">إضافة مسافر</h2>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">

      <!-- Form -->
      <form onsubmit="saveTraveler(event)">
        <input type="hidden" id="travelerId">

        <div class="form-section-title">👤 المعلومات الشخصية</div>
        <div class="form-row2">
          <div class="form-group">
            <label class="form-label">اللقب <span style="color:red">*</span></label>
            <select class="form-control" id="tTitle" required>
              <option value="">اختر</option>
              <option value="mr">Mr — السيد</option>
              <option value="ms">Ms — السيدة</option>
              <option value="mrs">Mrs — المتزوجة</option>
              <option value="miss">Miss — الآنسة</option>
              <option value="dr">Dr — دكتور/ة</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">الجنس <span style="color:red">*</span></label>
            <select class="form-control" id="tGender" required>
              <option value="">اختر</option>
              <option value="male">ذكر</option>
              <option value="female">أنثى</option>
            </select>
          </div>
        </div>
        <div class="form-row2">
          <div class="form-group">
            <label class="form-label">الاسم الأول (إنجليزي) <span style="color:red">*</span></label>
            <input type="text" class="form-control" id="tFirst" required placeholder="First Name" dir="ltr">
          </div>
          <div class="form-group">
            <label class="form-label">الاسم الأوسط</label>
            <input type="text" class="form-control" id="tMiddle" placeholder="Middle Name" dir="ltr">
          </div>
        </div>
        <div class="form-row2">
          <div class="form-group">
            <label class="form-label">الاسم الأخير (إنجليزي) <span style="color:red">*</span></label>
            <input type="text" class="form-control" id="tLast" required placeholder="Last Name" dir="ltr">
          </div>
          <div class="form-group">
            <label class="form-label">الجنسية <span style="color:red">*</span></label>
            <select class="form-control" id="tNationality" required>
              <option value="">اختر</option>
              <option value="DZA">جزائري</option><option value="BHR">بحريني</option>
              <option value="EGY">مصري</option><option value="ARE">إماراتي</option>
              <option value="JOR">أردني</option><option value="KWT">كويتي</option>
              <option value="LBN">لبناني</option><option value="LBY">ليبي</option>
              <option value="MRT">موريتاني</option><option value="MAR">مغربي</option>
              <option value="OMN">عماني</option><option value="PSE">فلسطيني</option>
              <option value="QAT">قطري</option><option value="SAU">سعودي</option>
              <option value="SDN">سوداني</option><option value="SYR">سوري</option>
              <option value="TUN">تونسي</option><option value="YEM">يمني</option>
              <option value="USA">أمريكي</option><option value="GBR">بريطاني</option>
              <option value="FRA">فرنسي</option><option value="DEU">ألماني</option>
              <option value="IND">هندي</option><option value="PAK">باكستاني</option>
              <option value="PHL">فلبيني</option><option value="TUR">تركي</option>
              <option value="IRN">إيراني</option><option value="IDN">إندونيسي</option>
              <option value="MYS">ماليزي</option><option value="BGD">بنغلاديشي</option>
              <option value="ETH">إثيوبي</option><option value="KEN">كيني</option>
              <option value="NGA">نيجيري</option><option value="ZAF">جنوب أفريقي</option>
              <option value="CAN">كندي</option><option value="AUS">أسترالي</option>
              <option value="CHN">صيني</option><option value="JPN">ياباني</option>
              <option value="KOR">كوري</option><option value="RUS">روسي</option>
              <option value="ESP">إسباني</option><option value="ITA">إيطالي</option>
              <option value="NLD">هولندي</option><option value="SWE">سويدي</option>
              <option value="OTH">أخرى</option>
            </select>
          </div>
        </div>
        <div class="form-row2">
          <div class="form-group">
            <label class="form-label">تاريخ الميلاد <span style="color:red">*</span></label>
            <input type="date" class="form-control" id="tDob" required>
          </div>
          <div class="form-group">
            <label class="form-label">البريد الإلكتروني</label>
            <input type="email" class="form-control" id="tEmail" placeholder="email@example.com">
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">رقم الهاتف <span style="color:red">*</span></label>
          <input type="tel" class="form-control" id="tPhone" placeholder="+96599123456" required dir="ltr">
          <div style="font-size:0.73rem;color:var(--text-muted);margin-top:3px">بصيغة دولية مع رمز الدولة (مثال: +96599123456)</div>
        </div>

        <div class="form-section-title">🪪 وثيقة السفر</div>
        <div class="form-row2">
          <div class="form-group">
            <label class="form-label">نوع الوثيقة <span style="color:red">*</span></label>
            <select class="form-control" id="tDocType" required>
              <option value="passport">جواز سفر</option>
              <option value="id_card">بطاقة مدنية</option>
              <option value="national_id">هوية وطنية</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">رقم الوثيقة <span style="color:red">*</span></label>
            <input type="text" class="form-control" id="tDocNum" required placeholder="Document Number" dir="ltr">
          </div>
        </div>
        <div class="form-row2">
          <div class="form-group">
            <label class="form-label">تاريخ الإصدار</label>
            <input type="date" class="form-control" id="tDocIssue">
          </div>
          <div class="form-group">
            <label class="form-label">تاريخ الانتهاء <span style="color:red">*</span></label>
            <input type="date" class="form-control" id="tDocExp" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label">الدولة المصدرة</label>
          <input type="text" class="form-control" id="tDocCountry" placeholder="مثال: Kuwait" dir="ltr">
        </div>

        <div style="display:flex;gap:12px;margin-top:20px">
          <button type="submit" class="btn btn-primary" style="flex:1" id="saveBtn">💾 حفظ المسافر</button>
          <button type="button" class="btn btn-ghost" onclick="closeModal()">إلغاء</button>
        </div>
      </form>
    </div>
  </div>
</div>



<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/currency.js"></script>
<script src="js/i18n.js"></script>
<script>
if (!Auth.isLoggedIn()) window.location.href = 'login.html?redirect=travelers.html';
Auth.checkTokenExpiry();

let travelers = [];

/* ══════════════════════ Data ══════════════════════ */
async function loadTravelers() {
  const el = document.getElementById('travelersList');
  try {
    const res = await Api.get('/api/travelers', true);
    travelers = res.data || res.travelers || (Array.isArray(res) ? res : []);
    renderTravelers();
  } catch(err) {
    el.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><p>${err.message || 'تعذر تحميل المسافرين'}</p></div>`;
  }
}

function renderTravelers() {
  const el = document.getElementById('travelersList');
  const stats = document.getElementById('statsBar');

  if (!travelers.length) {
    stats.style.display = 'none';
    el.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">👤</div>
        <h3>لا يوجد مسافرون بعد</h3>
        <p>أضف مسافريك لتسريع عملية الحجز — يمكنك مسح الجواز تلقائياً!</p>
        <button class="btn btn-primary" onclick="openModal()">+ إضافة مسافر</button>
      </div>`;
    return;
  }

  // Compute stats
  const today = new Date();
  const soon  = new Date(); soon.setMonth(soon.getMonth() + 6);
  let validCount = 0, expiringCount = 0;
  travelers.forEach(t => {
    if (!t.document_expiry) return;
    const exp = new Date(t.document_expiry);
    if (exp > today) { validCount++; if (exp <= soon) expiringCount++; }
  });
  document.getElementById('statTotal').textContent    = travelers.length;
  document.getElementById('statValid').textContent    = validCount;
  document.getElementById('statExpiring').textContent = expiringCount;
  stats.style.display = 'grid';

  const natMap = {DZA:'جزائري',BHR:'بحريني',EGY:'مصري',ARE:'إماراتي',JOR:'أردني',KWT:'كويتي',LBN:'لبناني',LBY:'ليبي',MRT:'موريتاني',MAR:'مغربي',OMN:'عماني',PSE:'فلسطيني',QAT:'قطري',SAU:'سعودي',SDN:'سوداني',SYR:'سوري',TUN:'تونسي',YEM:'يمني',USA:'أمريكي',GBR:'بريطاني',FRA:'فرنسي',DEU:'ألماني',IND:'هندي',PAK:'باكستاني',PHL:'فلبيني',TUR:'تركي',IRN:'إيراني',IDN:'إندونيسي',MYS:'ماليزي',BGD:'بنغلاديشي',ETH:'إثيوبي',KEN:'كيني',NGA:'نيجيري',ZAF:'جنوب أفريقي',CAN:'كندي',AUS:'أسترالي',CHN:'صيني',JPN:'ياباني',KOR:'كوري',RUS:'روسي',ESP:'إسباني',ITA:'إيطالي',NLD:'هولندي',SWE:'سويدي',OTH:'أخرى'};
  const docMap = {passport:'جواز سفر',id_card:'بطاقة مدنية',national_id:'هوية وطنية'};

  el.innerHTML = `<div class="travelers-grid">${travelers.map((t,i) => {
    const initials = ((t.first_name||'?')[0] + (t.last_name||'?')[0]).toUpperCase();
    const expDate  = t.document_expiry ? new Date(t.document_expiry) : null;
    const expired  = expDate && expDate < today;
    const expiring = expDate && !expired && expDate <= soon;
    const expLabel = expDate ? expDate.toLocaleDateString('ar-KW',{day:'numeric',month:'short',year:'numeric'}) : '—';
    const expColor = expired ? '#dc2626' : expiring ? '#d97706' : '#15803d';
    const expIcon  = expired ? '🔴' : expiring ? '🟡' : '🟢';
    const fullName = [t.title ? t.title.toUpperCase()+'.' : '', t.first_name||'', t.middle_name||'', t.last_name||''].filter(Boolean).join(' ');
    return `
      <div class="traveler-card">
        <div class="traveler-card-header">
          <div class="traveler-avatar">${initials}</div>
          <div class="traveler-header-info">
            <div class="traveler-name">${fullName}</div>
            <span class="traveler-type-badge">${natMap[t.nationality]||t.nationality||'—'}</span>
          </div>
        </div>
        <div class="traveler-card-body">
          <div class="traveler-detail">
            <span class="detail-icon">🪪</span>
            <span>${docMap[t.document_type]||t.document_type||'—'}</span>
            <span class="detail-val" dir="ltr">${t.document_number||'—'}</span>
          </div>
          <div class="traveler-detail">
            <span class="detail-icon">${expIcon}</span>
            <span>انتهاء الوثيقة:</span>
            <span class="detail-val" style="color:${expColor}">${expLabel}</span>
          </div>
          ${t.date_of_birth ? `<div class="traveler-detail"><span class="detail-icon">🎂</span><span>تاريخ الميلاد:</span><span class="detail-val">${t.date_of_birth}</span></div>` : ''}
          ${t.phone_number || t.phone ? `<div class="traveler-detail"><span class="detail-icon">📱</span><span class="detail-val" dir="ltr">${t.phone_number||t.phone}</span></div>` : ''}
        </div>
        <div class="traveler-card-footer">
          <button class="btn btn-ghost btn-sm" onclick="editTraveler(${i})">✏️ تعديل</button>
          <button class="btn btn-sm" style="color:#dc2626;background:#fee2e2;border:none" onclick="deleteTraveler('${t.id}',${i})">🗑 حذف</button>
        </div>
      </div>`;
  }).join('')}</div>`;
}

/* ══════════════════════ Modal ══════════════════════ */
function openModal(traveler = null) {
  document.getElementById('modalTitle').textContent = traveler ? 'تعديل مسافر' : 'إضافة مسافر جديد';
  const set = (id, val) => { const el = document.getElementById(id); if (el) el.value = val || ''; };
  set('travelerId', traveler?.id);
  set('tTitle',      traveler?.title);
  set('tFirst',      traveler?.first_name);
  set('tMiddle',     traveler?.middle_name);
  set('tLast',       traveler?.last_name);
  set('tGender',     traveler?.gender);
  set('tNationality',traveler?.nationality);
  set('tDob',        traveler?.date_of_birth);
  set('tEmail',      traveler?.email);
  set('tDocType',    traveler?.document_type || 'passport');
  set('tDocNum',     traveler?.document_number);
  set('tDocIssue',   traveler?.document_issue);
  set('tDocExp',     traveler?.document_expiry);
  set('tDocCountry', traveler?.document_country);
  // Phone
  let ph = traveler?.phone_number || '';
  if (!ph.startsWith('+') && traveler?.phone_country_code && traveler?.phone_number)
    ph = (traveler.phone_country_code.trim() + traveler.phone_number.trim()).replace(/\s+/g,'');
  if (!ph.startsWith('+') && (traveler?.phone||'').startsWith('+'))
    ph = (traveler.phone||'').replace(/\s+/g,'');
  set('tPhone', ph);
  document.getElementById('travelerModal').classList.add('active');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('travelerModal').classList.remove('active');
  document.body.style.overflow = '';
  closeCamera();
}

function editTraveler(idx) { openModal(travelers[idx]); }

/* ══════════════════════ Save / Delete ══════════════════════ */
async function saveTraveler(e) {
  e.preventDefault();
  const id = document.getElementById('travelerId').value;
  let rawPhone = document.getElementById('tPhone').value.trim().replace(/[\s\-()]/g,'');
  if (rawPhone && !rawPhone.startsWith('+')) rawPhone = '+' + rawPhone;
  const data = {
    title:           document.getElementById('tTitle').value,
    first_name:      document.getElementById('tFirst').value.trim(),
    middle_name:     document.getElementById('tMiddle').value.trim(),
    last_name:       document.getElementById('tLast').value.trim(),
    gender:          document.getElementById('tGender').value,
    nationality:     document.getElementById('tNationality').value,
    date_of_birth:   document.getElementById('tDob').value,
    email:           document.getElementById('tEmail').value.trim(),
    phone_number:    rawPhone,
    phone:           rawPhone,
    document_type:   document.getElementById('tDocType').value,
    document_number: document.getElementById('tDocNum').value.trim(),
    issue_date:      document.getElementById('tDocIssue').value,
    expiry_date:     document.getElementById('tDocExp').value,
    document_issue:  document.getElementById('tDocIssue').value,
    document_expiry: document.getElementById('tDocExp').value,
    document_country:document.getElementById('tDocCountry').value.trim(),
  };
  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = '⏳ جاري الحفظ...';
  try {
    if (id) await Api.put('/api/travelers/' + id, data, true);
    else     await Api.post('/api/travelers', data, true);
    closeModal();
    await loadTravelers();
    showToast(id ? '✅ تم تحديث المسافر' : '✅ تم إضافة المسافر', 'success');
  } catch(err) {
    showToast(err.message || 'حدث خطأ', 'error');
  } finally {
    btn.disabled = false; btn.innerHTML = '💾 حفظ المسافر';
  }
}

async function deleteTraveler(id, idx) {
  if (!confirm('هل تريد حذف هذا المسافر؟')) return;
  try {
    await Api.delete('/api/travelers/' + id, true);
    travelers.splice(idx, 1);
    renderTravelers();
    showToast('🗑 تم حذف المسافر', 'success');
  } catch(err) {
    showToast(err.message || 'فشل الحذف', 'error');
  }
}

/* ══════════════════════ Toast ══════════════════════ */
function showToast(msg, type = 'info') {
  const t = document.createElement('div');
  t.className = 'toast toast-' + type;
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 3500);
}

/* ══════════════════════ Init ══════════════════════ */
document.getElementById('travelerModal').addEventListener('click', e => {
  if (e.target === document.getElementById('travelerModal')) closeModal();
});

loadTravelers();
</script>
