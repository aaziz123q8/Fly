<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الحجوزات — فلاي مسار</title>
  <link rel="stylesheet" href="../css/app.css">
</head>
<body class="admin-body">
<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="sidebar-brand">⚙️ FlyMasar Admin</div>
    <nav class="sidebar-nav">
      <a href="index.html">📊 لوحة التحكم</a>
      <a href="travelers.html">👥 المسافرون</a>
      <a href="bookings.html" class="active">📋 الحجوزات</a>
      <a href="coupons.html">🎟️ الكوبونات</a>
      <a href="#" onclick="adminLogout()">🚪 تسجيل الخروج</a>
    </nav>
  </aside>
  <main class="admin-main">
    <div class="admin-topbar">
      <h1>📋 الحجوزات</h1>
      <div class="topbar-actions">
        <select id="type-filter" class="form-control form-control-sm" onchange="loadBookings()">
          <option value="all">الكل</option>
          <option value="flight">رحلات</option>
          <option value="hotel">فنادق</option>
        </select>
        <select id="status-filter" class="form-control form-control-sm" onchange="loadBookings()">
          <option value="">كل الحالات</option>
          <option value="confirmed">مؤكد</option>
          <option value="pending">معلق</option>
          <option value="cancelled">ملغي</option>
        </select>
      </div>
    </div>
    <div class="admin-panel">
      <div id="bookings-loading" class="loading-state"><div class="spinner-lg"></div></div>
      <div id="bookings-table" style="display:none">
        <table class="admin-table">
          <thead><tr><th>المرجع</th><th>النوع</th><th>المستخدم</th><th>الحالة</th><th>المبلغ</th><th>التاريخ</th></tr></thead>
          <tbody id="bookings-tbody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<script src="../js/api.js"></script>
<script>
  const ADMIN_BASE = 'https://beige-hare-390642.hostingersite.com';
  const token = localStorage.getItem('admin_token');
  if (!token) window.location.href = 'login.html';
  function adminLogout() { localStorage.removeItem('admin_token'); window.location.href = 'login.html'; }
  const statusLabels = { confirmed: ['مؤكد','success'], pending: ['معلق','warning'], cancelled: ['ملغي','error'], completed: ['مكتمل','info'] };

  async function loadBookings() {
    document.getElementById('bookings-loading').style.display = 'flex';
    document.getElementById('bookings-table').style.display = 'none';
    const type = document.getElementById('type-filter').value;
    const status = document.getElementById('status-filter').value;
    const q = `?type=${type}${status ? '&status='+status : ''}`;
    const res = await fetch(ADMIN_BASE + '/api/admin/bookings' + q, { headers: { 'Authorization': 'Bearer ' + token } });
    if (res.status === 401) { adminLogout(); return; }
    const data = await res.json();
    document.getElementById('bookings-loading').style.display = 'none';
    document.getElementById('bookings-table').style.display = 'block';
    const bookings = data.data || [];
    const [label, cls] = statusLabels;
    document.getElementById('bookings-tbody').innerHTML = bookings.map(b => {
      const [sl, sc] = statusLabels[b.status] || [b.status, 'info'];
      return `<tr>
        <td><strong>${b.booking_reference}</strong></td>
        <td>${b.booking_type === 'flight' ? '✈️ رحلة' : '🏨 فندق'}</td>
        <td>${b.user_email || b.user_id}</td>
        <td><span class="badge badge-${sc}">${sl}</span></td>
        <td>${b.total_amount} ${b.currency}</td>
        <td>${new Date(b.created_at).toLocaleDateString('ar')}</td>
      </tr>`;
    }).join('') || '<tr><td colspan="6" class="text-center">لا توجد حجوزات</td></tr>';
  }

  loadBookings();
</script>
</body>
</html>
